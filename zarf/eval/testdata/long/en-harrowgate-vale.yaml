title: Harrowgate Vale
text: |
  Harrowgate Vale is a market town of about eleven thousand people in the lowlands of northern England, set on the River Wend where the river leaves a belt of low limestone hills and begins to wander across a wide floodplain. The town is known across the region for its Thursday market, which has been held in the same square since the thirteenth century, and for the hard, crumbly cheese that bears its name. Its streets are lined with brick and stone houses of the seventeenth and eighteenth centuries, and the tower of St Aldwyn's church, built of pale local stone, can be seen from every approach road. Visitors tend to describe it as a place where little has changed, though the town has in fact been rebuilt several times after fires and floods.

  The economy of the vale has always rested on the land around it. Dairy farms supply the cheese makers, the sheep pastures on the hills once supplied a wool trade, and the arrival of the railway in the nineteenth century turned a modest market into a regional centre for livestock and grain. In the twentieth century the town added light industry, a small hospital and a college of further education. Today it is a commuter town for the larger city of Dunmere to the east, and a destination for walkers, cyclists and people who come for the food. The population grew slowly through the last century and has been stable for twenty years.

  ## Geography and climate

  The town lies in a shallow bowl in the valley of the Wend, about forty metres above sea level. To the north and west rise the Harrow Hills, a ridge of limestone that reaches three hundred metres and is cut by narrow dry valleys. To the south and east the land flattens into the water meadows and drained fields known locally as the Levels. The river runs along the southern edge of the old town, crossed by a stone bridge of five arches and, a little downstream, by an iron footbridge put up in 1887.

  The climate is mild and damp, with rain through all seasons and a mean annual rainfall of about eight hundred millimetres, most of it falling on the hills. Winters are cool but rarely severe, and summers are warm enough for the hay to be cut twice. Mist often lies on the Levels in the early morning, and the river rises quickly after prolonged rain, a feature of the place that shapes much of its history.

  Wildlife is rich on the Levels. Lapwings and curlews nest in the wet fields in spring, otters have returned to the Wend in the last twenty years, and the old hedgerows shelter dormice and hawthorn berries for winter thrushes. Much of the water meadow to the south is farmed under a conservation agreement, which obliges farmers to delay cutting until the ground-nesting birds have fledged. Roads on the Levels are narrow and raised on causeways, and a few of them are impassable for days when the river is in spate.

  ## History

  A settlement existed on the site in the early Middle Ages, when a small community of farmers and a hermit named Aldwyn lived beside a ford. The name of the town is thought to come from an old word for a gate in a hedge, and from the vale in which it sits. By the twelfth century, a market charter had been granted by the lord of the manor, and the square was laid out with a cross at its centre. The wool trade made the town prosperous in the fourteenth century, and merchants built the surviving timber-framed houses on Fleece Row.

  The seventeenth century brought two disasters. A fire in 1641 destroyed most of the buildings on the north side of the square, and the rebuilding in brick gave the town the regular appearance it keeps today. A great flood in 1698 carried away the original medieval bridge and drowned nearly forty people, an event commemorated by a brass plate on the present bridge. The town recovered by turning from wool to dairy farming and to the trade in cattle driven south to the cities.

  Industrial change arrived slowly. A corn mill, a foundry and a small brewery were built beside the river in the eighteenth century, and a canal link to the wider network opened in 1790, though it was never profitable and was replaced within two generations. The railway, opened in 1853, ended the cattle drives and brought the town closer to the markets of the cities. In the twentieth century, the foundry closed, the brewery was bought by a larger firm, and the old canal basin was filled in to make a car park.

  Both world wars took young men from the town, and the names of the dead are listed on a granite memorial in the square. After 1945 the borough grew with new housing estates on the eastern edge, and the arrival of the road bypass in 1974 relieved the old centre of heavy lorries. The market square was pedestrianised in 1998.

  ## Economy and local government

  Alongside the cheese dairies, the town's economy now rests on a mixture of small firms. A seed merchant, two printing works, a maker of agricultural trailers and a firm that restores clocks together employ about nine hundred people. The Thursday market still hosts around ninety stalls, of which a third sell food, and a covered hall behind the square houses a weekly sale of second-hand books and tools. Shops in the high street have suffered from the growth of online buying, but a scheme that lets small traders rent premises at reduced rates has kept most of the units occupied.

  Tourism has grown in importance. Guest houses and cottages provide about six hundred beds, and the long-distance footpath that crosses the Harrow Hills passes through the town, bringing walkers in spring and autumn. The college of further education, with about two thousand students, trains people in catering, farming and building crafts, and several graduates have started businesses in the town.

  The town is governed by a parish council of twelve members, which looks after the market, the cemetery, the recreation ground and the public toilets, while a district council in Dunmere is responsible for planning, housing and the collection of rubbish. Relations between the two have not always been easy, particularly over the question of building on the Levels, but a neighbourhood plan agreed by referendum in 2019 now limits new housing to land above the flood line.

  ## Cheese making

  The best known product of Harrowgate Vale is the cheese that carries its name, a firm, pale, slightly crumbly cheese with a clean sharp taste and a trace of sweetness at the end. It was first made on the farms of the Levels, where the cows graze on the rich grass of the water meadows, and from at least the sixteenth century it was carried to the weekly market in cloth bundles. The cheese was originally made by farmers' wives from the milk of a single morning, a custom that gave each farm its own recognisable style.

  The method has changed little in principle. Raw or lightly warmed milk is mixed with a starter culture and with rennet, a substance from the stomach of a calf that makes the milk set into a soft curd. The curd is cut into small pieces with wire frames, gently heated, stirred and drained of whey. It is then cut into slabs and piled on top of each other in a process called cheddaring, which squeezes out more whey and gives the cheese its firm, flaky texture. The slabs are milled into small pieces, salted, packed into moulds lined with cloth and pressed for a day and a night.

  Ripening is the final and longest stage. The cheeses are wrapped in cloth and sealed with lard, and then left in cool, damp cellars for between four and eighteen months. The cellars of the old foundry at Harrowgate Vale, which keep a steady temperature all year, are now used by a cooperative of eleven dairies. A mature cheese develops small crystals of calcium lactate, which crunch pleasantly when eaten. The oldest cheeses are served at the autumn cheese fair, where judges award a prize that makes a visible difference to the price a farm can ask.

  Cheese making has faced pressure in recent decades from supermarket buying and from competitors that copy the name. In 2004, the dairies formed their own association, which set rules on the area of production, the type of milk and the length of ageing. A dozen farms continue to make cheese by hand, and the cooperative sells a younger, milder version to shops in the city, while the traditional cheese is sold at the farm gate and in the market.

  ## The Vale Railway

  The Vale Railway was built to carry cattle and corn to the cities, and in its first decade it did so with great success. The line left the main route at Dunmere Junction and ran west for twenty-two miles along the river valley, crossing the Wend three times on iron bridges before reaching the terminus at Harrowgate Vale. The engineer, Josiah Brandt, chose a gentle gradient and a route that avoided the worst of the floodplain, though a section on an embankment near the Levels proved difficult and was damaged several times by high water.

  The station at Harrowgate Vale, completed in 1853, is a handsome building in yellow brick with a long glass canopy and a goods shed that could hold forty wagons. A cattle dock and a pen with room for six hundred animals stood at the end of the platform. On market days, special trains carried sheep and cattle out, and in the autumn the cheese cellars sent several tonnes a week to Dunmere and onward to the cities of the south. A branch line to the limestone quarries in the Harrow Hills opened in 1869 and carried stone for road building until the quarries closed in 1958.

  Passenger traffic peaked in the years before the First World War, when twelve trains a day ran in each direction and commuters travelled to offices in Dunmere. The line survived the national cuts of the 1960s, but only after a vigorous local campaign, and it was reduced to a single track with an unstaffed station at the terminus. The goods yard was closed in 1971 and the cattle dock was demolished.

  In recent years the railway has enjoyed a modest revival. A community group restored the glass canopy in 2011, and the timetable has increased to an hourly service. A heritage society runs steam trains on summer weekends over the old quarry branch, with volunteers working as drivers, firemen and guards. The railway remains the quickest way to reach Dunmere, and the one mode of transport that does not close when the river floods.

  ## Culture and notable visitors

  The town has an active cultural life for its size. The Corn Exchange, built in 1862, serves as a theatre and cinema, and the museum in the old grammar school displays the town's collection of agricultural tools, costumes and early photographs. A small arts festival is held every June, and the cheese fair in October draws as many as ten thousand visitors for a weekend.

  Over the years the town has attracted a few people from outside. The footballer Dario Venn stayed at the Black Horse Inn for a night in 1994 on his way to a charity match, and the landlord still displays the signed shirt he left behind. In 2009, parts of a television drama about a Victorian doctor were filmed on Fleece Row, and the production covered the street in sand for a fortnight. A passing astronomer, Imelda Crowe, once recorded a comet from the roof of the church tower, according to the parish magazine.

  ## Flood defences

  The River Wend has flooded the town many times, most seriously in 1698, 1795, 1947 and 2015. Because the town stands on the edge of a broad floodplain, the water spreads quickly across the Levels and enters the lower streets within a few hours of heavy rain in the hills. For centuries, residents responded with temporary measures such as sandbags and raised thresholds, and a line of marks on the wall of the old bridge records the height of each flood.

  The first permanent protection was built in the 1950s, after the great flood of 1947, when an earth bank was raised along the river bank and a pumping station was installed to lift water from the town drains over the bank. The scheme gave a false sense of security. In December 2015, a storm that dropped a month's rain in two days overtopped the bank, flooded three hundred homes and closed the market for six weeks. Residents were rescued by boat from the first floors of houses in Mill Lane.

  The scheme built after 2015, completed in 2021, takes a different approach. Instead of simply raising the bank, the engineers created an area of washland upstream of the town, where the river is allowed to spill onto fields on purpose and hold back the peak of the flood. Along the river through the town, glass panels set in a low wall allow views of the water while holding it back, and demountable steel barriers can be fixed across the road at the bridge in under two hours. The pumping station was rebuilt with larger pumps and a standby generator.

  The scheme also included work in the hills, where landowners were paid to plant woodland, block old drainage ditches and restore peat, so that rain runs off more slowly. Early results show a reduction in the speed of the flood peak, though the winter of 2023 tested the system harder than any engineer would have wished. The barriers held, the market opened on schedule, and the water on the Levels receded within three days.

  ## Brass band tradition

  Harrowgate Vale is known among music lovers for its brass band, founded in 1868 by workers at the foundry as a way of passing the long evenings. The band rehearsed in a loft above the brewery, and its members wore blue uniforms with red braid purchased by subscription from the whole town. Within twenty years it was winning contests in the north of England, and its photograph hangs in the Corn Exchange beside the town's other prizes.

  Brass bands of this kind are community institutions with a distinct repertoire. Their instruments, cornets, flugelhorns, tenor horns, euphoniums and trombones, are all conical or cylindrical brass tubes pitched in the same family, so the band sounds smooth and warm. The conductor, called a bandmaster, trains players of all ages, and a junior band feeds the senior one. A good cornet player in the town is expected to begin at the age of eight.

  The band plays at civic occasions, at the cheese fair and each Remembrance Sunday in the market square. It travels to the national finals every other year, and in 2017 it came third in the second section. The foundry building that once held the cheese cellars now has a rehearsal room, funded by a grant and by an annual raffle, which gives the band its first permanent home in a century and a half.
