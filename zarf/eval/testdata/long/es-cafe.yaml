id: es-cafe
lang: es
title: "El café"
text: |
  El café es una bebida que se obtiene de las semillas tostadas y molidas del cafeto, un arbusto tropical originario de las tierras altas de África oriental. Se consume caliente o frío, solo o con leche, y es una de las infusiones más difundidas del mundo, solo por detrás del agua y del té. Su popularidad se debe en buena parte a la cafeína, un alcaloide que combate la somnolencia y mejora la atención durante unas horas, pero también al aroma intenso y al sabor amargo y complejo que se desarrolla con el tueste.

  Detrás de cada taza hay una cadena larga que empieza en pequeñas fincas de montaña, pasa por beneficios húmedos donde se despulpa y se lava el grano, continúa en barcos y almacenes y termina en la tostadora de un barrio o en la cocina de una casa. Millones de familias viven de este cultivo, y la bebida ha dado forma a hábitos sociales, a barrios enteros y a un comercio que mueve cifras comparables a las de las grandes materias primas.

  ## Origen e historia

  La tradición sitúa el descubrimiento del café en las montañas de Etiopía, donde los cafetos crecen de manera silvestre a la sombra de árboles más altos. Cuenta una leyenda que un pastor, Kaldino, observó que sus cabras se mostraban inquietas y retozonas tras comer los frutos rojos de un arbusto, y que un monje al que se lo contó probó a hervirlos y descubrió que la bebida lo mantenía despierto durante las oraciones nocturnas. No hay pruebas de que el episodio ocurriera, pero la historia muestra el vínculo temprano entre el café y las comunidades religiosas.

  Los primeros testimonios fiables de su consumo proceden de la península arábiga, hacia el siglo XV. Los monasterios sufíes de la región lo tomaban para velar durante la noche, y desde allí se difundió a los puertos del mar Rojo. El cultivo se mantuvo bajo estricto control: los comerciantes exportaban el grano tostado o hervido para evitar que alguien pudiera sembrarlo en otras tierras. Esa vigilancia se perdió cuando algunos viajeros lograron sacar semillas fértiles, y plantas jóvenes llegaron a jardines botánicos de varias ciudades europeas.

  A partir del siglo XVII el café se extendió por Europa, donde despertó recelos antes de ser aceptado. Hubo quien lo consideró una bebida peligrosa, y más de un gobernante intentó prohibirla o gravarla, sin éxito duradero. Las potencias coloniales instalaron plantaciones en islas del Caribe, en Indonesia y en Brasil, y el cultivo se asentó a costa del trabajo forzado de miles de personas. Cuando la esclavitud fue abolida, las plantaciones recurrieron a otras formas de mano de obra, y en el siglo XIX el café se convirtió en una de las principales exportaciones de varios países americanos, por encima de cualquier otro producto agrícola.

  En los territorios hispanos el cultivo llegó con los comerciantes y los misioneros. Las primeras plantas cruzaron el Atlántico ya avanzado el siglo XVIII y se aclimataron con rapidez en las laderas húmedas de las islas y del continente. Pronto las haciendas cafetaleras sustituyeron a otros cultivos, y en regiones enteras el ritmo del año quedó marcado por el calendario de la cosecha, con una temporada de recolección en la que familias enteras se desplazaban a las fincas.

  ## La planta y su cultivo

  El cafeto pertenece a la familia de las rubiáceas y puede crecer hasta diez metros si se deja sin podar, aunque en las fincas se mantiene por debajo de los tres para facilitar la cosecha. Se conocen más de cien especies, pero solo dos tienen peso comercial: la arábica, de sabor más fino y menor cafeína, que se cultiva por encima de los novecientos metros, y la robusta, más resistente y amarga, propia de altitudes bajas y climas más cálidos. Las flores blancas, de aroma parecido al jazmín, duran apenas unos días, y el fruto, la cereza, tarda entre siete y once meses en madurar.

  Cada cereza contiene normalmente dos semillas planas unidas por su cara interior, los granos. En ocasiones solo se desarrolla una, redondeada, y se vende como caracolillo. La recolección se hace a mano en las fincas pequeñas, escogiendo cada vez solo los frutos maduros, o bien por medios mecánicos y por peinado de las ramas en las fincas grandes. Después del corte hay que procesar la cereza con rapidez para que no se estropee.

  El procesamiento puede seguir tres vías. En el método húmedo se retira la pulpa con una máquina, se deja fermentar el grano durante uno o dos días y se lava con agua abundante; en el método seco la cereza se extiende al sol entera y se retira la cáscara al final; en el método de miel, o semilavado, se conserva parte del mucílago pegajoso durante el secado. Cada vía deja un perfil de sabor distinto: el lavado es más limpio y ácido, el seco más dulce y afrutado. El grano resultante, todavía verde y sin sabor a café, se almacena en sacos de yute hasta su venta.

  El cafeto es exigente. Pide temperaturas suaves, lluvia bien repartida y suelos profundos y bien drenados, preferiblemente de origen volcánico. Padece plagas como la broca y enfermedades como la roya, un hongo que cubre las hojas de manchas anaranjadas y puede arruinar una cosecha entera. En la finca de El Mirador, en una región de cordillera, los productores sustituyeron hace años sus variedades antiguas por otras resistentes a la roya, y plantaron árboles de sombra para proteger los suelos y atraer a las aves.

  ## Tueste y molienda

  El tueste transforma el grano verde, duro y casi inodoro, en el café que conocemos. Se calienta a temperaturas que oscilan entre los ciento ochenta y los doscientos veinticinco grados durante diez a veinte minutos, y en ese tiempo ocurren cambios químicos profundos. Primero el grano pierde agua y amarillea; después, entre los ciento noventa y los doscientos grados, se oyen unos chasquidos secos llamados primer crack, que indican que las estructuras internas se rompen y que empieza el desarrollo del aroma; si se prolonga el tueste, llega un segundo crack, más suave, con el que se obtienen granos oscuros y aceitosos.

  Las reacciones responsables del sabor son sobre todo las de Maillard, entre azúcares y aminoácidos, y la caramelización de los propios azúcares. De ellas resultan cientos de compuestos aromáticos: notas de pan tostado, chocolate, frutos secos, caramelo, flores o frutas rojas según el origen y el punto de tueste. Un tueste claro conserva la acidez y los matices del grano; uno medio equilibra dulzor y cuerpo; uno oscuro aporta amargor y notas ahumadas que ocultan las diferencias entre orígenes. Los tostadores profesionales controlan la curva de temperatura con sondas y registran cada lote, porque diferencias de un minuto cambian el resultado.

  Una vez tostado, el grano se enfría rápido con aire para frenar las reacciones y se deja reposar unos días, durante los cuales libera dióxido de carbono. El café recién tostado conserva su mejor sabor durante dos o tres semanas, y se estropea por efecto del oxígeno, de la luz y de la humedad. Por eso se vende en bolsas con válvula y se aconseja comprarlo en cantidades pequeñas.

  En un taller de las afueras de Valparaíso del Sur, la tostadora de la cooperativa Sol de la Sierra, una máquina de tambor de los años setenta, sigue en uso junto a otra moderna con control informático. En sus paredes de ladrillo se grabó una vez el videoclip de un conjunto de rock local, que aprovechó el humo y el olor del tueste para ambientar la escena.

  La molienda debe adaptarse al método de preparación. Un molinillo de muelas produce un tamaño de partícula uniforme, mientras que uno de cuchillas deja polvo junto a trozos grandes y da una extracción desigual. El café muy fino se emplea en el espresso; el medio, en el filtro; el grueso, en la prensa francesa. Molerlo justo antes de prepararlo evita que el aroma se escape: el café molido pierde buena parte de su carácter en minutos.

  ## Métodos de preparación

  Preparar café consiste en disolver en agua caliente los compuestos solubles del grano molido. Si se extrae poco, la bebida resulta ácida y aguada; si se extrae demasiado, amarga y áspera. Los parámetros que controlan el resultado son la proporción entre café y agua, el tamaño de la molienda, la temperatura, que ronda los noventa y cuatro grados, y el tiempo de contacto.

  El espresso nació en Italia a comienzos del siglo XX con la máquina de presión, que fuerza el agua a unas nueve atmósferas a través de un puck de café fino durante veinticinco o treinta segundos. El resultado es una bebida corta, concentrada y cubierta por una capa de espuma de color avellana, la crema. De ella derivan el cortado, el cappuccino, el café con leche y el americano, que añade agua caliente. En muchos países de lengua española, el café de la mañana se toma con leche y acompaña a una tostada o a un bollo.

  Los métodos de filtro vierten agua caliente sobre el café molido contenido en un cono de papel o tela, y la gravedad hace el resto. Producen tazas limpias, de cuerpo ligero, en las que se aprecian las notas del origen. La cafetera de émbolo, o prensa francesa, deja el café en infusión varios minutos y lo separa con una malla metálica; da un cuerpo más pesado y algo de sedimento. La cafetera italiana, o moka, hace subir el agua hirviendo por un tubo a través del café y logra una bebida intensa que, sin llegar a la presión del espresso, se acerca en fuerza. En Turquía y en Oriente Próximo se hierve el café finísimo con azúcar en un pequeño cazo de cobre, el cezve, y se sirve sin colar, de modo que el poso queda en el fondo de la taza.

  Más recientemente han ganado terreno los preparados en frío. El cold brew deja el café grueso en agua fría entre doce y veinte horas y produce una bebida suave, de poca acidez. Existen también las cápsulas, cómodas pero criticadas por los residuos que generan, y las cafeteras automáticas que muelen y preparan en un solo gesto. La cata sistematiza el juicio sobre una taza. Los catadores sorben el café con fuerza para extenderlo por la boca y valoran la fragancia, la acidez, el cuerpo, el dulzor y el regusto, y anotan sus impresiones en fichas con puntuaciones que sirven para fijar el precio de los lotes. Una rueda de sabores ayuda a ponerles nombre: cítrico, floral, achocolatado, especiado, a nuez. Con la práctica, hasta quien lo bebe en casa aprende a distinguir una taza equilibrada de otra desbalanceada.

  En cualquier caso, la calidad del agua cuenta: un agua muy dura apaga el sabor y deja cal en las máquinas.

  ## Cafeterías y vida social

  La cafetería es una institución con historia propia. Las primeras casas de café abrieron en La Meca y en Constantinopla en el siglo XVI, y pronto fueron centros de conversación, de música y de juego, hasta el punto de que algunas autoridades las vieron como focos de sedición. En Europa se multiplicaron a partir del siglo XVII; en Londres se las llamó universidades de a penique porque con una moneda pequeña se podía entrar, tomar una taza y escuchar discusiones sobre ciencia y política. Los cafés de Viena, París y Trieste se hicieron célebres como lugares de tertulia donde se encontraban escritores, pintores y músicos.

  En el mundo hispano el café ocupa un lugar central. Los cafés históricos de las grandes ciudades conservan mármoles, espejos y mostradores de madera, y siguen siendo espacios de lectura y de conversación pausada. El ritual del cafecito de la tarde, el de media mañana en el bar o la sobremesa interminable estructuran la jornada de millones de personas. En la ciudad de Valparaíso del Sur, el café Los Naranjos, abierto en 1911, mantiene la tradición de las mesas de ajedrez y de las tertulias del jueves, y su dueña, Remedios Cárdenas, asegura que nunca ha cerrado más de un día seguido.

  El modelo contemporáneo de cafetería se ha diversificado. Junto a las cadenas internacionales, que ofrecen bebidas estandarizadas y wifi, crecen los locales de café de especialidad, con una carta corta, granos de un solo origen y baristas que explican cada preparación. Los llamados terceros lugares, ni casa ni trabajo, atraen a quienes teletrabajan, estudian o simplemente buscan compañía. Algunas cafeterías funcionan además como centros de barrio, con exposiciones, presentaciones de libros y mercadillos.

  El vocabulario también refleja la cultura: pedir un cortado, un solo, un carajillo o un café bombón significa cosas diferentes según el país y la ciudad, y los camareros lo saben bien. En 1998, el equipo de balonmano del barrio celebró allí su ascenso de categoría, y la camiseta enmarcada sigue colgada junto a la barra.

  Algunas ciudades han hecho de sus cafés un patrimonio protegido. Se catalogan los locales con más de cien años, se subvencionan las reformas que respetan el mobiliario original y se impide que cambien de uso sin un informe municipal. A cambio, los propietarios se comprometen a mantener abiertas las puertas al público y a conservar las tertulias, que son la parte menos tangible y más frágil de ese patrimonio.

  ## Mercado, comercio justo y futuro

  El café es una de las materias primas más negociadas del planeta. Se produce en más de setenta países, sobre todo en una franja cercana al ecuador, y se consume en gran parte en Europa, América del Norte y Asia oriental. Su precio se fija en bolsas de futuros, y fluctúa con la meteorología, con las cosechas de los grandes productores y con la especulación. Una helada en una región brasileña o una sequía en una zona de África pueden duplicar el precio en meses, y los pequeños productores, que dependen de intermediarios para vender, soportan el riesgo con muy poco margen.

  Para corregir esa desigualdad nacieron los sellos de comercio justo, que garantizan a las cooperativas un precio mínimo y una prima para proyectos comunitarios. Funcionan mediante certificaciones y auditorías, y han mejorado la situación de muchas comunidades, aunque se discute su alcance y su coste. Otros sistemas, como el comercio directo, permiten que un tostador compre al mismo agricultor año tras año y pague por encima del mercado a cambio de una calidad constante. La cooperativa Sol de la Sierra reúne a unas ochocientas familias de caficultores, y con su prima ha construido una escuela y un centro de beneficiado compartido.

  La logística es otra pieza decisiva. El grano verde viaja en contenedores revestidos para absorber la humedad, y las demoras en los puertos o el calor excesivo en las bodegas pueden estropear un lote. Los importadores almacenan el café en almacenes climatizados y lo distribuyen a los tostadores a lo largo del año, de modo que la bebida que se toma en febrero procede a menudo de una cosecha recogida en el verano anterior.

  El cambio climático plantea el desafío mayor. Las temperaturas más altas empujan el cultivo hacia mayores altitudes, donde la superficie disponible es menor, y favorecen la expansión de la roya y la broca. Se investiga la mejora genética de variedades tolerantes, el cultivo bajo sombra y la recuperación de especies silvestres, y se ensayan sistemas agroforestales que combinan el cafeto con frutales y maderables. Al mismo tiempo, los consumidores empiezan a preguntar por el origen de lo que beben, lo que abre una oportunidad para quienes producen con prácticas sostenibles.

  También hay una dimensión de salud que acompaña al producto. Las investigaciones sobre el consumo moderado, de tres o cuatro tazas diarias, lo asocian con ciertos beneficios, pero desaconsejan el exceso a las personas con arritmias, a las embarazadas y a quienes sufren insomnio. Existe el café descafeinado, al que se le retira casi toda la cafeína con agua o con disolventes autorizados, y una larga tradición de sucedáneos hechos de cebada o achicoria que se bebieron en épocas de escasez.
