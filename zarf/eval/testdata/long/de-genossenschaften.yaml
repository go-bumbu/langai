id: de-genossenschaften
lang: de
title: Genossenschaften
text: |
  Eine Genossenschaft ist ein Zusammenschluss von Personen oder Unternehmen, die gemeinsam ein wirtschaftliches Ziel verfolgen und dabei nicht in erster Linie nach hohem Gewinn streben, sondern ihre Mitglieder fördern wollen. Wer Mitglied wird, erwirbt einen oder mehrere Anteile und ist damit zugleich Miteigentümer und Nutzer des gemeinsamen Unternehmens. Das unterscheidet die Genossenschaft grundlegend von der Aktiengesellschaft, bei der Kapitalgeber im Vordergrund stehen, und von einem gewöhnlichen Verein, der meist ideelle Zwecke verfolgt.

  Der Gedanke dahinter ist alt und einfach: Was einer allein nicht schaffen kann, gelingt vielen gemeinsam. Kleine Bauern, Handwerker oder Mieter bündeln ihre Kräfte, kaufen gemeinsam ein, verkaufen gemeinsam, nehmen gemeinsam Kredite auf oder bauen gemeinsam Häuser. Im deutschsprachigen Raum gibt es heute viele Tausend Genossenschaften mit Millionen von Mitgliedern, von der kleinen Dorfmolkerei bis zur großen Bank. Die Vereinten Nationen haben der Idee ein eigenes internationales Jahr gewidmet, und in vielen Ländern gilt sie als wichtige dritte Säule neben privaten und staatlichen Unternehmen.

  ## Grundprinzipien

  Drei Grundsätze prägen fast jede Genossenschaft: Selbsthilfe, Selbstverwaltung und Selbstverantwortung. Mit Selbsthilfe ist gemeint, dass die Mitglieder ihre Probleme nicht auf Dritte abwälzen, sondern gemeinsam lösen. Selbstverwaltung bedeutet, dass die Mitglieder über ihr Unternehmen selbst bestimmen, und zwar nach dem Grundsatz: ein Mitglied, eine Stimme. Es spielt keine Rolle, ob jemand einen Anteil oder hundert besitzt, in der Generalversammlung zählt jede Stimme gleich. Selbstverantwortung schließlich verpflichtet jedes Mitglied, für die Folgen der gemeinsamen Entscheidungen einzustehen.

  Hinzu kommt das Förderprinzip. Der Zweck der Genossenschaft ist nicht die Rendite, sondern der Nutzen für die Mitglieder. Ein Winzer, der seine Trauben an die Kellereigenossenschaft liefert, erhält dafür einen fairen Preis und Zugang zu Maschinen, die er allein nie bezahlen könnte. Ein Mieter in einer Wohnungsgenossenschaft zahlt eine Nutzungsgebühr, die ohne Gewinnaufschlag nur die Kosten deckt. Überschüsse werden zum Teil in Rücklagen gesteckt, zum Teil als Dividende ausgeschüttet, oft aber auch als Rückvergütung nach dem Umfang der Geschäfte mit der Genossenschaft verteilt.

  Dazu gehören offene Mitgliedschaft und Freiwilligkeit. Jeder, der die Voraussetzungen erfüllt, kann beitreten und auch wieder austreten, wobei der Anteil zurückgezahlt wird. Viele Genossenschaften legen zudem Wert auf Bildung und Information der Mitglieder und auf die Zusammenarbeit mit anderen Genossenschaften in der Region.

  Nicht zuletzt gilt der Grundsatz der Identität von Eigentümer und Kunde. Wer bei der Genossenschaft einkauft, spart oder wohnt, ist zugleich einer der Eigentümer. Dadurch entsteht ein Interesse an einem langfristig stabilen Unternehmen, das über das Tagesgeschäft hinausgeht. Mitglieder verkaufen ihre Anteile selten aus Spekulation, sondern behalten sie oft ein Leben lang und geben sie manchmal an ihre Kinder weiter.

  ## Von den Anfängen bis heute

  Zusammenschlüsse zur gegenseitigen Hilfe gab es lange vor der Industrialisierung, etwa Deichgenossenschaften, Almgemeinschaften oder Zünfte. Die moderne Genossenschaft entstand jedoch im neunzehnten Jahrhundert, als Hungerjahre und der Strukturwandel viele Bauern und Handwerker in die Verschuldung trieben. Im Dorf Hohenfelde gründete der Gemeindevorsteher Anselm Kruse nach einem Missernte-Winter einen Hilfsverein, aus dem sich später eine Spar- und Darlehenskasse entwickelte. Seine Idee war es, dass wohlhabendere Bauern für die Schulden der ärmeren mithaften und so zu günstigen Zinsen Geld beschafft werden konnte.

  Ähnliche Gründungen folgten in vielen Städten und Dörfern. Händler schlossen sich zu Einkaufsgenossenschaften zusammen, um Rohstoffe billiger zu erhalten, Arbeiter gründeten Konsumvereine, in denen sie Lebensmittel zu fairen Preisen kauften. Die Bewegung erhielt bald einen rechtlichen Rahmen, der es den Genossenschaften ermöglichte, als eigene juristische Person aufzutreten und Verträge zu schließen. Damit wurde sie berechenbarer und für Geldgeber glaubwürdiger.

  Im zwanzigsten Jahrhundert wuchsen viele Genossenschaften zu Großbetrieben heran. In politisch schwierigen Zeiten wurden sie teilweise gleichgeschaltet oder aufgelöst, nach den Kriegen entstanden sie neu. Seit den siebziger Jahren fusionierten viele kleine Kassen und Molkereien zu größeren Einheiten, weil sich die Anforderungen an Technik und Verwaltung stark erhöht hatten. Seit der Jahrtausendwende erlebt die Idee eine Wiederbelebung, vor allem bei neuen Aufgaben wie der Energieversorgung, dem gemeinsamen Betrieb von Dorfläden und der Pflege von Gemeinschaftsgärten.

  ## Rechtsform und Organe

  Die Genossenschaft ist eine juristische Person mit eigenem Vermögen. Sie wird durch ein Statut, die Satzung, geregelt, das Zweck, Namen, Sitz, Höhe der Anteile und Rechte der Mitglieder festlegt. Zur Gründung sind mindestens drei Personen nötig, und das Unternehmen muss in ein Register eingetragen werden. Dort wird auch geprüft, ob die Satzung den gesetzlichen Vorgaben entspricht.

  Drei Organe lenken die Geschäfte. Der Vorstand führt die Genossenschaft im Alltag und vertritt sie nach außen. Der Aufsichtsrat, dessen Mitglieder aus dem Kreis der Genossen gewählt werden, überwacht den Vorstand und prüft den Jahresabschluss. Die Generalversammlung, in größeren Genossenschaften als Vertreterversammlung organisiert, ist das oberste Entscheidungsgremium: Sie wählt den Aufsichtsrat, beschließt über Satzungsänderungen und entscheidet über die Verwendung des Überschusses. Eine Besonderheit ist die Pflichtprüfung. Jede Genossenschaft muss sich regelmäßig von einem Prüfverband untersuchen lassen, der nicht nur die Zahlen kontrolliert, sondern auch die Geschäftsführung bewertet. Diese Einrichtung gilt als einer der Gründe, weshalb Genossenschaften bei Insolvenzen deutlich seltener auftreten als andere Unternehmensformen.

  Wer Mitglied einer Genossenschaft ist, haftet je nach Satzung nur mit seinem Anteil oder zusätzlich mit einer begrenzten Nachschusspflicht. Die meisten modernen Genossenschaften haben die Nachschusspflicht ausgeschlossen, damit niemand Sorge haben muss, im Notfall mit dem Privatvermögen einstehen zu müssen. Dafür bilden sie größere Rücklagen, auf die sie in schlechten Jahren zurückgreifen können.

  ## Genossenschaftsbanken

  Die Kreditgenossenschaften zählen zu den ältesten und größten Zweigen der Bewegung. Eine Volksbank oder Spar- und Darlehenskasse im klassischen Sinn gehört ihren Kunden: Wer ein Konto führt oder einen Kredit aufnimmt, kann zugleich Anteilseigner werden und bei der Vertreterwahl mitstimmen. Das Geschäftsmodell ist bewusst bodenständig. Die Bank sammelt Spareinlagen in der Region und vergibt sie als Kredite an Handwerker, Landwirte und Familien aus derselben Region. Das Risiko bleibt überschaubar, weil die Mitarbeiter ihre Kunden meist persönlich kennen.

  In der Bank der Hohenfelder Sparer eG, die auf die Gründung durch Anselm Kruse zurückgeht, entscheidet noch heute ein Kreditausschuss mit ortskundigen Mitgliedern über größere Darlehen. Dieser Ausschuss prüft nicht nur Zahlen, sondern auch, ob ein Vorhaben zur Gemeinde passt. Eine Bäckerei mit Nachfolgeproblem hat dort bessere Aussichten als ein Anlageprojekt, das nur schnellen Gewinn verspricht. Spitzeninstitute und Verbundeinrichtungen stehen den kleinen Banken zur Seite, übernehmen Zahlungsverkehr, Wertpapiergeschäfte und Versicherungen und sorgen dafür, dass sie auch gegenüber Großbanken konkurrenzfähig bleiben.

  Eine Sicherungseinrichtung schützt die Einlagen: Gerät eine Bank in Schwierigkeiten, springen die übrigen Institute des Verbunds ein, bevor ein Kunde Geld verliert. Dieses System hat sich in Krisenzeiten bewährt. Kritiker bemängeln allerdings, dass größere Institute sich in ihrem Auftreten kaum noch von gewöhnlichen Banken unterscheiden und die genossenschaftliche Mitsprache für Kunden an Bedeutung verloren habe. Im Jahr 2009 gastierte ein kleiner Wanderzirkus auf dem Marktplatz neben der Hohenfelder Bankfiliale und sorgte für einen vollen Sommerabend.

  ## Landwirtschaftliche Genossenschaften

  Auf dem Land haben Genossenschaften eine besonders lange Tradition. Molkereien, Winzerkeller, Viehhandels- und Maschinengemeinschaften erlauben es kleinen Betrieben, am Markt zu bestehen. Die Bauern liefern ihre Milch, ihr Getreide oder ihre Trauben an die gemeinsame Einrichtung und teilen sich deren Gewinn. Gemeinsam lassen sich Preise besser verhandeln als allein, und teure Geräte wie Mähdrescher oder Kühltanks können geteilt werden.

  Besonders verbreitet sind Bezugs- und Absatzgenossenschaften. Die einen kaufen Saatgut, Dünger und Futter in großen Mengen ein und geben die Vorteile an ihre Mitglieder weiter, die anderen vermarkten die Erzeugnisse über eigene Läden oder Handelspartner. Die Molkerei Lindhorst eG, in einer Hügellandschaft gelegen, verarbeitet täglich die Milch von rund hundertzwanzig Höfen zu Butter, Quark und Hartkäse. Die Bauern bestimmen in der Generalversammlung den Milchpreis, den Fuhrpark und die Investitionen in neue Anlagen. Wer seinen Hof aufgibt, kann seinen Anteil kündigen, doch die Molkerei zahlt ihn erst nach einer festgelegten Frist aus, damit die Genossenschaft nicht ins Wanken gerät.

  Der Strukturwandel macht den landwirtschaftlichen Genossenschaften zu schaffen. Es gibt immer weniger Betriebe, die dafür immer größer werden, und manche Höfe liefern lieber direkt an den Handel. Viele Genossenschaften reagieren darauf mit neuen Angeboten, etwa Hofläden, regionalen Marken oder Bio-Linien. Auch der Klimawandel zwingt sie zum Umdenken, denn Trockenheit und Starkregen verändern die Erträge und damit die Planung ganzer Regionen.

  In den Molkereien und Kellereien bedeutet das, dass Lieferverträge flexibler gestaltet und Lagerkapazitäten ausgebaut werden müssen. Außerdem steigen die Anforderungen an Hygiene, Rückverfolgbarkeit und Tierwohl, was sich ohne gemeinsame Investitionen kaum stemmen ließe. Manche Genossenschaften beraten ihre Mitglieder deshalb mit eigenen Fachleuten bei Anbau, Fütterung und Buchführung.

  ## Wohnungsgenossenschaften

  In den Städten wurde die Idee des gemeinsamen Eigentums vor allem beim Wohnen aufgegriffen. In einer Wohnungsgenossenschaft gehören die Häuser allen Mitgliedern zusammen, und jeder Bewohner besitzt ein lebenslanges Wohnrecht, solange er die Nutzungsgebühr zahlt. Die Miete orientiert sich an den tatsächlichen Kosten für Instandhaltung, Verwaltung und Zinsen, nicht an dem, was der Markt hergibt. Deshalb liegen die Preise oft deutlich unter denen privater Vermieter, und Kündigungen wegen Eigenbedarfs sind ausgeschlossen.

  Viele dieser Genossenschaften entstanden nach den Weltkriegen, als bezahlbarer Wohnraum knapp war und Arbeiter, Beamte und Flüchtlinge sich zum gemeinsamen Bauen zusammenschlossen. Noch heute prägen ihre Siedlungen manche Stadtviertel, mit Innenhöfen, Gemeinschaftsräumen und Waschhäusern, die den Zusammenhalt der Nachbarn fördern sollen. Die Wohnbaugenossenschaft Sonnenhang in der Stadt Weidenau verwaltet knapp zweitausend Wohnungen in vierzig Häusern. Sie unterhält eine Nachbarschaftsküche, eine Fahrradwerkstatt und einen Kindergarten und lässt Neubauten ausschließlich nach ökologischen Standards errichten.

  Neuere Projekte setzen auf gemeinschaftliche Wohnformen für ältere Menschen oder für Familien mit geringem Einkommen. Manche Genossenschaften nehmen bewusst nur Mitglieder auf, die sich an Gemeinschaftsaufgaben wie Gartenpflege oder Treppenhausreinigung beteiligen. Das Problem sind heute die steigenden Baukosten und die knappen Grundstücke, die es den Wohnungsgenossenschaften erschweren, neue Häuser zu errichten und Wartelisten abzubauen.

  Wer in eine Genossenschaftswohnung ziehen möchte, muss zunächst Anteile erwerben, deren Zahl sich nach der Größe der Wohnung richtet. Diese Einlage wird beim Auszug zurückgezahlt. Die Genossenschaft verlangt für Reparaturen und Modernisierungen keinen Gewinnaufschlag, so dass auch Haushalte mit kleinem Einkommen auf lange Sicht sicher wohnen können. In einem Hof von Sonnenhang wurde einmal ein Fernsehfilm über einen Schachmeister gedreht, was die Bewohner mit gemischten Gefühlen verfolgten.

  ## Energiegenossenschaften

  Eine der jüngsten Entwicklungen sind Energiegenossenschaften, in denen Bürger gemeinsam Anlagen zur Erzeugung von Strom und Wärme finanzieren. Typisch sind Solardächer auf Schulen, Windräder am Ortsrand und Nahwärmenetze, die mit Holzschnitzeln oder Biogas betrieben werden. Die Mitglieder legen ihr Geld in Anteilen an, erhalten eine mäßige Rendite und nutzen den erzeugten Strom häufig auch selbst. Dadurch bleibt die Wertschöpfung im Ort, und die Bewohner erleben die Energiewende nicht als etwas, das ihnen von außen aufgezwungen wird.

  Die Energiegenossenschaft Lindhorst-Süd gründete sich mit achtzig Mitgliedern, um auf den Dächern der Molkerei und der Dorfschule Solaranlagen zu installieren. Binnen weniger Jahre wuchs sie auf vierhundert Mitglieder an, betreibt ein kleines Nahwärmenetz für das Neubaugebiet und lädt jedes Frühjahr zu einem Tag der offenen Tür ein, an dem Besucher die Speicher besichtigen können. Mit den Überschüssen unterstützt sie die Sanierung der Dorfkirche und den Jugendverein.

  Ein besonderer Vorzug dieser Organisationsform liegt darin, dass auch Menschen ohne eigenes Dach beteiligt werden können. Mieter, Rentner oder Familien mit geringem Einkommen zeichnen kleine Anteile und profitieren so von Anlagen, die sie allein nie bauen könnten. Gleichzeitig gewinnt der Ort an Unabhängigkeit gegenüber großen Versorgern.

  Wirtschaftlich sind solche Projekte nicht ohne Risiko. Ändern sich die Einspeisevergütungen oder die gesetzlichen Vorgaben, kann eine Anlage unrentabel werden. Zudem verlangt der Betrieb technisches und kaufmännisches Wissen, das in einem Ehrenamt schwer aufzubringen ist. Viele Energiegenossenschaften arbeiten daher mit Stadtwerken, Handwerksbetrieben oder Banken zusammen.

  Auch die Genehmigungsverfahren für Windräder und Wärmenetze sind aufwendig und dauern oft Jahre. Genossenschaften mit Erfahrung berichten, dass der Dialog mit Anwohnern und Verwaltung der wichtigste Erfolgsfaktor ist und dass ein früh eingebundener Ortsbeirat viele Einwände schon vor dem Bauantrag ausräumt.

  ## Herausforderungen und Ausblick

  Genossenschaften stehen heute vor mehreren Aufgaben. Die erste ist der Nachwuchs: Junge Menschen sind oft schwer für ehrenamtliche Posten zu gewinnen, und die Generalversammlungen sind häufig schlecht besucht. Manche Genossenschaften erproben daher digitale Abstimmungen und Veranstaltungen, die für Familien besser erreichbar sind. Die zweite Herausforderung ist das Wachstum. Je größer eine Genossenschaft wird, desto schwerer fällt es, den Zusammenhalt und die persönliche Bindung der Mitglieder zu bewahren. Gelingt dies nicht, verliert sie das, was sie von anderen Unternehmen unterscheidet.

  Trotzdem wird der Genossenschaftsidee eine gute Zukunft zugetraut. Wo Märkte versagen oder öffentliche Hände sparen müssen, springen Bürger oft selbst ein und gründen Dorfläden, Pflegedienste oder Kulturvereine in genossenschaftlicher Form. Die Verbindung von wirtschaftlichem Handeln und Mitbestimmung bleibt anziehend für alle, die ihre Lebensumstände nicht allein dem Zufall überlassen wollen.
