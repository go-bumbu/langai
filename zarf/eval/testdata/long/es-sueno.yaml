id: es-sueno
lang: es
title: El sueño humano
text: |
  El sueño es un estado fisiológico recurrente en el que disminuye la conciencia del entorno, se reduce la actividad muscular voluntaria y el organismo se dedica a tareas de mantenimiento que resultan difíciles de realizar durante la vigilia. Los seres humanos dedicamos al sueño aproximadamente un tercio de la vida, una proporción tan elevada que cualquier teoría sobre la salud o el rendimiento mental debe tenerlo en cuenta. A pesar de ello, durante buena parte de la historia se consideró un simple apagado del cerebro, una pausa pasiva entre dos jornadas.

  La investigación del siglo XX demostró lo contrario. Mientras dormimos, el cerebro sigue activo y pasa por etapas bien diferenciadas que se repiten en ciclos de unos noventa minutos. Cada etapa tiene su propio patrón de ondas eléctricas, su temperatura corporal y su ritmo de respiración. El sueño interviene en la consolidación de los recuerdos, en la regulación de las hormonas, en la reparación de los tejidos y en el equilibrio emocional. Una persona privada de sueño durante varios días sufre alteraciones de la atención, del humor y de la capacidad de decisión, y, si la privación se prolonga, aparecen alucinaciones y un deterioro físico notable.

  ## Las fases del sueño

  Al acostarse, una persona sana tarda entre diez y veinte minutos en dormirse. Entra primero en el sueño ligero, o fase uno, en el que los músculos se relajan y los ojos se mueven con lentitud. Es una etapa breve y fácil de interrumpir: quien despierta en ella suele afirmar que no había llegado a dormirse. En la fase dos, que ocupa casi la mitad de la noche, la temperatura baja, el pulso se hace más lento y el electroencefalograma registra breves ráfagas de actividad llamadas husos de sueño.

  Después llega el sueño profundo, o de ondas lentas, en el que las neuronas descargan de forma sincronizada y resulta muy difícil despertar al durmiente. Esta fase predomina en la primera mitad de la noche y es la que más se asocia con la sensación de descanso físico. Durante ella el organismo libera la mayor parte de la hormona del crecimiento y refuerza las defensas inmunitarias.

  La última fase de cada ciclo es el sueño de movimientos oculares rápidos, conocido por sus siglas en inglés REM. Los ojos se mueven bajo los párpados, la respiración se vuelve irregular, el cerebro muestra una actividad parecida a la de la vigilia y casi todos los músculos quedan paralizados, un mecanismo que impide representar físicamente lo que se sueña. Los sueños más vívidos y narrativos aparecen en esta etapa, que se alarga a medida que avanza la noche, de modo que quien se levanta muy temprano pierde buena parte de ella.

  Los sueños, por su parte, han intrigado a la humanidad desde la Antigüedad. Los textos de muchas civilizaciones los interpretaron como mensajes divinos o presagios, y en el siglo XX la psicología los convirtió en objeto de teoría. Hoy se piensa que no tienen un único significado, sino que reflejan el procesamiento de las emociones y de los recuerdos recientes. Quienes tienen sueños lúcidos, en los que se sabe que se está soñando, pueden incluso modificar el curso de la historia onírica con un poco de práctica.

  ## El reloj biológico y los ritmos circadianos

  La alternancia entre sueño y vigilia no depende solo del cansancio acumulado. Un pequeño grupo de neuronas situado en el hipotálamo actúa como reloj maestro y marca un ritmo de aproximadamente veinticuatro horas, llamado ritmo circadiano. Este reloj se sincroniza con el entorno sobre todo a través de la luz: cuando los ojos reciben luz intensa por la mañana, el reloj se adelanta ligeramente, y cuando la reciben de noche, se retrasa. Por eso los viajes largos hacia el este o el oeste desajustan el organismo y producen el conocido desfase horario.

  El reloj circadiano regula la secreción de melatonina, una hormona que la glándula pineal libera al anochecer y que prepara el cuerpo para dormir. También controla la temperatura corporal, que alcanza su mínimo a las cuatro o cinco de la madrugada, y la liberación de cortisol, que aumenta antes de despertar para activar el organismo. Cuando estos ritmos se desfasan, aparecen las molestias típicas de las personas que trabajan por turnos: somnolencia diurna, problemas digestivos y mayor riesgo de enfermedades cardiovasculares.

  No todas las personas tienen el mismo cronotipo. Las llamadas alondras prefieren acostarse temprano y rinden mejor por la mañana, mientras que los búhos funcionan mejor al caer la tarde. Esta preferencia tiene un componente genético y cambia con la edad: los adolescentes suelen retrasar su horario de forma natural, lo que explica en parte por qué les cuesta tanto madrugar para ir a clase. Algunos centros educativos han retrasado la hora de entrada y han observado mejoras en la asistencia y en el rendimiento.

  La temperatura ambiente, el ejercicio y las comidas actúan también como señales secundarias del reloj. Un cuerpo que come, se mueve y se expone a la luz a horas regulares mantiene un ritmo más estable, mientras que un horario caótico, con cenas tardías y pantallas encendidas hasta la madrugada, confunde las señales y debilita la calidad del descanso.

  Los científicos han descubierto además que la luz azul de los teléfonos y las tabletas resulta especialmente eficaz para frenar la melatonina. Un estudio realizado con estudiantes universitarios mostró que quienes leían en una pantalla luminosa antes de acostarse tardaban más en dormirse y tenían menos sueño REM que quienes leían un libro impreso. Los fabricantes han respondido con modos nocturnos que reducen los tonos azules, aunque los expertos advierten de que el contenido que se consume, y no solo el color de la pantalla, también mantiene el cerebro en estado de alerta.

  ## Sueño y memoria

  Una de las funciones mejor estudiadas del sueño es la consolidación de la memoria. Durante la vigilia, el hipocampo registra de forma provisional las experiencias del día; durante el sueño profundo, esos recuerdos se reactivan y se transfieren poco a poco a la corteza cerebral, donde se almacenan de manera más estable. Los estudios con voluntarios demuestran que quien duerme después de aprender una lista de palabras o una secuencia de movimientos recuerda más y mejor que quien permanece despierto el mismo tiempo.

  Cada fase parece encargarse de un tipo de memoria. El sueño de ondas lentas favorece los recuerdos declarativos, es decir, los hechos y los acontecimientos que podemos contar. El sueño REM, en cambio, ayuda a consolidar las habilidades motoras y a integrar las emociones. Por eso los músicos y los deportistas mejoran tras una noche de descanso aunque no hayan practicado durante las horas de sueño. Una siesta de veinte o treinta minutos ofrece ya beneficios modestos para la atención y el aprendizaje.

  El sueño también favorece la creatividad. Se atribuye a varios científicos y artistas la solución de un problema al despertar, y los experimentos de laboratorio confirman que dormir aumenta la probabilidad de descubrir una regla oculta en una tarea de números. La explicación más aceptada sostiene que el cerebro reorganiza durante la noche los recuerdos y establece conexiones entre ideas que durante el día permanecían separadas.

  En la ciudad de Almendral, la clínica universitaria del sueño organiza cada otoño un torneo de fútbol sala entre sus empleados y los de la facultad de Medicina, y el equipo de enfermería lleva tres años seguidos ganándolo.

  La relación entre sueño y aprendizaje es especialmente visible en la escuela. Los alumnos que duermen menos de lo necesario muestran más dificultades para concentrarse, cometen más errores en las tareas repetitivas y recuerdan peor lo estudiado el día anterior. Por eso muchos pedagogos desaconsejan las noches en vela antes de un examen: repasar a última hora puede añadir algunos datos, pero dormir bien fija los que ya se han aprendido y mejora el rendimiento durante la propia prueba.

  ## El sueño a lo largo de la vida

  Los recién nacidos duermen entre dieciséis y diecisiete horas al día, repartidas en tramos cortos de dos a cuatro horas que se suceden sin distinguir el día de la noche. El ritmo circadiano no madura hasta los tres o cuatro meses, y hasta entonces los bebés pasan mucho más tiempo en sueño REM que los adultos, algo que los especialistas relacionan con el desarrollo de las conexiones cerebrales. Durante los primeros años, los horarios regulares y los rituales previos a la cama, como el baño o el cuento, ayudan a que los niños aprendan a dormir de forma continua.

  En la adolescencia el cuerpo pide acostarse más tarde y levantarse más tarde, y a menudo se encuentra con horarios escolares que lo contradicen. El resultado es una deuda de sueño acumulada durante la semana que muchos jóvenes intentan saldar los sábados y los domingos. En la edad adulta el sueño se estabiliza, aunque la vida laboral, el cuidado de los hijos y las preocupaciones económicas lo recortan con frecuencia.

  Con los años el sueño cambia otra vez. Las personas mayores pasan menos tiempo en sueño profundo, se despiertan con más facilidad y tienden a acostarse y a levantarse más temprano. Es frecuente que echen siestas durante el día y que duerman peor por la noche, en parte por el dolor crónico, las visitas al baño y los medicamentos. Mantener actividad física, salir a la calle y conservar horarios regulares ayuda a conservar un sueño razonablemente reparador. En Almendral, una residencia de mayores se hizo famosa porque su pastelero, Cipriano Leal, repartía cada domingo roscones de anís entre los vecinos.

  ## Insomnio, apnea y otros trastornos

  Alrededor de uno de cada tres adultos refiere dificultades para dormir en algún momento de su vida, y entre un diez y un quince por ciento sufre insomnio crónico, es decir, problemas para conciliar o mantener el sueño que se repiten al menos tres noches por semana durante tres meses. Las causas son variadas: el estrés, la ansiedad, la depresión, el dolor, ciertos medicamentos o el consumo de cafeína y alcohol. En muchos casos, el propio miedo a no dormir mantiene el problema, pues la persona se acuesta tensa y vigilante.

  La apnea obstructiva del sueño es otro trastorno frecuente. Durante la noche, los tejidos de la garganta se relajan en exceso y obstruyen la vía respiratoria, de manera que la respiración se interrumpe durante diez segundos o más y se reanuda con un ronquido brusco. Quien la padece no suele recordar los microdespertares, pero se levanta cansado, con dolor de cabeza y con somnolencia durante el día. La obesidad, la edad y la anatomía de la mandíbula aumentan el riesgo. El tratamiento habitual consiste en una mascarilla que insufla aire a presión durante la noche.

  Existen además otros problemas menos comunes. El síndrome de piernas inquietas provoca una necesidad irresistible de mover las extremidades al acostarse. La narcolepsia, enfermedad neurológica poco frecuente, se manifiesta con accesos de sueño súbitos durante el día y episodios de pérdida del tono muscular. Las parasomnias, como el sonambulismo, los terrores nocturnos o el hablar en sueños, son más habituales en la infancia y suelen desaparecer con el tiempo.

  El diagnóstico de estos trastornos se realiza en unidades especializadas mediante la polisomnografía, una prueba nocturna que registra la actividad cerebral, el movimiento de los ojos, el ritmo cardíaco, la respiración y la oxigenación de la sangre. Con los resultados, el médico decide si basta con modificar hábitos, si conviene una terapia psicológica o si es necesario un tratamiento con dispositivos o medicamentos.

  El tratamiento de estos trastornos ha avanzado mucho en las últimas décadas. Las unidades del sueño de los grandes hospitales reúnen a neurólogos, neumólogos, psicólogos y especialistas en otorrinolaringología, porque muchos casos tienen causas combinadas. Un paciente con apnea, por ejemplo, puede necesitar a la vez la mascarilla nocturna, una pérdida de peso y una cirugía menor de las vías respiratorias. Los médicos insisten en que roncar con frecuencia, sentir sueño al volante o despertarse con la boca seca merecen una consulta, porque tratar a tiempo evita complicaciones del corazón y de la tensión arterial.

  La somnolencia diurna tiene, por último, un coste social considerable. Los accidentes de tráfico por cansancio, los errores en los hospitales tras guardias muy largas y las bajas laborales por agotamiento figuran entre las consecuencias más estudiadas. Varios países limitan por ello las horas de conducción de los camioneros y los turnos continuados del personal sanitario, y algunas empresas han instalado salas de descanso donde se permite una siesta breve.

  ## Cuánto dormir y cómo hacerlo bien

  Las recomendaciones médicas indican que un adulto necesita entre siete y nueve horas de sueño por noche, que los adolescentes requieren entre ocho y diez y que los niños pequeños deben dormir aún más, entre diez y catorce horas con las siestas incluidas. Esas cifras son promedios: algunas personas se encuentran bien con seis horas y media y otras necesitan nueve. Lo importante es despertar sin ayuda de la alarma, sentirse activo durante el día y no depender de grandes cantidades de café para mantenerse despierto.

  El conjunto de costumbres que favorecen un buen descanso se conoce como higiene del sueño. La primera norma consiste en mantener horarios regulares, también los fines de semana, porque el reloj biológico agradece la constancia. La segunda aconseja que el dormitorio sea oscuro, silencioso y fresco, con una temperatura de entre dieciocho y veinte grados. También conviene reservar la cama para dormir, de modo que el cerebro asocie ese lugar con el descanso y no con el trabajo o con las pantallas.

  Algunos hábitos del día influyen mucho en la noche. El ejercicio físico regular mejora la calidad del sueño profundo, siempre que no se practique justo antes de acostarse. La luz natural por la mañana refuerza el ritmo circadiano. Conviene evitar la cafeína en las seis horas anteriores a dormir y moderar el alcohol, que facilita quedarse dormido pero fragmenta el sueño de la segunda mitad de la noche. Una cena ligera, tomada un par de horas antes, evita las molestias digestivas.

  Cuando el insomnio persiste, la terapia cognitivo-conductual ha demostrado ser más eficaz a largo plazo que los somníferos. Este tratamiento enseña a limitar el tiempo en la cama, a reconocer los pensamientos que alimentan la angustia y a practicar técnicas de relajación. Los medicamentos hipnóticos pueden ayudar de forma puntual, pero su uso prolongado genera tolerancia y dependencia, por lo que los médicos recomiendan reservarlos para periodos cortos y bajo supervisión.

  Las siestas merecen un comentario aparte. Bien utilizadas, son una herramienta eficaz: una pausa de veinte minutos a primera hora de la tarde, cuando el reloj biológico registra un descenso natural de la alerta, devuelve la concentración sin estropear el sueño nocturno. En cambio, una siesta larga o tardía puede dificultar conciliar el sueño por la noche, sobre todo en las personas con insomnio, a quienes los médicos suelen aconsejar que la eviten por completo durante las primeras semanas del tratamiento.

  Por último, conviene recordar que la tecnología puede ayudar, pero no sustituye a la observación personal. Las pulseras y los relojes que miden el sueño estiman de forma aproximada las horas y las fases, y sus datos resultan útiles para detectar tendencias. Sin embargo, obsesionarse con las cifras puede empeorar el problema, porque la preocupación por dormir bien es una de las causas más frecuentes de que no se duerma. Lo más fiable sigue siendo preguntarse por la mañana si uno se siente descansado.
