id: en-port-ashby-transit
lang: en
title: Public transport in Port Ashby
text: |
  Public transport in Port Ashby is the network of buses, trams, metro trains, ferries, funiculars and shared bicycles that moves the people of Port Ashby, a fictional port city of about 1.4 million inhabitants on the estuary of the river Wend. The system is run by a public body, Ashby Transit Authority, which sets the timetables, owns most of the vehicles and stations, and contracts some bus routes and the ferry service to private operators. On an ordinary weekday it carries about 1.1 million journeys, and roughly four in ten of all trips made in the city are by public transport, a share that is high for a city of its size.

  Port Ashby is an awkward place to build a transport network. The old centre sits on a low spit of land between the river and a tidal creek, the richer residential districts climb steep wooded hills to the north, and the industrial suburbs and the container docks stretch for kilometres along a flat shore to the east. Every route has to cross water, climb a slope, or squeeze through a narrow street laid out before the invention of the motor car. The result is an unusual mixture of old and new, in which a modern driverless metro runs a few hundred metres from a cable-hauled hillside railway built in the reign of Queen Victoria.

  Visitors often notice the colours: green for buses, red for trams, deep blue for the metro and white with a yellow stripe for ferries. The authority adopted the scheme in 1971, when it was formed from five separate undertakings, and it has kept it ever since, with only minor changes.

  ## From horse trams to the war

  The first public transport in Port Ashby was a horse omnibus that ran from the quay to the cattle market from 1846. It was soon followed by horse-drawn trams on iron rails, laid by a private company, the Wendside Street Railway, along the main road beside the river. A journey cost a penny, which was within reach of clerks and better-paid dockers, and the line was so popular that the animals were worked in shifts and replaced every few years. At its peak the company stabled more than eleven hundred horses in the yards of the Eastgate depot.

  Electricity changed everything. The first electric tram ran in 1899 on the Eastgate route, drawing current from an overhead wire, and within fifteen years the whole city was served by a web of lines that radiated from the Market Square. The new service allowed workers to live farther from their jobs, and the terraced suburbs of Fennick, Lowmarsh and Saint Aldric grew along the tram routes. Many of the long streets of narrow houses that define those districts were built on land bought by speculators who knew where the next extension would run.

  The city council took over the system in 1912, partly in response to public anger at a fare increase, and it expanded the lines to the new shipyards at Corran Point. During the First World War, women were employed as conductors and drivers for the first time, and by 1918 they made up more than a third of the workforce. The trams were crowded, slow, and cold in winter, but they were cheap, and by the nineteen thirties they carried a quarter of a million passengers a day.

  The same decade saw the first motor buses. They were small, noisy and unreliable at first, but they had a great advantage: they needed no track, and could be sent to a new housing estate within weeks. Competing private firms started services on the more profitable routes, undercutting the trams, and the council responded in 1934 by setting up its own bus department. The two modes were run together until the end of the war, when the first plans were made for what the post-war planners called a rational system.

  ## The decline and revival of the trams

  In the years after the Second World War, Port Ashby followed the fashion of the day. Planners believed that the future belonged to the private car, and that tramlines obstructed traffic. Between 1952 and 1968 the council closed all but one of its tram routes, replacing them with buses, and tore up the rails on the main streets. The Eastgate depot was sold for a supermarket. A single line survived to Saint Aldric, mainly because the road on which it ran was too narrow for a bus to turn at the terminus.

  The mistake became clear within a decade. Buses were stuck in the same traffic as cars, the fumes in the centre worsened, and the city lost passengers each year. A campaign by a group of residents, the Friends of the Tram, collected forty thousand signatures in 1983 for a new light rail line, and the council, short of money, agreed to build a modest route along the old Eastgate road. It opened in 1989 and exceeded all predictions for use. Two further lines followed, and today the tram network has four lines and forty-two kilometres of track.

  The modern trams are low-floor, articulated vehicles with air conditioning, built in a factory at Corran Point, and they run in their own lanes with priority at signals. In the historic centre they run through a pedestrian street without wires, drawing power from batteries that are recharged at stops. The lines to the east serve the shipyards, the technology park and the airport, and are the busiest on the system.

  ## Geography and passenger demand

  The pattern of travel in Port Ashby is shaped by its geography. About half of all journeys are within the inner ring of districts around the Market Square, and most of the rest link the suburbs with the centre. Journeys between one suburb and another are rarer but have been growing quickly, as employers have moved to business parks beside the ring road, where the buses are fewer and the car parks are large.

  The morning peak is sharp: between a quarter past seven and nine, trams and metro trains are crowded, and the authority has to run every vehicle it owns. Demand then falls to a plateau, with a smaller bump at midday around the university and the hospital district of Whitlock, and a second great wave of travel between four and seven in the evening. Weekend travel has shifted towards shopping and leisure, and the busiest Saturday route is the ferry to the beaches at Saltmere.

  Population growth has been uneven. The old centre has lost residents to the suburbs for fifty years, only to regain young adults in the last twenty as warehouses and offices have been converted into flats. The hill districts, home to many retired people, depend on a few steep bus routes and, for the steepest slopes, on the funiculars. Planners divide the city into six travel zones, and the authority publishes a map every year, showing where each service runs and how frequent it is.

  ## The bus network

  Buses are the backbone of the system, with more than 160 routes and a fleet of 1,350 vehicles. Frequent trunk routes run every six to ten minutes through the day along the main roads, while a layer of local routes feeds them, and a night network covers the principal corridors from midnight to five in the morning. Seven of the trunk routes have bus lanes along most of their length, and three have stops built like tram platforms, with ticket machines and level boarding.

  The fleet is being renewed. All the old diesel vehicles in the city centre have been replaced since 2019 by electric buses, charged overnight at the Corran Point and Lowmarsh depots and at fast chargers at terminuses. The authority claims that its electric buses have cut roadside nitrogen dioxide in the central district by a fifth. The remaining diesel buses run on the outer routes, and the plan is to replace them by 2032.

  Services outside the centre are more of a struggle. In the thinly populated villages upriver, buses run only a few times a day, and the authority supports an on-demand minibus scheme that picks people up from their door after a call or a booking made on a phone. The scheme costs more per passenger than regular buses but has proved popular with older people. A bus lane on the Wend road, completed in 2017, cut journey times from the northern suburbs by nearly a quarter, and is often cited as the cheapest investment the city has made.

  ## Harbour ferries

  Ferries have crossed the Wend estuary since the Middle Ages, and the Harbour Ferry is the oldest regular service in the city. Today the authority runs six routes with a fleet of eleven vessels, carrying about forty thousand passengers a day. The busiest links the Market Square pier with Corran Point on the southern bank, saving commuters a road journey of fourteen kilometres around the head of the estuary. Others serve the beach resort of Saltmere, the old naval island of Gannet Rock, and the ferry terminal for the cross-channel steamers.

  The older boats were built of steel in the nineteen sixties and were noisy, but they were loved by passengers, and one, the Mary Tolland, remains in service as a floating café on summer evenings. Newer vessels, delivered since 2016, are catamarans with hybrid engines, able to run silently on batteries for the last stretch into the town centre. Their passenger decks are level with the quay, which makes it possible for wheelchair users and parents with pushchairs to board with no ramp.

  Each pier has its own character. The Market Square pier is a covered iron structure of 1884 with a waiting hall that has been used as a venue for concerts, while the pier at Gannet Rock is little more than a wooden jetty with a bench and a lamp. At Saltmere, passengers disembark onto a long concrete causeway that is covered at high tide, and the timetable is adjusted every day according to the tables of tides published by the harbour master.

  The ferries are managed by a private company under a ten-year contract, with the authority setting fares and timetables. Weather is a constant hazard. Fog and strong southwesterly winds can cause cancellations on the exposed Saltmere route, and a few times a decade the river floods and the lower piers are closed. A system of tide-gauge sensors and a radar service for ships in the estuary has reduced the number of disruptions in recent years, but the service remains seasonal in character, with half the yearly passengers travelling between May and September.

  Ferries also form part of the identity of the city. Tourists photograph the boats arriving at sunset, and the poet Calla Winterbourne, who lived in Port Ashby for a short time before the war, wrote a series of verses about her daily crossing. These are quoted on posters at the piers and printed on the backs of some tickets.

  ## The Crescent Line metro

  The Crescent Line is Port Ashby's only underground railway and the most modern part of the system. It opened in 2008 after eleven years of construction and runs in a long arc, or crescent, from the airport in the east through the centre to the hill suburb of Highmoor, a distance of 23 kilometres with twenty-six stations. Trains run every three minutes at peak and every eight in the evening, without drivers, and are controlled from a centre near the Eastgate depot.

  Building the line was difficult. The tunnels pass through soft estuary clay and then through a ridge of hard sandstone, and the water table is high, so the engineers used large tunnel-boring machines and sealed the stations as watertight boxes. Several old buildings were damaged by settlement, and the authority paid for repairs. The cost was nearly twice the first estimate, and the council had to borrow heavily, but the results have since been judged a success, with ridership double the early forecast.

  Stations are designed with platform screen doors, wide staircases and escalators, and ceilings that carry both light and signs. Each has a distinct pattern of coloured tiles, based on a local theme, so passengers can recognise their stop from the train: a ship's wheel at the Market Square, a barley ear at Fennick, a single gull at Gannet Road. The line carries over 280,000 passengers a day, about a quarter of all public transport trips in the city.

  Operating a train without a driver takes a careful system of safeguards. Signals are replaced by a computer that knows the position and speed of every train to within a metre, and sensors in the tunnels detect obstacles, smoke and water. If a train stops between stations, the control room can talk to passengers through speakers and can send a mobile team that reaches any point of the line within fifteen minutes. In the first year, the line suffered from software faults that closed it for a total of nine days, but reliability has since been above 99 per cent, a figure the authority advertises on posters in every station.

  Plans for a second line, to be called the Meridian, have been drawn up to link the northern suburbs with the docks through the centre, but the sums involved are large and the project has been postponed twice. A shorter alternative, an extension of the Crescent Line to the university and the new hospital, is expected to start building in 2027.

  ## Funiculars and hill lifts

  The hillside districts of Port Ashby are served by three funiculars, two of which date from the nineteenth century. The Alder Hill Railway, opened in 1883, climbs 87 metres in four minutes on a track of just 190 metres, and runs on a counterweight system in which the descending car pulls the ascending one up. Its wooden carriages with brass fittings are among the most photographed in the city. The Saint Aldric Lift of 1897 was originally powered by water ballast, and was converted to electricity in the nineteen thirties.

  The third, the Whitlock Incline, opened in 2012 to connect the hospital with the lower town, and has glass cars and wide doors for beds and wheelchairs. Together the three carry about 14,000 passengers a day, a modest number, but they are essential for the residents of streets too steep for a bus. The authority also runs a series of public outdoor escalators and lifts in the hillside lanes, and in the steepest street a stairway lift that is operated by a button.

  Maintenance of the funiculars calls for specialist skills. Cables are inspected daily, replaced every ten years, and stored in a workshop at Alder Hill, where the last two cable splicers in the region train apprentices. A survey in 2021 found that the lines were operating at a loss, and a proposal to close the Saint Aldric Lift was withdrawn after protests from residents, who pointed out that nearly half of its users were over seventy.

  ## Fares and ticketing

  For most of the twentieth century every operator in Port Ashby sold its own tickets, and a journey that involved a tram and a ferry meant two payments. The Ashby Transit Authority introduced a single zonal fare in 1971, and a paper travelcard soon afterwards. The scheme was replaced in 2005 with a smartcard, the Wend Card, which can be loaded with cash or with a monthly pass and is tapped on a reader at the start and end of a journey.

  Fares are calculated by zone and by time of day, with a daily cap that stops a passenger from paying more than the price of a day pass, however many journeys are made. Seniors, young people and unemployed residents receive reductions of between a third and a half, and children under eight travel free with an adult. Since 2020 a passenger can also pay with a contactless bank card or a phone, with the same cap applying, and the number of Wend Card sales has begun to fall.

  The fare revenue covers around 58 per cent of the cost of running the system, a figure that has remained roughly stable for twenty years. The rest comes from a payroll levy on employers, a share of the vehicle licence fee, and grants from the national government. Evasion is a recurring concern: inspectors estimate that between three and four per cent of passengers ride without paying, and the authority has tried a variety of countermeasures, from gates at the busiest stations to a policy of fines that are reduced if paid within a week.

  A debate over free public transport recurs in local politics. Supporters argue that abolishing fares would remove barriers for the poor and cut the cost of enforcement, while critics note that fares pay for more than half of the service, and that the money would have to come from taxes. A trial of free travel for under-eighteens, begun in 2023, has so far been judged a modest success, with teenagers' trips up by a fifth.

  ## Commuter rail and interchanges

  Alongside the authority's own services, two national railway lines enter Port Ashby. The Harbour Branch from the south ends at Central Station near the Market Square, and the Wend Valley line from the north reaches the same terminus after a long viaduct across the creek. Commuter trains on both are run by a private railway company, but they accept the Wend Card and share zonal fares with the rest of the system. Between them they bring about 90,000 passengers into the city on a working day.

  The art of the system lies in interchange. Central Station is a hub where the Crescent Line, three tram routes, a bus terminus and a taxi rank meet under one roof, and it was rebuilt in 2010 with a wide concourse, a glass roof and a covered pedestrian bridge to the ferry pier. Transfers between tram and metro take on average four minutes. Smaller interchanges at Lowmarsh, Fennick Cross and the airport have been designed to let passengers step from one platform to another, and at the three busiest the timetables are set so that a train and a bus arrive together.

  The old station at Eastgate had a different fate. Closed in 1964 and left to decay for forty years, it was used as a location for the 1998 film The Last Night Platform, a crime thriller in which a detective chases a thief through the empty halls. Today the building houses a market and a transport museum, but the film has little other link with the actual network.

  Park-and-ride sites at the ends of the lines give drivers an alternative to entering the centre. The largest, at Highmoor, has 1,800 spaces and a direct connection to the Crescent Line, and is full by half past eight each weekday. Critics say the sites encourage people to drive longer distances than they would otherwise, but the authority points to counts showing that three quarters of users previously drove all the way into the centre.

  ## Accessibility

  Access for passengers with reduced mobility, once an afterthought, is now a design principle. All trams, metro trains and ferries are step-free, and 97 per cent of the bus fleet is low-floor, with a ramp deployed by the driver on request. The authority maintains a register of stations and stops with their facilities, including lifts and tactile paving, and it publishes the information on a website and a phone app that also reports lift failures in real time.

  Visually impaired passengers use voice announcements, raised numbers on handrails and a navigation app developed with a local charity, which guides them through the interchange at Central Station by phone vibrations. For deaf passengers, all stations show displays with the next arrivals and with messages about delays, and the staff are trained in basic sign language. A scheme named Ask Me allows passengers who find the system confusing to wear a lanyard, which signals to staff and others that they might welcome help.

  The older parts of the network lag behind. Many tram stops of the earlier lines are narrow, and some funicular stations are reached only by stairs. The authority has a rolling plan to rebuild these, and has promised that the whole network will be step-free by 2035. A group of disabled passengers, the Access Panel, meets the management every quarter, and its complaints have led to the redesign of a number of stops, including the platform at Lowmarsh where the gap between a tram and the kerb was wide enough to catch a wheelchair.

  ## Workforce and labour relations

  Ashby Transit Authority employs around 7,400 people, including drivers, mechanics, station staff, inspectors, planners and managers. The largest group are the 2,900 bus drivers, whose work is regulated by national rules on hours of driving and rest. Recruiting has become harder in recent years, as wages for drivers have lagged behind those in warehouses and delivery, and the authority has offered training programmes and bonuses to attract and keep staff. A third of new recruits are women, a share that has doubled in a decade.

  Trade unions are strong. There have been four major strikes since 1971, the most serious in 1984, when buses and trams stopped for nineteen days in a dispute over a plan to cut jobs, and again in 2019, over the staffing of the driverless metro. The latter dispute ended with a guarantee that every Crescent Line train would carry an attendant who could take control in an emergency, and that no worker would lose a job as a result of automation.

  The football striker Matteo Brandvik, then a young player for the city club, spent a week working as a tram conductor in 2015 as part of a publicity drive, and his arrival at the Saint Aldric depot caused a crowd to gather. The authority still uses the picture in recruiting leaflets.

  The workshops at Corran Point and Lowmarsh are a source of local pride. There trams and buses are overhauled, and parts are made that are no longer sold by manufacturers. A section of the Lowmarsh workshop restores heritage vehicles, among them a horse tram, an open-top electric tram of 1905, and a bus of the nineteen thirties, all of which run on an annual open day in July.

  ## Special events and night services

  Port Ashby holds three large events every year, and each puts the network to a test. The Midsummer Regatta fills the estuary with sailing boats in June and sends some 60,000 spectators to the piers; the Harvest Fair at the cattle market in September draws farmers and families from the whole county; and the football derby between the two city clubs leaves the eastern tram lines packed for an hour before and after the match. For each occasion the authority prepares a special timetable, adds extra vehicles, and posts staff with megaphones at the busiest stops.

  The night network was extended in 2016, when the council decided to make the city safer for people leaving bars and theatres at closing time. Ten night bus routes run every thirty minutes between midnight and five, starting at Central Station and fanning out to the suburbs, and on Friday and Saturday the Crescent Line runs all night. Passengers pay the normal fare, though the night buses are cheaper to use with the Wend Card than with cash. The scheme has reduced taxi queues in the centre and lowered the number of drunk-driving arrests, according to the police.

  New Year's Eve is the busiest night of the year. Fares are waived from nine in the evening, the metro runs at three-minute intervals until dawn, and the ferries operate a special service to watch the fireworks from the water. In 2019 a record 310,000 trips were made in that one night, and the authority reported only a handful of delays, mostly caused by passengers holding doors open for friends.

  ## Bicycle hire

  The Ashby Bikes scheme began in 2014 with 800 bicycles and 90 docking stations in the centre, and has since grown to 6,500 bicycles at 520 stations, extending into the inner suburbs and to the university. The bicycles are sturdy, three-speed machines, painted in a pale grey with a basket on the front, and about a third are now electric. A registered user unlocks a bicycle with the Wend Card or the app, and the first thirty minutes of each journey are free.

  The scheme was designed as part of the public transport system rather than as a competitor. Stations are placed beside tram stops, ferry piers and the metro, and the integrated daily cap on the Wend Card covers bicycle hire as well. In surveys, about a fifth of users say that they have replaced a short bus journey with a ride, and one in ten say they use a bicycle to reach a tram or metro stop that would otherwise be too far away.

  Operational problems remain. In the hill districts, bicycles gather at the bottom of slopes and must be carried back up in vans, which is costly and generates traffic of its own. The authority responds by offering incentives to users who return bicycles to nearly empty uphill stations, and by installing more electric models. Vandalism and theft are also a continuing concern, and about 400 bicycles have been fished out of the creek in the last decade.

  Cycling in general has grown in the city. A network of segregated lanes now covers 190 kilometres, and a new cycle bridge across the creek opened in 2022. The local cycling campaign, Wheels of Ashby, has asked for a continuous protected route from the northern suburbs to the docks, and a first stage of this is under construction.

  ## Governance and funding

  Ashby Transit Authority is governed by a board of fifteen members, nine appointed by the city council, four by the surrounding counties and two elected by employees. It must produce a five-year plan, which the council approves, and publishes its performance each quarter in terms of punctuality, cleanliness and the number of complaints. An independent regulator, the Passenger Watch, can investigate failures and publish findings.

  The financial position is delicate. Operating costs in 2024 were about 920 million, of which fares covered 58 per cent, as noted above. The payroll levy, introduced in 1994, brings in roughly a quarter of the budget, but employers have asked for its abolition, and a proposal to raise it was withdrawn in 2023 after a campaign by businesses. Capital projects, such as new trams or the metro extension, are funded by loans from a national infrastructure bank and by grants that depend on cost-benefit assessments.

  Public attitudes to the authority are generally positive but critical. In an annual survey, about 72 per cent of passengers say they are satisfied with the service, but only 41 per cent think it provides good value, and the most common complaints concern crowding at peak times, unreliable buses on the outer routes and the high price of single tickets for occasional users. The authority has responded with a customer promise that offers a refund if a train or tram is more than twenty minutes late.

  Contracting has long been controversial. The authority tendered its ferry service and a third of its bus routes to private operators in the nineteen nineties, and the results were mixed: costs fell at first, but quality suffered in some areas and complaints rose. In 2021 the council decided to bring the four worst-performing bus contracts back in house, and now insists on tougher penalty clauses. Supporters of the mixed model point out that the contractors have introduced useful innovations, such as the hybrid ferries.

  ## Environment and safety

  Public transport is central to the city's plan to cut carbon emissions by two thirds by 2040. About 70 per cent of the vehicles in the system are electric or hybrid, and the electricity comes in part from a solar farm on the roof of the Corran Point depot and from a contract with a wind developer. The authority reckons that every day, the system prevents about 600,000 car journeys, saving some 1,400 tonnes of carbon dioxide.

  Safety record is good. Fatalities involving the system are rare, with two passengers and six pedestrians killed in the past decade, most in collisions between trams and cars at crossings. Following a fatal accident in 2016, the authority installed warning lights and barriers at every level crossing and introduced a speed limit of 15 kilometres per hour near stops. On the Crescent Line, platform doors and sensors protect against falls onto the track. In 2018 a fire in a tunnel near Whitlock, caused by an overheated brake, led to a successful evacuation of 600 people in under twelve minutes, and the incident is now used in training courses.

  Public perception of safety at night is more mixed. The authority has added cameras and help points at stations, and runs a Safe Stop scheme, allowing women travelling alone on the night buses to ask the driver to stop between regular stops. Surveys show that one passenger in five still avoids travelling late in the evening, and improving this has become a priority.

  ## Plans for the future

  The authority's long-term strategy, published in 2024, sets out an ambitious list of projects. The most expensive is the Meridian metro line, estimated at 3.2 billion, which would carry an additional 200,000 passengers daily and relieve the overcrowded trams to the east. The extension of the Crescent Line to the new hospital is the first priority, followed by two further tram extensions into the northern suburbs and a new ferry route to the planned housing development at Corran Point.

  Technology is expected to change the system in smaller ways. Trials are under way of battery-powered ferries on the shorter routes, of automatic buses on a dedicated lane near the airport, and of an app that combines every mode of transport and payment in one place. The authority is also testing demand-responsive services in the evenings, using minibuses that adapt their routes according to bookings. Not all of these ideas will work, and some may be abandoned.

  The deeper questions are political. A city that is growing needs to decide how much of its road space to give to buses, trams and bicycles, how much of the cost to place on riders, and how far to push drivers out of the centre. In Port Ashby, as in most cities, the answers are likely to be found by trial, compromise and a good deal of argument. What seems certain is that the network, with its mixture of cable cars of the nineteenth century and trains without drivers, will continue to grow and to reflect the shape and the temper of the city it serves.
