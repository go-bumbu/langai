id: de-tal-der-kessel
lang: de
title: Das Kesseltal
text: |
  Das Kesseltal ist ein Hochtal in den nördlichen Alpen, das von steilen Felswänden umschlossen wird und seinen Namen der auffälligen, topfartigen Form seines Talschlusses verdankt. Auf einer Länge von knapp einunddreißig Kilometern verbindet es das Vorland bei Hohenried mit dem Pass am Gamsjoch und führt dabei von sechshundertvierzig auf über zweitausend Meter Höhe. Im Tal leben rund neuntausend Menschen in sieben Gemeinden, von denen Sankt Ottilien mit etwa dreitausend Einwohnern die größte und Hinterkessel mit einhundertsechzig die kleinste ist.

  Obwohl das Tal abgelegen wirkt, spielte es lange eine Rolle im Verkehr zwischen Nord und Süd. Händler zogen über den Gamsjochpass, im Mittelalter wurde in den Seitentälern Silber abgebaut, und später brachte die Schmalspurbahn Touristen und Holz. Heute lebt das Tal von einer Mischung aus Landwirtschaft, handwerklicher Käseherstellung, Holzschnitzerei und sanftem Tourismus. Der Ruf der Region beruht auf einem Landschaftsbild, das von Almen, Wasserfällen und Lärchenwäldern geprägt ist, und auf Traditionen, die in den abgeschiedenen Dörfern besonders lange überdauert haben.

  Die Geschichte des Tals ist eine Geschichte des Umgangs mit der Natur. Wer hier lebt, muss mit Lawinen, Muren und Hochwasser rechnen, mit kurzen Sommern und langen Wintern. Die Antworten der Bewohner auf diese Herausforderungen, von der Almwirtschaft über den Bergbau bis zum Lawinenschutz, bilden das Gerüst dieses Artikels.

  ## Lage und Landschaft

  Das Kesseltal öffnet sich nach Norden und wird vom Kesselbach durchflossen, der im Talschluss aus dem Gletscherrest des Hochkessels entspringt. Im oberen Abschnitt fällt der Bach über mehrere Stufen, von denen der Schleierfall mit gut einhundertzwanzig Metern der höchste ist. Weiter unten weitet sich das Tal zu einer breiten, flachen Sohle, die in der Eiszeit vom Gletscher ausgeschürft wurde und heute von Wiesen und Äckern bedeckt ist. Die Talflanken steigen zu beiden Seiten steil an: im Westen die Kette der Sägezähne mit Gipfeln um zweitausendsechshundert Meter, im Osten der breitere Rücken des Leitenkamms.

  Geologisch besteht das Tal überwiegend aus Kalk und Dolomit, im östlichen Teil treten Schiefer und Phyllite auf, in denen die Erzgänge liegen. Die Kalkwände sind durchlöchert von Höhlen, von denen die Eisgrotte am Falkenstein die bekannteste ist. Quellen, die am Fuß der Wände entspringen, speisen die Dörfer mit sauberem Trinkwasser. Der Talboden ist mit Schutt und Schwemmkegeln überdeckt, die Seitenbäche in Jahrtausenden aufgeschüttet haben und auf denen die meisten Siedlungen stehen, weil sie hochwassersicherer sind als die Talmitte.

  Die Eisgrotte am Falkenstein liegt auf eintausendneunhundert Metern Höhe und reicht rund zweihundert Meter in den Berg. Im Eingangsbereich bleibt auch im Sommer Eis liegen, weil kalte Luft in den abwärts geneigten Gängen wie in einem Sack gefangen ist. Höhlenforscher aus Hohenried vermessen sie seit 1936, und 1994 fanden sie in einer Seitenhalle die Knochen eines Höhlenbären. Die Grotte ist im Sommer für Führungen geöffnet, im Winter dient sie Fledermäusen als Quartier.

  Zur Landschaft gehören auch die Wälder, die rund vierzig Prozent der Fläche bedecken. Im Tal wachsen Fichten und Buchen, in höheren Lagen Lärchen und Zirben, darüber beginnt die alpine Matte mit Alpenrosen und Enzian. Der Hochkessel ist seit 1962 als Naturschutzgebiet ausgewiesen, in dem Steinböcke und Murmeltiere leben und der Bartgeier, der in den Siebzigerjahren wieder angesiedelt wurde, seine Kreise zieht.

  ## Geschichte

  Die ersten Spuren menschlicher Anwesenheit im Tal stammen aus der Bronzezeit. Hirten trieben ihr Vieh im Sommer auf die Hochweiden und hinterließen Feuerstellen und Werkzeuge aus Feuerstein, die im Gamsjochgebiet gefunden wurden. Keltische und später römische Siedler nutzten das Tal vermutlich vor allem als Durchgang. Die Römer ließen einen Saumpfad über den Pass anlegen, von dem Reste von Stützmauern erhalten sind.

  Eine dauerhafte Besiedlung setzte erst im Hochmittelalter ein. Um 1150 gründeten Mönche aus dem Kloster Sankt Ottilien am Ausgang des Tals eine Niederlassung, rodeten den Wald und teilten das Land an Bauern aus, die ihnen Abgaben leisteten. Die Siedlungen wuchsen entlang des Baches, und im vierzehnten Jahrhundert zählte das Tal bereits etwa zweitausend Einwohner. Mit dem Silberfund von 1318 am Leitenkamm strömten Bergleute herbei, und die Bevölkerung stieg auf ein Vielfaches.

  Die Neuzeit brachte Krisen. Im Dreißigjährigen Krieg plünderten durchziehende Truppen die Dörfer, die Pest forderte 1635 mehr als ein Viertel der Bewohner, und das Silber ging zur Neige. Danach war das Tal lange arm. Viele Männer zogen als Saisonarbeiter in die Städte, die Frauen führten die Höfe. Im achtzehnten Jahrhundert begann die Käserei, die bislang für den Eigenbedarf betrieben worden war, sich zum Erwerbszweig zu entwickeln, und mit der Kartoffel kam ein neues Grundnahrungsmittel.

  Die Verwaltung des Tals lag über Jahrhunderte beim Kloster, das einen Pfleger in Sankt Ottilien einsetzte, der Recht sprach und Abgaben einzog. Mit der Aufhebung des Klosters 1803 fiel das Tal an den Landesherrn, und die Gemeinden erhielten eigene Vorsteher. Die Bauern konnten sich nun von den Grundlasten freikaufen, was vielen gelang, indem sie Wald oder Weide verkauften und sich hoch verschuldeten. Erst die Gründung von Raiffeisenkassen in den Achtzigerjahren des neunzehnten Jahrhunderts brachte günstige Kredite und beendete die Abhängigkeit von Geldverleihern.

  Der Physiker Leopold Brandsteiner, der 1872 für mehrere Wochen im Gasthof zur Post in Sankt Ottilien wohnte, soll dort Messungen zum Luftdruck an verschiedenen Höhen vorgenommen haben, die er später in einer wissenschaftlichen Abhandlung veröffentlichte. Im neunzehnten Jahrhundert öffnete sich das Tal dem Fremdenverkehr, und 1898 erreichte die Kesselbahn den Ort Sankt Ottilien. Zwei Weltkriege und der darauffolgende Strukturwandel führten zur Abwanderung, die erst in den Achtzigerjahren zum Stillstand kam.

  ## Klima und Naturgefahren

  Das Klima des Kesseltals ist ein Gebirgsklima mit kühlen, niederschlagsreichen Sommern und kalten, schneereichen Wintern. Im Talboden liegt die Jahresmitteltemperatur bei etwa sechs Grad, auf dem Hochkessel unter dem Gefrierpunkt. Die Niederschläge nehmen mit der Höhe zu und erreichen im Talschluss über zweitausend Millimeter im Jahr, ein großer Teil davon fällt als Schnee. Im Winter liegt der Schnee im oberen Tal von November bis April. Charakteristisch ist der Föhn, ein warmer, trockener Fallwind aus Süden, der Temperaturen innerhalb weniger Stunden um zehn Grad ansteigen lässt und den Schnee rasch abschmilzt.

  Das Wetter bestimmt den Alltag. Gewitter entladen sich im Sommer oft mit großer Heftigkeit über den Hängen und lassen den Kesselbach binnen Stunden anschwellen. Für die Bewohner gehören Murgänge, Steinschlag und Hochwasser zu den ständigen Begleitern. Die Mure von 1927, bei der sich nach tagelangem Regen ein Hang oberhalb von Mittelkessel löste, zerstörte elf Häuser und riss das Dorf zeitweise von der Außenwelt ab. Seitdem sind alle Seitenbäche mit Sperren und Rückhaltebecken gesichert.

  Im Jahresverlauf lassen sich vier gut erkennbare Phasen unterscheiden. Auf den langen Winter folgt eine kurze Schneeschmelze im April und Mai, in der der Kesselbach das Fünffache seiner Winterwassermenge führt. Im Hochsommer kommen die Gewitter, im Herbst die klaren, trockenen Tage, die als Goldener Oktober gerühmt werden und die schönste Zeit zum Wandern bieten. Die Bauern beobachten Wolken und Wind genau und haben dafür ein eigenes Vokabular entwickelt, das von der „Kesselhaube“ bis zum „Sägezahnrauch“ reicht.

  Auch der Klimawandel ist spürbar. Der Gletscher am Hochkessel hat seit 1900 mehr als siebzig Prozent seiner Fläche verloren, und der Permafrost in den Felswänden taut auf, was die Zahl von Felsstürzen erhöht. Die Schneedecke wird in tieferen Lagen unzuverlässiger, die Vegetationsgrenze steigt, und Starkregen nimmt zu. Das Tal beobachtet diese Veränderungen mit Messstationen, deren Daten für die Planung genutzt werden. Die Fernsehserie „Bergwinter“ wurde 2004 teilweise im Tal gedreht und zeigte das Gebirge von seiner rauen Seite.

  ## Almwirtschaft und Käseherstellung

  Die Landwirtschaft im Kesseltal beruht seit Jahrhunderten auf der Almwirtschaft. Im Frühsommer treiben die Bauern ihr Vieh von den Höfen im Tal auf die Mittelstufen, den sogenannten Vorsäß, und von dort Ende Juni weiter auf die Hochalmen. Rund hundertzwanzig Almen sind bestoßen, auf denen von Juni bis September etwa vierhundert Milchkühe, Jungvieh, Schafe und Ziegen weiden. Die Sennerinnen und Senner leben den Sommer über in einfachen Hütten und melken zweimal täglich.

  Aus der Milch entsteht der Kesseltaler Bergkäse, ein Hartkäse aus roher Kuhmilch, der in Kupferkesseln über offenem Holzfeuer gewärmt wird. Das Verfahren folgt einem festen Ablauf: Die frische Milch wird auf etwa dreißig Grad erwärmt, mit Lab versetzt und nach dem Dicklegen mit der Käseharfe in kleine Körner geschnitten. Der Bruch wird unter Rühren auf über vierzig Grad erhitzt, in Tücher geschöpft, in Formen gepresst und anschließend im Salzbad gelagert. Danach reift der Käse mindestens sechs Monate, die besten Laibe bis zu zwei Jahre, in Kellern, in denen Luftfeuchtigkeit und Temperatur gleichmäßig bleiben. Alle paar Tage werden die Laibe gewendet und mit einer Salzlake abgerieben.

  Der Geschmack variiert mit Jahreszeit und Weide. Die Milch der Hochalmen enthält mehr Aromastoffe von Kräutern und gilt als besonders gehaltvoll. Das Sortenspektrum reicht vom milden Halbhartkäse, den die Talsennereien herstellen, bis zum würzigen Almkäse mit nussigem Aroma. Weil der Käse so aufwendig ist, ist er teuer, und viele Betriebe vermarkten ihn direkt an Gäste und in kleinen Hofläden.

  Neben dem Bergkäse entstehen weitere Milchprodukte. Aus der Molke wird Ziger gewonnen, ein weicher Frischkäse, aus Buttermilch eine säuerliche Sauermilchsorte, und aus dem Rahm Almbutter, die in Holzmodeln geformt wird. Auf den Almen, die keine Käserei betreiben, wird die Milch täglich zu Tal gebracht, früher mit Tragtieren, heute mit Seilbahnen oder Geländewagen. Die Qualität wird regelmäßig kontrolliert: Prüfer klopfen jeden Laib mit einem kleinen Hammer ab und hören am Klang, ob er innen Hohlräume hat.

  Die Genossenschaft Kesseltaler Almkäse wurde 1921 gegründet, um den Absatz gemeinsam zu organisieren und die Qualität zu überwachen. Sie unterhält eine zentrale Reifehalle in Sankt Ottilien, in der rund fünfzehntausend Laibe lagern, und vergibt ein Herkunftszeichen, das Käse nur dann erhalten darf, wenn Milch, Verarbeitung und Reifung im Tal stattfinden. Zweimal im Jahr, im Frühling und im Herbst, finden Käsemärkte statt, auf denen die Bauern ihre Ware vorstellen und Preise verhandeln.

  Die Arbeit auf der Alm folgt einem festen Jahresrhythmus. Schon im Mai werden die Zäune geflickt, Wasserleitungen freigelegt und die Hütten ausgeräumt, die den Winter über leer standen. Auf den Weiden müssen Steine gesammelt und Lawinenschutt beiseitegeräumt werden, damit kein Futter verloren geht. Die Bauern teilen das Weiderecht nach einer überlieferten Ordnung zu, die festlegt, wie viele Tiere eine Alm tragen darf. Wer mehr Vieh auftreibt, muss Abgaben zahlen, und über Streitfälle entscheidet bis heute ein Almausschuss aus erfahrenen Landwirten.

  Das Heu der Bergmähder, steiler Wiesen oberhalb der Waldgrenze, wird noch teilweise von Hand gemäht und im Winter mit Schlitten ins Tal gebracht. Es gilt als besonders kräuterreich und wird an die Kühe verfüttert, die im Winter im Stall stehen. Aus dem Futter ergibt sich der Geschmack der Milch, weshalb die Bauern genau darauf achten, welche Wiesen wann gemäht werden. Silage ist für Bergkäse nach den Regeln der Genossenschaft verboten.

  Die Almwirtschaft erfüllt weitere Aufgaben. Das Vieh hält die Hochweiden offen und verhindert die Verbuschung, was der Artenvielfalt zugutekommt. Almen sind außerdem ein Teil des kulturellen Erbes: Der Almabtrieb im September, bei dem die Tiere mit Blumen und Glocken geschmückt ins Tal geführt werden, zieht jedes Jahr Tausende Besucher an. Zugleich hat die Branche mit Nachwuchsproblemen zu kämpfen, denn die Arbeit ist hart, das Einkommen mäßig und der Bedarf an Maschinen hoch. Viele kleine Betriebe haben in den letzten Jahrzehnten aufgegeben, und die Zahl der bewirtschafteten Almen sinkt langsam.

  ## Bevölkerung und Gemeinden

  Die Einwohner des Kesseltals sprechen einen alemannisch geprägten Dialekt, der sich von dem des Vorlands durch eine eigene Aussprache und viele altertümliche Wörter unterscheidet. Das Tal gliedert sich in sieben Gemeinden: Hohenried am Taleingang, Sankt Ottilien mit dem Bahnhof, Mittelkessel, Unterwald, Lärchenau, Oberkessel und Hinterkessel am Talende. Die Gemeinden arbeiten in einem Verband zusammen, der Schule, Feuerwehr, Wasserversorgung und Winterdienst gemeinsam organisiert.

  Die Bevölkerung hat sich im zwanzigsten Jahrhundert verändert. Während die Landwirtschaft früher fast alle beschäftigte, arbeiten heute weniger als ein Fünftel der Einwohner in der Land- und Forstwirtschaft. Viele pendeln in die nächste Stadt, andere arbeiten im Gastgewerbe, im Handwerk oder in kleinen Betrieben. Die Alterung ist ein Thema: Das Durchschnittsalter liegt über dem Landesmittel, und junge Familien ziehen häufig in die Städte. Die Gemeinden versuchen gegenzusteuern, mit günstigem Bauland, einer kleinen Volksschule in jedem größeren Ort und Förderungen für Betriebe.

  Zu den bekannten Söhnen des Tals zählt der Fußballspieler Matthias Gruber aus Lärchenau, der in den Neunzigerjahren in der ersten Liga spielte. Das Gemeinschaftsleben ist von Vereinen getragen, vor allem von Musikkapellen, Schützen, Feuerwehren und Trachtengruppen, die Feste wie das Kesselfest im August und den Lichtmessmarkt im Februar ausrichten.

  Das Brauchtum im Jahreslauf ist ein weiteres Merkmal der Region. Im Januar ziehen die Sternsinger von Haus zu Haus, im Frühjahr wird das Osterfeuer auf dem Kirchbichl entzündet, und im Sommer findet an Peter und Paul das Sonnwendfeuer auf den Bergen statt. Im Herbst werden nach dem Almabtrieb die Ernte und der Viehbestand gesegnet. Trachten gehören in den meisten Familien zum Festtag; die Frauen tragen schwarze Mieder mit Silberkette, die Männer Lederhosen und grüne Janker.

  ## Das Silberbergwerk am Leitenkamm

  Der Bergbau im Kesseltal begann mit dem Silberfund von 1318, als ein Hirte namens Jörg Lamprecht auf der Suche nach einem verlaufenen Schaf in einer Schiefersenke glänzende Bleiglanzadern entdeckt haben soll. Binnen weniger Jahre entstand am Leitenkamm eine Bergwerkssiedlung, die Bergleute aus Tirol, Sachsen und Böhmen anzog. Der Landesherr gewährte ihnen besondere Rechte, darunter eigene Gerichtsbarkeit und Befreiung von Abgaben, und sicherte sich dafür einen Anteil am Gewinn, den sogenannten Zehnten.

  Das Erz wurde zunächst im Tagebau gewonnen, später in Stollen, die dem Gang folgten und bis zu dreihundert Meter tief in den Berg reichten. Die Bergleute trieben die Strecken mit Schlägel und Eisen vor, setzten Feuer, um das Gestein mürbe zu machen, und fingen später an, mit Schwarzpulver zu sprengen. Das Wasser, das in die Stollen sickerte, musste mit Wasserrädern und Pumpen gehoben werden, und die Frischluft wurde über Wetterschächte zugeführt. Das Erz wurde in Pochwerken zerkleinert, in Waschanlagen vom tauben Gestein getrennt und in Schmelzhütten im Tal verhüttet. Dazu wurden riesige Mengen Holz benötigt, weshalb die Wälder um den Leitenkamm im sechzehnten Jahrhundert fast vollständig abgeholzt waren.

  Das Leben der Bergleute folgte einer strengen Ordnung. Die Bergordnung von 1330 regelte Arbeitszeiten, Lohn und Sicherheit: Eine Schicht dauerte acht Stunden, gearbeitet wurde in Schichten rund um die Uhr, und vor jeder Fahrt in den Berg versammelte sich die Mannschaft zum Gebet. Die Steiger beaufsichtigten den Abbau, die Hauer lösten das Erz, die Knechte förderten es, und Kinder lasen auf Halden das taube Gestein aus. Krankheit und Unfälle waren häufig; Staublunge und Einstürze verkürzten das Leben vieler Bergleute. Die Knappschaft, eine Gemeinschaftskasse, zahlte bei Verletzung oder Alter eine kleine Unterstützung und gilt als Vorläufer der Sozialversicherung.

  Im Jahr 1570 erreichte die Förderung mit rund zehn Tonnen Silber ihren Höhepunkt, danach ging sie zurück. Die ergiebigen Adern waren erschöpft, die Stollen wurden tiefer und gefährlicher, und das Silber aus Amerika drückte die Preise. Gegen Ende des siebzehnten Jahrhunderts wurde der Betrieb eingestellt. Zurück blieben Halden, verfallene Gebäude und ein dichtes Netz von Stollen, in dem heute Fledermäuse überwintern.

  Die Besitzer der Gruben, die Gewerken, waren meist Kaufleute aus der Stadt, die Geld in den Bergbau steckten und auf Gewinn hofften. Sie hielten Anteile, sogenannte Kuxe, die gehandelt wurden und stark im Wert schwankten. Fiel ein Stollen taub aus, verloren sie ihr Geld; stießen die Knappen auf eine reiche Ader, wurde der Anteil über Nacht ein Vermögen wert. Mehrere Familien des Vorlands verdankten ihren Reichtum dem Silber vom Leitenkamm.

  Seit 1984 ist ein Teil der Anlagen als Schaubergwerk zugänglich. Besucher fahren mit einer kleinen Grubenbahn in den Berg, sehen die Arbeitsplätze der Bergleute und lernen die Technik kennen. Das Museum im ehemaligen Pochwerk zeigt Werkzeuge, Karten und Urkunden. Den Verein der Bergknappen, der das Erbe pflegt, gibt es seit 1952, und seine Mitglieder tragen bei Festen die traditionelle schwarze Tracht mit dem Schachthut. Das Bergwerk hat nicht nur kulturelle Bedeutung, sondern sorgt auch für Arbeitsplätze und Besucher.

  ## Lawinenschutz

  Der Winter bringt dem Tal nicht nur Schnee, sondern auch Lawinengefahr. Von den steilen Flanken lösen sich regelmäßig Schneebretter und Nassschneelawinen, die bis in die Siedlungsgebiete vordringen können. Die größte Katastrophe ereignete sich im Februar 1951, als in zwei Tagen mehr als zwei Meter Neuschnee fielen und eine Staublawine vom Sägezahnmassiv das Dorf Oberkessel traf. Sechsundzwanzig Menschen kamen ums Leben, mehr als zwanzig Gebäude wurden zerstört.

  Als Reaktion begann das Tal mit einem systematischen Lawinenschutz. Seine Elemente lassen sich in drei Gruppen einteilen. Zum permanenten Schutz zählen Stützverbauungen aus Stahl in den Anbruchgebieten, die den Schnee am Abgleiten hindern, Ablenkdämme und Bremshöcker in der Sturzbahn sowie Auffangdämme und Galerien an den Straßen. Dazu kommt der biologische Schutz durch Bannwälder, die gezielt gepflegt und in schutzwürdigen Hängen angepflanzt werden. In Oberkessel steht seit 1958 ein Spaltkeil aus Beton, der die Lawine teilt und um das Dorf herumlenkt.

  Nach dem Unglück von 1951 wurde Oberkessel nicht aufgegeben, obwohl manche Bewohner das forderten. Die Überlebenden zogen für zwei Jahre in Notunterkünfte nach Lärchenau, und der Wiederaufbau erfolgte an etwas geschützteren Stellen. Das Dorf erhielt eine neue Kirche, deren Rückwand als Lawinenkeil gebaut wurde, und an der Unglücksstelle erinnert ein schlichtes Holzkreuz mit sechsundzwanzig Namen. Die Erfahrung führte zu einer eigenen Kultur der Vorsicht, die bis heute in den Familien weitergegeben wird.

  Der zweite Bereich ist die Gefahrenzonenplanung. Auf Grundlage historischer Aufzeichnungen und Berechnungen werden Rote und Gelbe Zonen ausgewiesen: In roten Bereichen darf nicht gebaut werden, in gelben nur mit besonderen Auflagen, etwa verstärkten Wänden auf der Bergseite. Die Pläne werden alle zehn Jahre überprüft und an neue Erkenntnisse angepasst.

  Der dritte Bereich ist die temporäre Sicherung. Die örtliche Lawinenkommission, die aus erfahrenen Bergführern, Förstern und Gemeindevertretern besteht, beobachtet im Winter täglich die Schneedecke, wertet Messstationen aus und gibt Warnstufen bekannt. Bei hoher Gefahr werden Straßen gesperrt, gefährdete Häuser geräumt und kritische Hänge durch Sprengungen kontrolliert ausgelöst. Seit einigen Jahren kommen dafür auch Gasexploder und Helikopter zum Einsatz. Für Wintersportler gibt es ein Lawinenlagebericht-System und kostenlose Kurse in den Schulen, damit schon Kinder lernen, Gefahren zu erkennen.

  Die Rettung verschütteter Menschen erfordert Schnelligkeit, denn die Überlebenschance sinkt nach den ersten fünfzehn Minuten stark ab. Die Bergrettung des Tals unterhält deshalb ein Team aus Freiwilligen, drei Lawinenhunde und ein Suchgerät-Depot in jedem Ort; Skitourengeher tragen Verschüttetensuchgerät, Sonde und Schaufel. Die Hunde werden zwei Jahre lang ausgebildet und finden einen Verschütteten unter mehreren Metern Schnee in wenigen Minuten.

  ## Die Kesselbahn

  Die Kesselbahn ist eine Schmalspurbahn mit einer Spurweite von 760 Millimetern, die Hohenried mit Sankt Ottilien verbindet. Gebaut wurde sie zwischen 1895 und 1898 von der Lokalbahn-Gesellschaft Kesseltal, vor allem um Holz und Vieh aus dem Tal zu befördern. Der Bau war eine Herausforderung: Auf einer Strecke von nur sechzehn Kilometern überwindet die Bahn rund dreihundert Höhenmeter, wofür vierzehn Brücken, drei Tunnel und eine Kehrschleife nötig waren. Besonders bekannt ist das steinerne Viadukt über die Kesselschlucht bei Unterwald, das auf neun Bögen eine Länge von einhundertachtzig Metern erreicht.

  Das Viadukt bei Unterwald entstand in drei Sommern. Maurer aus dem Friaul schichteten die Bögen aus Kalkstein, der in einem Steinbruch am Ort gebrochen wurde, und arbeiteten auf hölzernen Lehrgerüsten, die nach dem Schließen der Bögen entfernt wurden. Beim Bau starben zwei Arbeiter, als ein Gerüst im Sturm einbrach. Der Hauptingenieur Ferdinand Auerswald, der die Linienführung entwarf, soll die Trasse mehrfach zu Fuß abgegangen sein, um die gleichmäßigste Steigung zu finden. Das Bauwerk steht noch heute unverändert und wird alle sechs Jahre geprüft.

  Der Betrieb begann mit Dampflokomotiven, die Kohle aus dem Vorland brauchten und deshalb teuer im Unterhalt waren. 1936 wurde die Strecke elektrifiziert, nachdem das Kraftwerk am Kesselbach genug Strom lieferte. In den Fünfzigerjahren erreichte die Bahn ihren Höchststand mit über einer halben Million Fahrgästen im Jahr, weil sie Arbeitern, Schülern und Urlaubern diente. Der Güterverkehr mit Holz und Milch endete nach und nach, als Lastwagen übernahmen, und 1972 stand die Strecke vor der Stilllegung.

  Der Verein Freunde der Kesselbahn rettete sie, indem er Spenden sammelte und das Land überzeugte, die Strecke als Kulturdenkmal zu erhalten. Heute fahren Triebwagen im Stundentakt, an Sommerwochenenden zusätzlich Dampfzüge für Touristen. Die Bahn gilt als Rückgrat des öffentlichen Verkehrs im Tal und befördert jährlich rund dreihunderttausend Fahrgäste. Seit 2015 werden die Fahrzeuge schrittweise durch moderne, leichte Wagen ersetzt, die sich auch bei Steigungen von bis zu fünfundsiebzig Promille bewähren.

  Die Instandhaltung der Strecke ist aufwendig. Im Winter müssen Schneepflüge die Gleise freihalten, im Frühjahr Steinschlagnetze und Entwässerungsgräben erneuert werden. Die Kosten übersteigen die Einnahmen bei Weitem, weshalb der Betrieb nur mit öffentlichen Zuschüssen möglich ist. Dass sie dennoch seit über einem Jahrhundert fährt, liegt am Zusammenspiel aus Bürgerengagement, Tourismus und der Einsicht, dass die Bahn ein Stück Identität des Tals bewahrt.

  ## Holzschnitzerei und Handwerk

  Das Kesseltal ist überregional für seine Holzschnitzerei bekannt. Der Rohstoff ist reichlich vorhanden: Zirbe und Linde lassen sich gut schnitzen, Ahorn und Lärche eignen sich für Geschirr und Möbel. Die Tradition geht bis ins siebzehnte Jahrhundert zurück, als Bergleute und Bauern im Winter, wenn die Arbeit ruhte, aus Holz Figuren, Löffel und Spielzeug herstellten, um etwas dazuzuverdienen. Aus dem Nebenerwerb wurde bald ein eigenes Gewerbe, und Händler, sogenannte Kraxenträger, brachten die Waren auf dem Rücken in die Städte des Vorlands.

  Im neunzehnten Jahrhundert entstanden Werkstätten, die Krippenfiguren, Heiligenstatuen und Kruzifixe fertigten. 1874 gründete der Schnitzer Matthäus Hollenstein in Sankt Ottilien die erste Fachschule, in der Lehrlinge in Zeichnen, Modellieren und Werkzeugkunde unterrichtet wurden. Noch heute besuchen jedes Jahr etwa dreißig Schüler die Schnitzschule, deren Absolventen in aller Welt arbeiten. Das Handwerk ist auch ein Wirtschaftsfaktor: Rund zweihundert Menschen leben ganz oder teilweise vom Schnitzen, von der Restaurierung von Altären bis zur Anfertigung von Masken für das Brauchtum.

  Die Arbeitsweise hat sich kaum verändert. Der Schnitzer beginnt mit einem Block aus trockenem Holz, zeichnet die Umrisse an und arbeitet mit Beil und Schnitzbeitel die groben Formen heraus. Für die Feinarbeit stehen mehr als hundert Eisen in verschiedenen Krümmungen und Breiten zur Verfügung, die er selbst schärft. Gesicht und Hände werden zuletzt gearbeitet, danach wird die Figur mit Leimfarben gefasst oder mit Öl und Wachs behandelt. Eine Krippenfigur von dreißig Zentimetern Höhe erfordert rund vierzig Arbeitsstunden. Viele Werkstätten fertigen auch Aufträge für Kirchen, die in Bayern und Österreich beauftragt werden.

  Die Schnitzschule nimmt Jugendliche ab fünfzehn Jahren auf und bildet sie in vier Jahren zu Bildhauern aus. Der Unterricht umfasst neben dem Schnitzen auch Anatomie, Kunstgeschichte, Farblehre und Betriebswirtschaft. Wer sich weiter qualifizieren will, geht auf Wanderschaft oder studiert an einer Kunstakademie in einer Stadt des Vorlands und kehrt oft später ins Tal zurück, um eine Werkstatt zu übernehmen.

  Zu den Besonderheiten zählen die Kesseltaler Perchtenmasken, aus Zirbenholz geschnitzte Gesichter mit Hörnern und Fell, die bei den Umzügen in den Raunächten getragen werden. Jedes Dorf hat eigene Formen, und viele Masken werden seit Generationen vererbt. Daneben gibt es Hausmusikinstrumente wie Zithern, die in einer Werkstatt in Mittelkessel gebaut werden.

  Der Werkstoff Holz bestimmt nicht nur die Kunst, sondern auch das Bauwesen. Die Häuser des Tals sind überwiegend Blockbauten aus Fichte und Lärche mit weit vorspringenden Dächern, geschnitzten Giebeln und Balkonen, die mit Mustern verziert sind. Wer ein Haus renoviert, wird von der Denkmalpflege beraten. Neben der Schnitzerei sind auch die Weberei von Loden und die Töpferei im Tal verbreitet, wenn auch weniger bedeutend.

  ## Verkehr und Energie

  Die wichtigste Verkehrsachse ist die Kesseltalstraße, die dem Bach folgt und bei Hinterkessel in die Passstraße über das Gamsjoch übergeht. Bis in die Fünfzigerjahre war sie nur ein Fahrweg, der im Winter regelmäßig zuschneite; heute ist sie ganzjährig befahrbar, mit zwei Tunneln und mehreren Lawinengalerien. Im Winter bleibt der Pass allerdings gesperrt. Die Postbuslinie verbindet die Dörfer im Zweistundentakt, und Mitfahrzentralen der Gemeinden ergänzen sie am Abend.

  Die Wasserkraft prägt die Energieversorgung. Seit 1912 liefert das Kraftwerk Schleierfall Strom aus dem Gefälle des Kesselbachs, ein zweites, größeres Werk wurde 1957 bei Unterwald errichtet. Zusammen erzeugen sie mehr Strom, als das Tal verbraucht, und ein Teil davon wird ins Landesnetz eingespeist. Die Gemeinden sind am Betreiber beteiligt und finanzieren aus den Einnahmen Schule, Schwimmbad und Straßen. Zusätzlich heizen viele Haushalte mit Holz aus den Gemeindewäldern, und in Sankt Ottilien versorgt ein Hackschnitzelwerk ein kleines Fernwärmenetz.

  Der Ausbau der Breitbandversorgung erreichte die Seitentäler erst spät. Seit 2020 liegt in allen Gemeinden Glasfaser, was Homeoffice und kleine Unternehmen möglich macht und die Abwanderung bremsen soll. Mehrere Gemeinden betreiben gemeinsame Gewerbehöfe für Handwerker und Selbstständige.

  ## Tourismus

  Der Tourismus begann im neunzehnten Jahrhundert, als Sommerfrischler die Luft und die Ruhe des Tals entdeckten. Mit der Bahn kamen Familien aus der Stadt, die in Gasthöfen und Pensionen wohnten, auf markierten Wegen wanderten und die Almen besuchten. Der Alpenverein baute 1903 die erste Schutzhütte am Hochkessel. Heute zählt das Tal etwa vierhunderttausend Übernachtungen im Jahr, davon zwei Drittel im Sommer.

  Das Angebot ist bewusst klein gehalten. Es gibt keine Großhotels und keine Skischaukel mit Liftanlagen; stattdessen wird das Tal als Region für Wandern, Bergsteigen, Skitouren und Langlaufen vermarktet. Neben Beherbergungsbetrieben spielen Bauernhöfe mit Ferienwohnungen eine große Rolle. Die Gemeinden haben sich auf einen Verzicht auf neue Erschließungen geeinigt und fördern stattdessen Qualität: Wanderwege, Schutzhütten, Kulturveranstaltungen und regionale Produkte.

  Die Wanderwege des Tals sind insgesamt rund dreihundert Kilometer lang. Der Höhenweg über den Leitenkamm verbindet in vier Tagesetappen vier Schutzhütten, der Lehrpfad am Schleierfall erklärt Geologie und Wasserhaushalt, und die Talrunde für Radfahrer folgt der alten Bahntrasse. Im Winter werden Loipen gespurt und Rodelbahnen präpariert. Geführte Touren zu den Almen und zur Eisgrotte vermitteln Wissen über Natur und Tradition, und mehrere Bauernhöfe bieten Kurse im Käsen und Schnitzen an.

  Der sanfte Tourismus bringt Chancen, aber auch Herausforderungen. Er schafft Einkommen und hält das Tal bewohnt, doch in der Hochsaison belasten Autos die schmalen Straßen. Ein Shuttle-Bus und das Angebot der Kesselbahn sollen den Verkehr eindämmen. Wie viel Wachstum das Tal vertragen kann, bleibt Gegenstand von Diskussionen, in denen Wirte, Landwirte und Naturschützer unterschiedliche Positionen vertreten.
