id: es-ciclismo-en-ruta
lang: es
title: El ciclismo en ruta
text: |
  El ciclismo en ruta es la modalidad deportiva en la que los corredores recorren en bicicleta largas distancias por carreteras abiertas, ya sea en una prueba de un solo día o en una carrera por etapas que se prolonga durante varias semanas. A diferencia del ciclismo en pista, que se disputa en un velódromo, o del ciclismo de montaña, que busca senderos y terrenos irregulares, el ciclismo en ruta se desarrolla sobre asfalto y convierte el paisaje en parte esencial del espectáculo: los puertos de montaña, los llanos azotados por el viento y los adoquines de las carreteras antiguas deciden el resultado tanto como las piernas de los corredores.

  Se trata de un deporte de resistencia y de estrategia. Un ciclista puede pedalear más de cinco horas seguidas, y durante ese tiempo debe administrar sus fuerzas, comer sin detenerse, protegerse del viento detrás de sus compañeros y elegir el momento exacto de atacar. Las carreras se disputan por equipos, de modo que el éxito individual casi siempre depende del trabajo de varios corredores que se sacrifican para que otro llegue fresco al tramo decisivo.

  ## Orígenes y primeras carreras

  Las primeras competiciones sobre carretera se organizaron a finales del siglo XIX, cuando la bicicleta de cadena y ruedas del mismo tamaño sustituyó a los velocípedos de rueda delantera enorme. Los periódicos descubrieron pronto que una carrera larga vendía ejemplares, y varios de ellos patrocinaron pruebas entre ciudades vecinas; en una de ellas, la crónica corrió a cargo de un joven novelista, Ramiro Sedano, que después fue famoso por sus cuentos de piratas. Aquellas carreras pioneras se corrían por caminos de tierra, sin asistencia mecánica, y los participantes reparaban sus propios pinchazos al borde de la carretera.

  Con el tiempo aparecieron las grandes vueltas por etapas. La Vuelta a la Sierra del Alba, una carrera ficticia que se disputa desde 1921 en una comarca de montaña, sirvió de modelo para muchas otras: once etapas, una clasificación general por tiempos y un jersey distintivo para el líder. En esa primera edición, el ganador, un tal Tomás Ibarrola, tardó casi cuarenta horas en completar un recorrido que hoy un buen aficionado cubriría en dos jornadas.

  ## La bicicleta y su tecnología

  La bicicleta de carretera se distingue por su ligereza, su manillar curvo y sus ruedas finas, infladas a una presión elevada para reducir la resistencia al rodamiento. El cuadro, que durante décadas se fabricó con tubos de acero, se construye hoy casi siempre con fibra de carbono, un material capaz de combinar rigidez y bajo peso. Los reglamentos internacionales fijan un peso mínimo para las bicicletas de competición, de manera que los equipos ya no pueden aligerarlas sin límite.

  El cambio de marchas ha vivido una revolución silenciosa. Los primeros corredores debían detenerse para dar la vuelta a la rueda trasera y colocar la cadena en otro piñón. Después llegaron las palancas en el cuadro, más tarde los mandos integrados en las manetas de freno y, por último, los cambios electrónicos, que accionan los desviadores mediante pequeños motores y una batería. Un ciclista actual dispone de once o doce piñones y de dos platos, lo que le permite mantener un ritmo de pedaleo cómodo tanto en una bajada como en una rampa del doce por ciento.

  La aerodinámica ocupa un lugar cada vez más importante. Los equipos prueban cascos, monos de competición y posiciones sobre la bicicleta en túneles de viento, porque a velocidades superiores a cuarenta kilómetros por hora la mayor parte del esfuerzo se emplea en vencer la resistencia del aire. Por eso el pelotón funciona como una máquina colectiva: quien rueda a rueda de otro ahorra una porción considerable de energía, y los corredores se turnan en cabeza para repartir el desgaste.

  ## Tácticas de carrera y pelotón

  Una etapa llana suele seguir un guion conocido. Un grupo reducido de corredores se escapa al principio, el pelotón los deja ganar algunos minutos para no gastar fuerzas inútilmente y, en los últimos kilómetros, los equipos de los velocistas aceleran para darles caza. El tramo final se convierte en una sucesión de maniobras milimétricas en las que un compañero, llamado lanzador, deja a su líder a unos doscientos metros de la meta para que se lance al esprint.

  En la montaña las reglas cambian. Los escaladores, corredores ligeros y de gran capacidad pulmonar, atacan en las rampas más duras, y quienes aspiran a la victoria final cuentan con gregarios que marcan el ritmo para desanimar a los rivales. Un buen descenso puede valer tanto como una buena subida, y algunos corredores han ganado etapas arriesgando en curvas que sus rivales tomaban con prudencia. Los directores deportivos siguen la carrera desde un coche y dictan órdenes por radio, aunque la discusión sobre el uso de los auriculares divide a los aficionados.

  En el pueblo de Valdecastro, por el que pasa cada año la Vuelta a la Sierra del Alba, se rodó en 1974 una película de aventuras que obtuvo cierto éxito en las salas de la región.

  ## La alimentación del ciclista

  Una etapa de montaña puede exigir más de seis mil kilocalorías, una cifra que ningún corredor puede cubrir con tres comidas diarias. Por eso la alimentación forma parte del entrenamiento y de la propia carrera. Durante la prueba los ciclistas comen en la bicicleta barritas de cereales, geles de carbohidratos, plátanos, bocadillos de arroz y bebidas con sales minerales. La regla general consiste en tomar entre sesenta y noventa gramos de hidratos de carbono por hora, empezando pronto, sin esperar a sentir hambre, porque cuando el hambre aparece el organismo ya ha agotado buena parte de sus reservas de glucógeno.

  El agua es igual de importante. Un corredor puede perder un litro de sudor por hora en una jornada calurosa, y una deshidratación del dos por ciento ya reduce el rendimiento de forma apreciable. Los equipos reparten bidones desde los coches, y en las pruebas largas existen zonas de avituallamiento donde los auxiliares entregan bolsas con comida a los corredores que pasan a toda velocidad. Fuera de la carrera, la dieta se ajusta al tipo de entrenamiento: más hidratos los días de esfuerzo intenso y más proteínas en los de recuperación.

  Los nutricionistas de los equipos profesionales pesan los alimentos, controlan el peso de los corredores durante la temporada y diseñan menús para cada etapa. El tradicional plato de pasta de la víspera ha dado paso a estrategias más matizadas, que tienen en cuenta el perfil de la etapa, la temperatura prevista y hasta la tolerancia digestiva de cada ciclista.

  ## Seguridad vial y caídas

  El ciclismo en ruta es una actividad con un riesgo evidente. Las caídas en el pelotón, a más de cincuenta kilómetros por hora, provocan fracturas de clavícula, de muñeca y de cadera, además de heridas por rozamiento que obligan a retirarse de la carrera. Los organizadores han mejorado la protección de los recorridos con vallas, balizas en las rotondas y señalización de los obstáculos, y desde hace años obligan a llevar casco homologado.

  Fuera de las carreras, los aficionados que salen a entrenar comparten la carretera con automóviles y camiones, y muchos accidentes graves ocurren en esas condiciones. Las asociaciones de ciclistas reclaman que los conductores respeten una distancia lateral mínima de metro y medio al adelantar, norma que ya figura en la legislación de varios países. También piden carriles protegidos en las rutas más frecuentadas y campañas de educación vial dirigidas a todos los usuarios.

  La seguridad no solo depende de las infraestructuras. Los equipos enseñan a los jóvenes corredores a rodar en grupo, a avisar de los obstáculos con gestos y a frenar de forma gradual. Una buena técnica de conducción evita más caídas que cualquier mejora en el material, y por eso las escuelas de ciclismo dedican tantas horas a ejercicios de equilibrio y trazado de curvas antes de que los alumnos participen en sus primeras carreras.
