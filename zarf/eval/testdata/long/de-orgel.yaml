id: de-orgel
lang: de
title: Die Pfeifenorgel
text: |
  Die Pfeifenorgel ist ein Tasteninstrument, bei dem der Klang durch Luft erzeugt wird, die durch eine Vielzahl von Pfeifen strömt. Sie gilt als eines der ältesten und zugleich komplexesten Musikinstrumente Europas. Ihre Größe reicht von der kleinen Truhenorgel, die ein einzelner Mann tragen kann, bis zu mächtigen Kirchenorgeln mit mehreren Tausend Pfeifen, die den gesamten Raum eines Gotteshauses mit Klang füllen. Weil jede große Orgel für ihren Standort einzeln entworfen und gebaut wird, gleicht kaum ein Instrument dem anderen.

  Der Spieler sitzt am Spieltisch, der eine oder mehrere Tastaturen für die Hände sowie ein Pedal für die Füße besitzt. Mit Hilfe von Registerzügen wählt er aus, welche Pfeifenreihen erklingen sollen. Dadurch kann eine einzige Orgel sehr verschiedene Klangfarben hervorbringen, vom zarten Flötenton bis zum schmetternden Trompetenklang. Im deutschsprachigen Raum ist die Orgel eng mit dem Gottesdienst verbunden, wird aber ebenso in Konzertsälen und Schulen gespielt.

  ## Aufbau und Funktionsweise

  Eine Orgel besteht im Kern aus drei Teilen: der Windversorgung, der Windlade und den Pfeifen. Früher wurde der Wind von Männern erzeugt, die in einem Nebenraum den Blasebalg traten, den sogenannten Kalkanten. Heute übernimmt ein elektrisches Gebläse diese Aufgabe, doch der Wind wird weiterhin in einem Balg gesammelt, der den Druck gleichmäßig hält. Ein zu schwankender Druck würde den Ton wackeln lassen und den Eindruck eines atmenden Instruments zerstören.

  Von dort gelangt die Luft in die Windlade, einen flachen, luftdichten Kasten, auf dem die Pfeifen stehen. Drückt der Organist eine Taste, öffnet sich ein Ventil, und die Luft strömt in die zugehörige Pfeife. Ob sie tatsächlich erklingt, hängt von den Registern ab, denn jedes Register ist eine eigene Reihe von Pfeifen mit gleicher Klangfarbe, und nur die gezogenen Reihen erhalten Wind. Bei der mechanischen Traktur verbinden hölzerne Leisten, die Abstrakten, die Taste unmittelbar mit dem Ventil, sodass der Spieler den Druckpunkt der Pfeife in den Fingern spürt. Moderne Instrumente arbeiten oft mit elektrischer Steuerung, die lange Wege zwischen Spieltisch und Pfeifen überbrückt.

  Man unterscheidet zwei Pfeifenfamilien. Bei den Lippenpfeifen schlägt der Luftstrom an einer scharfen Kante auf, ähnlich wie bei einer Blockflöte, bei den Zungenpfeifen versetzt er ein dünnes Metallblättchen in Schwingung. Die Länge der Pfeife bestimmt die Tonhöhe: Die tiefsten Pfeifen sind mehrere Meter lang, die höchsten kaum länger als ein Bleistift.

  ## Der Bau der Pfeifen

  In der Werkstatt des Orgelbauers Konrad Hellwig in Bornheide, einem kleinen Ort am Rand des Hügellandes, entstehen die Pfeifen noch größtenteils von Hand. Die Metallpfeifen bestehen meist aus einer Legierung von Zinn und Blei. Das Metall wird geschmolzen und auf einem langen, mit Leinen bespannten Tisch zu einer dünnen Platte ausgegossen. Der Gießer zieht dazu einen Kasten gleichmäßig über die Fläche und lässt eine Schicht von nur wenigen Millimetern zurück. Je mehr Zinn die Legierung enthält, desto heller und glänzender klingt die Pfeife und desto weniger wird sie mit den Jahren matt.

  Nach dem Erkalten wird die Platte glatt gehobelt, zugeschnitten und um einen Holzkern zu einem Rohr gerollt. Die Naht wird verlötet, der Fuß eingesetzt und der Mund ausgeschnitten, jene Öffnung, an der der Ton entsteht. Danach beginnt die eigentliche Kunst, das Intonieren. Dabei stellt der Intonateur jede einzelne Pfeife so ein, dass sie in Lautstärke und Klangfarbe zu ihren Nachbarn passt. Er verändert die Breite des Spalts, biegt die Kernspitze und prüft den Ton immer wieder im Raum, für den das Instrument bestimmt ist, denn jedes Gewölbe verändert den Klang anders.

  Holzpfeifen, meist aus Fichte, Eiche oder Ahorn, dienen vor allem den tiefen Tönen. Sie sind quadratisch im Querschnitt und werden von Tischlern gefertigt, die auf feine Passungen achten müssen, weil schon eine undichte Fuge den Ton verfälscht. Für ein Instrument mittlerer Größe mit etwa dreißig Registern braucht die Werkstatt rund ein Jahr, bevor der erste Ton in der Kirche erklingt. Im Sommer 1998 besuchte ein Imker aus der Nachbarschaft die Werkstatt und hielt die Bienenvölker dort in einem alten Holzschuppen, ein Zufall, der in Bornheide bis heute gern erzählt wird.

  ## Orgelmusik und ihre Geschichte

  Die Literatur für die Orgel ist so vielfältig wie das Instrument selbst. Schon im Mittelalter begleitete sie Gesänge in Klöstern, später entstanden Choralbearbeitungen, Präludien und Fugen, die den Reichtum der Register ausschöpfen. Besonders im Barock erlebte die Orgelmusik eine Blüte, als Komponisten in Norddeutschland und Mitteldeutschland Werke schrieben, die bis heute den Kern des Repertoires bilden. Viele von ihnen waren zugleich Organisten an großen Stadtkirchen und kannten ihr Instrument bis in die letzte Pfeife.

  Im neunzehnten Jahrhundert wandelte sich der Klangcharakter. Die Orgel sollte nun wie ein ganzes Orchester wirken, mit weichen, verschmelzenden Stimmen und dem Schweller, einer verstellbaren Jalousie, die die Lautstärke stufenlos regelt. Im zwanzigsten Jahrhundert besann man sich wieder auf die klaren, durchsichtigen Klänge älterer Instrumente. Heute stehen beide Ideale nebeneinander, und viele Organisten pflegen romantische wie barocke Werke gleichermaßen.

  In der Stadt Lindenau veranstaltet die Kirchengemeinde St. Severin jeden Sommer eine Konzertreihe, bei der Gäste aus dem In- und Ausland die dortige Orgel spielen. Die Stücke reichen von alten Meistern bis zu Improvisationen über Volkslieder. Auch Kinder dürfen an offenen Nachmittagen die Tasten drücken und erfahren dabei, wie aus einem Lufthauch Musik wird. Wer improvisiert, muss nicht nur Harmonie beherrschen, sondern auch die Register so wählen, dass Melodie und Begleitung klar voneinander getrennt bleiben.

  ## Pflege und Restaurierung

  Eine Orgel ist ein empfindliches Instrument, das regelmäßige Pflege braucht. Temperatur und Luftfeuchtigkeit wirken auf Holz und Leder ebenso wie auf das Metall der Pfeifen. Trockene Heizungsluft im Winter lässt Windladen reißen, Feuchtigkeit im Sommer fördert Schimmel und Holzwürmer. Mindestens einmal im Jahr stimmt ein Orgelbauer das Instrument, wobei vor allem die Zungenpfeifen nachgestellt werden müssen, da sie auf Temperaturschwankungen empfindlich reagieren. Staub, der sich über Jahrzehnte in den Pfeifen sammelt, wird bei größeren Reinigungen Stück für Stück entfernt.

  Wenn ein Instrument nach hundert oder mehr Jahren nicht mehr zuverlässig arbeitet, steht eine Restaurierung an. Dabei stellt sich stets die Frage, wie viel vom Original erhalten bleiben soll. Denkmalpfleger bestehen darauf, möglichst viel historische Substanz zu bewahren, auch wenn der Spielkomfort darunter leidet. Orgelbauer hingegen wünschen sich oft Eingriffe, die das Instrument zuverlässiger machen. In der Regel einigt man sich auf einen Mittelweg: Die Pfeifen und die mechanische Anlage werden behutsam repariert, nur stark verschlissene Teile wie Lederbälge oder Ventildichtungen werden ersetzt.

  Eine solche Arbeit kostet viel Geld und Zeit, weshalb sich vielerorts Fördervereine bilden, die Spenden sammeln. Am Rand einer Benefizveranstaltung für die Orgel in Lindenau erschien einmal der Fußballtrainer eines Nachbarvereins, um zwei Stunden lang Geld für den neuen Balg zu sammeln, was dem Fest einen unerwarteten Besucherstrom bescherte. Nach der Wiedereinweihung bleibt die Pflege Daueraufgabe, denn nur ein regelmäßig gespieltes und gewartetes Instrument hält über Generationen.
