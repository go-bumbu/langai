id: de-weinland-ostrau
lang: de
title: Das Weinland Ostrau
text: |
  Das Weinland Ostrau ist eine Weinregion im Osten eines mitteleuropäischen Binnenlandes, die sich über rund achtzig Kilometer entlang des Flusses Ostra erstreckt. Auf etwa viertausend Hektar Rebfläche wachsen hier überwiegend weiße Sorten, aus denen frische, mineralische Weine mit deutlicher Säure entstehen. Die Landschaft ist geprägt von steilen Hängen, die bis zum Fluss hinabfallen, von Trockenmauern, schmalen Wegen und kleinen Weinorten, in denen die Häuser dicht an dicht gebaut sind. Gut ein Dutzend davon tragen die Bezeichnung Weinort, einen Titel, der nur vergeben wird, wenn Reben die Ortsgrenze auf wenigstens der Hälfte der landwirtschaftlichen Fläche bedecken.

  Der Weinbau ist hier seit vielen Jahrhunderten die wichtigste Erwerbsquelle. Rund zweitausend Betriebe bewirtschaften Weinberge, die meisten davon im Nebenerwerb. Neben wenigen großen Gütern gibt es zahlreiche Familienbetriebe, die ihre Trauben zu einer der Winzergenossenschaften bringen oder selbst keltern und ihre Weine direkt ab Hof verkaufen. Die Region ist bekannt für ihre Rieslinge, Müller-Thurgau und Silvaner, aber auch für Sekt, der in mehreren Kellereien nach traditionellem Verfahren hergestellt wird. Wer das Weinland besucht, begegnet einer lebendigen Kulturlandschaft, in der sich Arbeit, Brauchtum und Genuss auf engem Raum verbinden.

  ## Lage und Landschaft

  Das Weinland Ostrau liegt in einem tief eingeschnittenen Flusstal, das die Ostra vor Jahrtausenden in den Fels gegraben hat. Im Westen beginnt es am Ort Rotenbühl, wo der Fluss aus einer Schlucht tritt, im Osten endet es bei Kelterhausen, wo das Tal sich weitet und in eine flache Ebene mit Ackerbau übergeht. Auf beiden Seiten steigen die Hänge steil an. Die Südhänge, die am meisten Sonne erhalten, sind mit Reben bepflanzt, auf den schattigen Nordseiten wachsen Buchen und Eichen.

  Das Klima ist trocken und mild. Im Sommer werden die Hänge durch die Sonne stark aufgeheizt, und das Gestein speichert die Wärme, um sie in der Nacht wieder abzugeben. Das schafft ein günstiges Kleinklima, in dem Trauben auch in kühleren Jahren reifen. Der Fluss mildert im Winter die Kälte, im Herbst sorgt er für Nebel, der in den frühen Morgenstunden über dem Tal liegt und sich meist bis zum Mittag auflöst. Die jährliche Niederschlagsmenge liegt bei knapp fünfhundert Millimetern, wobei Starkregen im Sommer die Hänge gefährden kann.

  Ein besonderes Phänomen sind die Talwinde. Am Morgen strömt kühle Luft die Hänge hinab und sammelt sich über dem Fluss, am Nachmittag steigt warme Luft an den Südhängen auf. Dieser Luftaustausch hält die Trauben trocken und beugt Pilzkrankheiten vor, weshalb Winzer in der Region seltener spritzen müssen als in windstillen Tälern.

  Die Böden stammen aus unterschiedlichen Gesteinen. Im Westen überwiegen Schiefer und Quarzit, die den Weinen eine feine, salzige Note verleihen. In der Mitte des Tals dominieren Kalkstein und Mergel, im Osten Löss und Lehm. Winzer sprechen oft von der Handschrift des Bodens und behaupten, aus ihrem Wein ließe sich die Lage herausschmecken. Die besten Weinberge tragen eigene Namen, darunter der Rotenbühler Steinberg, die Falkenhorster Sonnenuhr und der Kelterhäuser Teufelsbuckel.

  Auch die Orte selbst unterscheiden sich stark. Rotenbühl, mit rund zweitausend Einwohnern der größte Ort im Westen, liegt eng zwischen Felswänden und besteht fast nur aus einer langen Gasse, an der Weinstuben, Bäckereien und Fachwerkhäuser stehen. Falkenhorst in der Mitte des Tals wird von der gleichnamigen Burg überragt, während Kelterhausen im Osten seit jeher als Handelsplatz diente und deshalb breitere Straßen, einen großen Marktplatz und einen Hafen am Fluss besitzt. Zwischen den Hauptorten liegen kleine Weiler mit nur wenigen Höfen, die oft nur über steile Fahrwege zu erreichen sind.

  ## Geschichte des Weinbaus

  Die ersten Reben im Tal der Ostra sollen von Händlern und Siedlern mitgebracht worden sein, die über die Handelsstraße am Fluss zogen. Funde von Winzermessern und Pressen aus dem frühen Mittelalter deuten darauf hin, dass spätestens im achten Jahrhundert Wein angebaut wurde. Klöster spielten bei der Verbreitung eine besondere Rolle. Das Kloster Sankt Ägidius bei Falkenhorst bekam im Jahr 1124 von einem Grafen Land am Südhang geschenkt und legte dort die ersten großen Weinberge an. Die Mönche führten Buch über Ernten und Verkäufe, sie züchteten Sorten und brachten die Technik der Rebveredlung ins Tal.

  Im Spätmittelalter erlebte das Weinland eine Blütezeit. Der Wein der Ostra wurde bis in die Hansestädte verschifft, und mancher Kaufmann in Kelterhausen kam zu Wohlstand. Reiche Bürger bauten Fachwerkhäuser mit tiefen Gewölbekellern, von denen viele bis heute erhalten sind. Der Graf Eberhard von Kalkstein erließ um 1450 eine Weinordnung, die Lese, Preise und Qualität regelte und das Verfälschen von Wein unter Strafe stellte. Wer erwischt wurde, musste mit hohen Bußen rechnen, und in schweren Fällen wurde sein Fass öffentlich ausgeschüttet.

  Die Weinordnung führte außerdem das Amt des Weinbeschauers ein, eines vereidigten Fachmanns, der vor dem Verkauf jedes Fass prüfte und mit einem Brandzeichen versah. Ein solches Fass durfte nur im Hafen von Kelterhausen verladen werden. Auf diese Weise konnten Käufer in fernen Städten sicher sein, dass sie echten Ostrauer Wein bekamen.

  Der Dreißigjährige Krieg brachte Zerstörung, Seuchen und Hunger. Weinberge verwilderten, Dörfer verödeten, und erst im achtzehnten Jahrhundert erholte sich der Anbau. Im neunzehnten Jahrhundert verbreitete sich die Reblaus aus Amerika, ein winziges Insekt, das die Wurzeln der Reben zerstört. In wenigen Jahren verschwand ein großer Teil der Weinberge. Der Neuaufbau gelang erst, nachdem man gelernt hatte, europäische Edelreiser auf Unterlagen amerikanischer Wildreben zu pfropfen, die gegen den Schädling widerstandsfähig sind. Seitdem wächst fast jede Rebe der Region auf einer solchen Unterlage.

  Das zwanzigste Jahrhundert brachte weitere Veränderungen. Während der beiden Weltkriege fehlte es an Arbeitskräften, viele steile Parzellen wurden aufgegeben. Nach 1950 gründeten Winzer Genossenschaften und setzten auf Menge: Ertragsreiche Sorten wie Müller-Thurgau verdrängten den Silvaner, und der Wein wurde meist süß und billig verkauft. Erst seit den achtziger Jahren kehrte man zur Qualität zurück, die Erträge wurden begrenzt, trockene Weine kamen in Mode, und eine junge Generation von Winzern nahm sich der alten Lagen wieder an.

  Mit der Rückkehr zur Qualität änderte sich auch das Selbstverständnis der Region. Man sprach nun nicht mehr von Massenwein, sondern von Herkunft, und Winzer begannen, ihre besten Lagen mit eigenen Etiketten herauszustellen. Der Verband der Ostrauer Weingüter, 1985 gegründet, legte Regeln für niedrige Erträge und handgelesene Trauben fest, die strenger waren als die gesetzlichen Vorgaben, und verlieh Mitgliedern, die sie einhielten, ein gemeinsames Gütezeichen. Dieser Schritt gilt heute als Wendepunkt in der jüngeren Geschichte der Region.

  ## Rebsorten

  Im Weinland Ostrau wachsen heute rund zwanzig Rebsorten, von denen vier den Großteil der Fläche beanspruchen. Der Riesling, der etwa vierzig Prozent der Rebfläche einnimmt, ist die Hauptsorte. Er reift spät, verträgt Kälte gut und liefert Weine mit ausgeprägter Säure, pfirsichartigen Aromen und einer Mineralität, die je nach Boden anders ausfällt. Er wird trocken, halbtrocken oder süß ausgebaut und ist besonders lagerfähig: Einzelne Weine halten Jahrzehnte.

  Der Müller-Thurgau, eine Kreuzung aus zwei älteren Sorten, reift früh und liefert zuverlässige Erträge. Seine Weine sind mild, leicht und blumig und werden jung getrunken. Der Silvaner, die dritte große Sorte, galt lange als altmodisch, erlebt aber eine Renaissance. Er bringt kräftige, erdige Weine mit wenig Säure hervor, die gut zu Spargel und Fisch passen. Hinzu kommt der Weißburgunder, der in den Kalkböden der Mitte des Tals ein fülliges, nussiges Aroma entwickelt.

  Daneben gibt es Nischensorten, die kaum jemand außerhalb des Tals kennt. Der Ostrauer Gelbling, eine alte, fast verschwundene Weißweinsorte, wird nur auf wenigen Hektar angebaut und ergibt kräftige, würzige Weine mit Aromen von Quitte und Kräutern. Winzer wie Matthias Lorenz in Falkenhorst haben die Sorte durch Stecklinge aus den Gärten alter Bauern gerettet und sorgen dafür, dass sie nicht verloren geht.

  Rote Sorten spielen eine kleinere Rolle. Etwa ein Fünftel der Fläche ist mit Spätburgunder, Dornfelder und Portugieser bestockt. Der Spätburgunder wächst am besten in den wärmsten Lagen um Rotenbühl und ergibt dort elegante Weine mit Kirsch- und Gewürznoten. Neue Züchtungen, die gegen Pilzkrankheiten widerstandsfähig sind, werden von einigen Betrieben erprobt, weil sie weniger Pflanzenschutz erfordern.

  Für die Auswahl einer Sorte spielen heute neben dem Geschmack auch der Wasserbedarf, die Reifezeit und die Widerstandskraft eine Rolle. Das Rebsortenregister der Region führt jede Pflanzung auf, und eine Kommission entscheidet, welche Sorten für Qualitätswein zugelassen sind. Neuzüchtungen müssen mehrere Jahre in Versuchsanlagen bestehen, bevor sie für den Anbau freigegeben werden. Traditionalisten blicken diesen Sorten zwar skeptisch entgegen, doch die ersten Weine sind überzeugend ausgefallen.

  ## Vom Traubenstock zum Wein

  Das Jahr des Winzers beginnt im Winter mit dem Rebschnitt. Dabei wird fast das gesamte Holz des Vorjahres entfernt, sodass nur wenige Triebe stehen bleiben, die im Frühjahr Trauben tragen. Im April schlagen die Knospen aus, und von da an gilt es, die Triebe an Drähten zu befestigen, den Boden zu bearbeiten und die Reben vor Pilzen zu schützen. Im Juli werden überschüssige Trauben abgeschnitten, damit die übrigen mehr Zucker einlagern. Der Herbst ist die arbeitsreichste Zeit: Von Mitte September bis in den November hinein werden die Trauben gelesen.

  Die Pflege der Weinberge ist eine Wissenschaft für sich. Der Winzer muss den Boden lockern, ohne die Wurzeln zu verletzen, Unkraut kontrollieren, ohne die Erde kahl zu hacken, und im richtigen Moment spritzen, wenn Mehltau oder Pilze drohen. Wetterstationen in den Weinbergen melden Temperatur, Feuchtigkeit und Blattnässe an eine Beratungsstelle, die per Kurznachricht warnt, wann Behandlungen sinnvoll sind. Dadurch lässt sich der Einsatz von Pflanzenschutzmitteln deutlich verringern.

  Am Ende der Saison entscheidet der Winzer anhand von Zucker- und Säuremessungen, wann gelesen wird. Er geht mehrmals durch die Reihen, kostet die Beeren und prüft, ob die Kerne braun und die Stiele verholzt sind. Der Zeitpunkt ist selten für alle Lagen gleich, deshalb dauert die Lese oft Wochen, und dieselbe Parzelle wird manchmal in mehreren Durchgängen abgeerntet, um jeweils nur die reifsten Trauben zu holen.

  Wegen der Steilheit ist die Lese im Weinland Ostrau fast überall Handarbeit. Erntehelfer steigen mit Eimern und Tragekörben die Hänge hinauf, schneiden Traube für Traube ab und tragen sie an Sammelstellen, von wo aus sie mit kleinen Seilbahnen oder Raupenfahrzeugen zu Tal gebracht werden. Unmittelbar nach der Lese gelangen die Trauben zur Kelter. Weißweine werden gepresst, noch bevor der Saft Farbe aus den Schalen zieht, Rotweine dagegen lässt man auf den Schalen gären, damit sie Farbstoff und Gerbstoffe aufnehmen.

  Der Most, wie der frische Traubensaft genannt wird, vergärt zu Wein, wenn Hefen den Zucker in Alkohol und Kohlensäure verwandeln. Moderne Betriebe arbeiten mit Edelstahltanks und gekühlter Gärung, die die Frische der Aromen bewahrt, andere nutzen Holzfässer oder sogar Tonamphoren. Danach reift der Wein einige Monate auf der Hefe, wird geklärt und schließlich abgefüllt. Viele Winzer verzichten auf starke Eingriffe und lassen den Wein im Keller möglichst naturbelassen reifen. Das Qualitätssystem der Region teilt Weine nach dem Zuckergehalt der Trauben in Stufen ein, wobei Spätlese, Auslese und die seltene Eiswein-Kategorie den höchsten Reifegrad bezeichnen.

  ## Terrassenbau an den Steillagen

  Das auffälligste Merkmal der Landschaft sind die Terrassen. An vielen Hängen der Ostra beträgt die Neigung mehr als vierzig Grad, sodass ohne künstliche Stufen weder Reben wachsen noch Arbeiter stehen könnten. Seit Jahrhunderten schichten die Winzer deshalb Mauern aus Naturstein auf, hinterfüllen sie mit Erde und gewinnen so schmale Streifen ebenen Bodens. Insgesamt umfasst das Netz der Trockenmauern im Weinland Ostrau mehr als fünfhundert Kilometer, ein Vielfaches der Länge der Eisenbahnstrecke durch das Tal.

  Eine Trockenmauer wird ohne Mörtel errichtet. Der Mauerbauer wählt jeden Stein so aus, dass er mit seinen Nachbarn verzahnt ist, und schlägt ihn mit dem Hammer zurecht, sodass Fugen und Lücken minimal bleiben. Die Mauer neigt sich leicht gegen den Hang, damit der Druck der Erde sie nicht umwirft. Weil das Wasser durch die Fugen abfließen kann, staut sich kein Wasser hinter der Mauer, und ihr Mauerwerk überdauert Jahrhunderte. Zugleich bieten die Fugen Eidechsen, Wildbienen und seltenen Pflanzen Lebensraum, was die Hänge zu einem Schutzgebiet für Arten macht, die sonst kaum noch Platz finden.

  Zu den Bewohnern gehören die Mauereidechse, die Smaragdeidechse und seltene Schmetterlinge wie der Segelfalter. Botaniker haben an einzelnen Mauern über hundert Pflanzenarten gezählt, von Zimbelkraut bis zu Mauerpfeffer. Naturschützer fordern deshalb, den Bau und die Pflege der Mauern als Kulturerbe anzuerkennen, und die Region hat einen Antrag auf Aufnahme in eine Liste immateriellen Erbes gestellt.

  Der Unterhalt ist aufwendig. Frost, Wurzeln und Starkregen setzen den Mauern zu, einzelne Steine fallen heraus und müssen ersetzt werden. Wo eine Mauer einstürzt, bleibt oft nur die Möglichkeit, sie in mühsamer Arbeit neu aufzubauen; ein erfahrener Maurer schafft pro Tag kaum zwei Quadratmeter. Die Kosten sind so hoch, dass sich manche Winzer die Pflege kaum leisten können. Der Verein Steinernes Ostrautal, 1992 von Winzern und Heimatfreunden gegründet, vermittelt deshalb Patenschaften, schult Freiwillige und beantragt Fördermittel für den Mauerbau. In den Wintermonaten finden Kurse statt, in denen Teilnehmer das alte Handwerk erlernen.

  Die Arbeit am Hang ist körperlich schwer. Wo kein Weg hinführt, müssen Pfähle, Drähte und Spritzmittel auf dem Rücken getragen werden, und selbst Traktoren können nur auf wenigen Parzellen fahren. Spezielle Seilzugmaschinen, die an Ankern am oberen Rand befestigt werden, ziehen Geräte den Hang hinauf, doch ihr Einsatz lohnt sich nur bei größeren Flächen. Aus diesem Grund haben viele Winzer die steilsten Parzellen aufgegeben, und es entstehen Brachflächen, auf denen Gebüsch die Mauern überwuchert.

  Neben der Mauerpflege stellt auch die Erosion ein Problem dar. Bei Starkregen spült das Wasser Erde von den Hängen, die an den Fuß der Terrassen gelangt und von dort mühsam wieder hinaufgetragen werden muss. Viele Winzer lassen deshalb zwischen den Rebzeilen Gras und Blumen wachsen, deren Wurzeln den Boden festhalten. Ein Nebeneffekt ist, dass die begrünten Zeilen Insekten Nahrung bieten und die Artenvielfalt steigt. Ein Fußballtrainer, der im Sommer 2005 im Tal ein Trainingslager abhielt, ließ seine Mannschaft die steilen Treppen zwischen den Terrassen hinaufsprinten.

  ## Betriebe und Vermarktung

  Die Struktur der Betriebe ist vielfältig. Rund vierzig größere Weingüter verfügen über mehr als zwanzig Hektar und beschäftigen ganzjährig mehrere Mitarbeiter. Dazu kommen Familienbetriebe mit fünf bis zehn Hektar, die den Großteil ihres Weins in Flaschen selbst vermarkten. Viele Winzer sind auch in Vereinen und Verbänden aktiv, die gemeinsam Werbung machen und Weinproben veranstalten. Die Winzergenossenschaft Ostrautal, 1951 gegründet, vereint rund siebenhundert Mitglieder und verarbeitet mehr als ein Drittel der gesamten Ernte.

  Sie unterhält eine moderne Kelterhalle mit sechs Pressen, ein Tanklager für mehr als zwei Millionen Liter und eine Abfüllanlage, die auch Lohnabfüllung für kleinere Betriebe anbietet. Die Mitglieder bekommen ihren Traubenpreis nach Qualität bezahlt, wobei besonders gute Lagen Zuschläge erhalten. Einen Teil der Weine verkauft die Genossenschaft unter eigener Marke in Supermärkten, einen anderen als Lagenweine an Fachhändler.

  Der Absatz verläuft über mehrere Wege. Ein großer Teil des Weins wird an Gaststätten und Fachhändler geliefert, ein weiterer über Supermärkte und Discounter vertrieben. Den größten Gewinn erzielen jedoch Winzer, die direkt an Endkunden verkaufen, in Probierstuben, bei Hoffesten oder über das Internet. Manche Betriebe haben einen Stammkundenkreis, der ihnen jedes Jahr einige Kartons Wein abnimmt. Exportiert wird vor allem in die Nachbarländer und nach Übersee, wo trockene Rieslinge aus der Ostra als Spezialität gelten.

  Das Weinland steht allerdings vor Nachwuchssorgen. Viele Betriebsinhaber sind älter als fünfzig, und die Söhne und Töchter ziehen oft in die Stadt. Wer einen Hof übernimmt, muss mit hohen Arbeitskosten und niedrigen Preisen rechnen, weil Weine aus großen, ebenen Regionen oft billiger zu haben sind. Die Fachschule für Weinbau in Kelterhausen bildet jedes Jahr rund sechzig junge Menschen aus und vermittelt neben Kellertechnik auch Marketing und Betriebswirtschaft.

  ## Sektherstellung

  Neben Stillwein ist Sekt ein wichtiges Standbein der Region. Die Tradition geht auf das neunzehnte Jahrhundert zurück, als der Kaufmann Julius Brandner in Kelterhausen die erste Sektkellerei gründete. Er hatte auf Reisen Schaumwein kennengelernt und wollte ihn mit einheimischen Trauben nachmachen. Die Geschichte erzählt, dass er mit dem ersten Jahrgang fast sein gesamtes Vermögen verlor, weil zahlreiche Flaschen platzten. Heute stellt die Sektkellerei Brandner jährlich rund eine halbe Million Flaschen her und gilt als wichtigstes Haus der Region.

  Neben dem Haus Brandner arbeiten kleinere Winzersekt-Erzeuger, die ihre Schaumweine ausschließlich aus eigenen Trauben herstellen. Sie nennen ihre Erzeugnisse Winzersekt und verweisen damit auf die Herkunft aus einem einzigen Betrieb. Viele dieser Sekte werden nur in kleinen Mengen produziert und sind schnell vergriffen.

  Der beste Sekt entsteht nach dem traditionellen Verfahren, auch Flaschengärung genannt. Dabei wird zunächst ein trockener Grundwein aus früh gelesenen Trauben mit hoher Säure erzeugt. Dieser Wein wird mit einer Mischung aus Zucker und Hefe, der Tirage, in die Flasche gefüllt und mit einem Kronkorken verschlossen. In der Flasche beginnt eine zweite Gärung, bei der Kohlensäure entsteht, die sich im Wein löst. Danach lagern die Flaschen mindestens neun Monate, oft aber mehrere Jahre, auf der Hefe, wodurch der Sekt Aromen von Brioche, Nüssen und Hefegebäck gewinnt.

  Anschließend müssen die Hefereste entfernt werden. Dazu werden die Flaschen mit dem Hals nach unten in Rüttelpulte gesteckt und täglich ein Stück gedreht, bis sich der Satz im Flaschenhals sammelt. Der Hals wird in einem Kältebad eingefroren, der Kronkorken geöffnet und der Eispfropfen mit der Hefe vom Druck herausgeschleudert. Zuletzt füllt man die Flasche mit der Dosage auf, einer Mischung aus Wein und Zucker, die den Geschmack bestimmt: Je weniger Zucker, desto herber der Sekt. Das Rütteln erfolgt heute teils maschinell, aber manche Häuser setzen weiterhin auf Handarbeit und beschäftigen Rüttler, die an einem Tag mehrere tausend Flaschen drehen.

  Neben dem klassischen Verfahren gibt es das Tankgärverfahren, bei dem die zweite Gärung in großen Drucktanks stattfindet. Es ist billiger und schneller und liefert frischere, fruchtigere Sekte, die in der Regel jung getrunken werden. In der Region entstehen sowohl Weißsekte aus Riesling und Weißburgunder als auch Roséschaumweine aus Spätburgunder. Der Jahrgangssekt ist das Prestigeprodukt, das bei Feiern, Empfängen und Festessen ausgeschenkt wird.

  Beim Servieren kommt es auf die richtige Temperatur an: Sekt sollte kalt, aber nicht eiskalt getrunken werden, bei etwa acht bis zehn Grad, damit die feinen Aromen zur Geltung kommen. Als Gläser empfehlen Kenner eher schlanke Weißweingläser als die klassische flache Schale, weil sich darin die Perlen länger halten und der Duft besser entfalten kann. Die Kellerei Brandner führt ihre Gäste an einem Samstag im Monat durch die unterirdischen Gänge, in denen auf drei Ebenen mehrere hunderttausend Flaschen lagern.

  ## Küche des Weinlandes

  Zu einem guten Wein gehört ein gutes Essen, und im Weinland Ostrau hat sich eine eigene Küche entwickelt, die auf die Weine abgestimmt ist. Die Grundlage bilden bodenständige Zutaten: Kartoffeln, Zwiebeln, Speck, Flussfisch, Wild und Kohl. Typisch ist der Winzerbraten, ein in Riesling und Zwiebeln geschmortes Stück Schweinenacken, das mit Kartoffelklößen serviert wird. Dazu passt ein trockener Silvaner, der die Fülle des Bratens auffängt. Auch der Zander aus der Ostra, in Butter gebraten und mit Rieslingsoße übergossen, gehört zu den Klassikern.

  Im Herbst steht der Zwiebelkuchen im Mittelpunkt, ein herzhafter Hefekuchen mit Zwiebeln, Speck und Kümmel, der zusammen mit dem Federweißen gegessen wird. Federweißer ist der noch gärende Most, ein trübes, süßes, leicht prickelndes Getränk, das nur wenige Wochen im Jahr zu haben ist und deshalb so beliebt ist. Wegen seines Alkoholgehalts, der durch die Gärung ständig steigt, wird er gern unterschätzt. Im Winter kommen deftige Eintöpfe auf den Tisch, im Frühling Spargel mit Schinken und neuen Kartoffeln, im Sommer leichte Salate und Forellen vom Grill.

  Käse und Brot spielen ebenfalls eine große Rolle. Der Ostrauer Bergkäse, ein halbfester Schnittkäse aus Kuhmilch, wird von einer kleinen Käserei oberhalb von Rotenbühl hergestellt und reift in kühlen Kellern. Er passt zu Weißburgunder und Rotwein. Als Süßspeise gelten Dampfnudeln mit Weinschaum und Zwetschgenkuchen, den Hausfrauen im Spätsommer backen.

  Die Kunst besteht darin, Speise und Wein aufeinander abzustimmen. Zu fettem Fleisch gehört ein säurebetonter Wein, der den Gaumen frisch hält, zu Fisch ein leichter, mineralischer Weißwein, zu würzigem Käse ein lieblicher Riesling, dessen Süße der Schärfe das Gleichgewicht hält. Viele Köche kochen mit dem Wein, den sie auch ins Glas einschenken, und verwenden ihn für Soßen, Beizen und Fonds. Einige Gasthäuser führen eine eigene Weinkarte, auf der neben den Weinen der Region auch Weine von Nachbarn stehen. Viele Gaststätten bieten saisonale Menüs an, bei denen jeder Gang mit einem passenden Wein serviert wird. In der Straußwirtschaft, einer Besenwirtschaft, schenken Winzer ihren eigenen Wein in der Hofeinfahrt oder in der Scheune aus und reichen einfache Speisen dazu, wobei ein Strohbesen oder ein Kranz über der Tür zeigt, dass geöffnet ist.

  Ein Filmteam drehte im Herbst 1989 mehrere Szenen eines Heimatfilms in einer Besenwirtschaft in Falkenhorst, und seitdem bewirbt der Wirt sein Haus mit einem gerahmten Standfoto. Mit der Gegenwart hat sich die Küche verändert: Junge Köche verbinden die traditionellen Gerichte mit Gemüse aus der Region, verarbeiten Kräuter von den Terrassen und stellen vegetarische Menüs zusammen, die weniger schwer sind als die früheren Winzergerichte. Einige Restaurants sind inzwischen über die Region hinaus bekannt.

  ## Weinfeste und Tourismus

  Der Wein prägt auch das Jahr der Dörfer. Von April bis Oktober findet fast jedes Wochenende irgendwo im Tal ein Weinfest statt. Den Auftakt macht im Frühjahr die Weinwanderung zwischen Rotenbühl und Falkenhorst, bei der Gäste auf einem markierten Weg an Probierständen Halt machen. Im Sommer folgen Hoffeste mit Livemusik, im Herbst das Fest der neuen Weine, bei dem die Weinkönigin gekrönt wird. Die Weinkönigin, die für ein Jahr gewählt wird, vertritt die Region auf Messen, eröffnet Veranstaltungen und gibt Interviews. Wer sie werden will, muss Weinkenntnis nachweisen und aus einem Winzerhaushalt stammen.

  Besonders beliebt ist das Fest des Federweißen in Kelterhausen, bei dem auf dem Marktplatz lange Tische aufgestellt werden und mehrere Kapellen spielen. Am letzten Septemberwochenende zieht außerdem ein Festumzug mit geschmückten Wagen durch den Ort, auf denen Winzer ihre Berufsgeschichte darstellen. Kinder verkleiden sich als Trauben, und am Abend leuchtet ein Feuerwerk über dem Fluss.

  Der Tourismus ist für die Region zu einer zweiten wichtigen Einkommensquelle geworden. Jährlich besuchen rund eine halbe Million Gäste das Tal, davon viele Wanderer, Radfahrer und Schiffsreisende. Entlang der Ostra führt ein Radweg, der auf alten Treidelpfaden verläuft und die Orte Rotenbühl und Kelterhausen verbindet. Flusskreuzfahrtschiffe legen in Falkenhorst an, und im Sommer fährt die Weinbahn, eine Schmalspurbahn mit historischen Wagen, mehrmals täglich durch das Tal. Auf der Burg Falkenhorst, die im zwölften Jahrhundert über dem Fluss errichtet wurde, befindet sich ein Weinmuseum, das die Geschichte des Weinbaus vom Mittelalter bis heute erzählt.

  Im Museum zeigen Presskeller, Fässer, Werkzeuge und Fotografien, wie sich die Arbeit der Winzer über die Jahrhunderte verändert hat. In einem Raum steht eine mächtige Baumkelter aus dem sechzehnten Jahrhundert, bei der ein Pressbalken von mehr als zehn Metern Länge mit Steinen beschwert wurde. Kinder können an einer Station Trauben mit den Füßen treten, und im Garten wachsen alte Sorten, die im Tal nicht mehr angebaut werden.

  Zahlreiche Winzer haben ihre Betriebe für Besucher geöffnet. Sie bieten Kellerführungen, Weinproben und Übernachtungen im Gästezimmer an, manche auch Kochkurse oder Seminare zum Thema Wein. Tagesausflügler lassen sich in einer Vinothek beraten und nehmen sich einige Flaschen mit, Gruppen buchen Weinseminare, in denen sie lernen, wie man Aromen erkennt und beschreibt. Wegen des Andrangs kommt es an Wochenenden im Herbst in manchen Dörfern zu Verkehrsproblemen, weshalb Gemeinden Parkplätze am Ortsrand und Shuttlebusse eingerichtet haben.

  Der Tourismus bringt aber auch Konflikte. Bewohner klagen über Lärm, steigende Mieten und die Verdrängung kleiner Läden durch Souvenirgeschäfte. Winzer stört es, wenn Gäste durch die Reben laufen und Trauben essen, während Gastwirte beklagen, dass der Winzer mit seiner Straußwirtschaft Konkurrenz macht. Die Gemeinden suchen deshalb nach Wegen, den Besucherstrom zu lenken und den Charakter der Dörfer zu erhalten. Ein Beispiel ist die Aktion Stille Wochen im Februar und März, in der Betriebe und Gasthöfe bewusst Ruhe einkehren lassen und Einheimische ihre Orte für sich haben.

  ## Klimawandel und Zukunft

  Der Klimawandel ist für das Weinland Ostrau zugleich Chance und Gefahr. Seit den fünfziger Jahren ist die mittlere Temperatur in der Vegetationszeit um mehr als anderthalb Grad gestiegen. Die Trauben reifen früher, die Lese beginnt oft schon im August, und der Zuckergehalt ist höher als früher. Für Rotweine bedeutet das bessere Reife, für die Weißweine allerdings weniger Säure und mehr Alkohol, wodurch der typische frische Charakter verloren zu gehen droht. Winzer reagieren, indem sie später lesen, Laub zum Schutz der Trauben stehen lassen und auf höher gelegene, kühlere Lagen ausweichen.

  Die Gemeinden planen deshalb, aufgelassene Hänge in höheren Lagen, die früher als zu kalt galten, wieder zu bepflanzen. Das Weinbauinstitut hat eine Karte erstellt, die zeigt, welche Flächen in dreißig Jahren geeignet sein könnten. Dabei kollidiert der Wunsch nach neuen Weinbergen mit dem Naturschutz, denn manche dieser Hänge sind inzwischen von seltenen Pflanzen und Vögeln besiedelt.

  Gleichzeitig nehmen extreme Wetterereignisse zu. Frühe Frühjahrsfröste vernichten die jungen Triebe, Hagelschläge zerstören ganze Ernten, und lange Trockenphasen setzen den Reben auf den flachgründigen Böden zu. Im Sommer 2018 vertrockneten in den Südlagen von Rotenbühl ganze Rebzeilen, weil über Wochen kein Regen gefallen war. Seitdem experimentieren mehrere Betriebe mit Tropfbewässerung, die in der Region bislang kaum üblich war, oder mit schattenspendenden Netzen.

  Auch Schädlinge breiten sich aus. Die Kirschessigfliege, die früher nur im Süden vorkam, befällt inzwischen reife Beeren und macht ganze Ernten ungenießbar. Neue Krankheiten wie die Esca, die Holzteile der Reben absterben lässt, treten häufiger auf. Winzer reagieren mit engmaschigen Netzen, früherer Lese und sorgfältigem Auslesen der Trauben. Die Wasserversorgung für diese Systeme ist jedoch begrenzt, und sie verändern das traditionelle Landschaftsbild.

  Neue Sorten und Anbaumethoden sollen helfen. Forscher am Weinbauinstitut Kelterhausen prüfen in Versuchsweinbergen, welche Sorten mit Hitze und Trockenheit besser zurechtkommen. Dazu gehören Reben aus südlicheren Gegenden, aber auch alte, fast vergessene Sorten aus der Region.

  Erste Ergebnisse zeigen, dass späte Sorten mit dicken Schalen und tiefen Wurzeln besser mit Hitze zurechtkommen als frühreife Sorten. Die Forscher untersuchen außerdem, wie sich verschiedene Unterlagen und Erziehungsformen auf den Wasserhaushalt auswirken. Die Ergebnisse stellt das Institut bei jährlichen Tagungen vor, zu denen Winzer aus dem ganzen Tal eingeladen werden. Ein weiterer Ansatz ist der ökologische Anbau, der auf Kunstdünger und chemische Pflanzenschutzmittel verzichtet. Rund ein Viertel der Rebfläche ist inzwischen zertifiziert, und etliche Betriebe arbeiten nach biodynamischen Grundsätzen.

  Wirtschaftlich ist der Umstieg nicht einfach, denn die Erträge sinken in den ersten Jahren, und der Aufwand an Handarbeit steigt. Doch viele Kunden sind bereit, für ökologische Weine mehr zu bezahlen, und die Preise gleichen die Verluste meist aus. Auf der Sternwarte von Rotenbühl, die neben den Weinbergen steht, beobachten Amateurastronomen den Himmel, von dem Winzer behaupten, er sei im Tal dunkler als anderswo.

  Wie sich das Weinland entwickelt, hängt auch von Menschen ab. Wenn es gelingt, junge Winzer für die Steillagen zu begeistern, Weinbau und Naturschutz zu verbinden und den Tourismus verträglich zu gestalten, hat die Region gute Aussichten. Ohne diese Voraussetzungen droht den steilsten Terrassen die Aufgabe, verbunden mit dem Verlust der Kulturlandschaft, die das Weinland Ostrau bis heute ausmacht.
