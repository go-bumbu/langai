id: es-puerto-alameda
lang: es
title: "Puerto Alameda"
text: |
  Puerto Alameda es una ciudad portuaria situada en la costa atlántica de un país de habla hispana. Con unos trescientos veinte mil habitantes en su área urbana, es la segunda ciudad de la región de Marisma Alta y el principal puerto pesquero y de carga de todo el litoral norte. Se extiende a lo largo de una bahía amplia y abrigada, cerrada por el cabo de las Gaviotas al oeste y por la punta del Fraile al este, y su casco antiguo trepa por la ladera de un cerro hasta las murallas del castillo de San Telmo.

  La ciudad vive del mar desde su fundación. Su economía reúne la actividad de la flota pesquera, el puerto comercial, los astilleros y las industrias derivadas, y su vida cultural conserva rasgos marineros que se perciben en el habla, en la gastronomía y en las fiestas. A lo largo de los últimos treinta años, Puerto Alameda ha ido transformando sus muelles viejos en paseos y espacios públicos, ha restaurado parte de su patrimonio industrial y ha atraído un turismo que convive no sin tensiones con la actividad portuaria.

  ## Geografía y clima

  La bahía de Alameda tiene forma de herradura y mide unos once kilómetros de boca a fondo. Su costa norte es acantilada, con roquedos de arenisca rojiza que caen a pico sobre el mar, mientras que la costa sur es baja y arenosa, y en ella se extienden las playas del Sablón y de la Concha. El río Almenara desemboca en el fondo de la bahía formando una ría estrecha, cuyas orillas fueron ocupadas durante siglos por salinas y marismas, y hoy en parte por zonas industriales. Una barra de arena, el Bajo de los Cuervos, se interpone en la entrada del puerto y exige a los barcos grandes seguir un canal dragado de continuo.

  El clima es oceánico templado, con veranos suaves, inviernos moderados y lluvias abundantes en otoño y primavera. La temperatura media anual ronda los catorce grados. Los vientos dominantes del noroeste traen frecuentes nieblas matinales y, en el invierno, temporales que levantan olas de varios metros sobre los espigones. El más recordado, el de diciembre de 1953, arrasó el antiguo muelle de madera y causó decenas de víctimas, y desde entonces se han reforzado los diques con bloques de hormigón de varias toneladas.

  La ciudad se organiza en cuatro zonas diferenciadas. El Casco Viejo ocupa el cerro y conserva calles empinadas y estrechas, plazas pequeñas y casas de balcones de hierro. El Ensanche, trazado a finales del siglo XIX, extiende una cuadrícula regular de avenidas arboladas y edificios de ladrillo y piedra hasta la ría. En el frente marítimo se alinean los antiguos almacenes, hoy convertidos en museos, restaurantes y oficinas, y más al sur crecen barrios obreros y urbanizaciones modernas que terminan en un polígono logístico junto a la autovía.

  La ría del Almenara merece una mención aparte por su valor ecológico. Sus marismas, en parte protegidas desde 1994 como reserva natural, son parada obligada de aves migratorias que cruzan el continente cada otoño y cada primavera. En ellas invernan miles de ánades, garzas y limícolas, y los observadores de aves acuden a los observatorios construidos sobre pasarelas de madera. Durante décadas, los vertidos industriales y las aguas residuales deterioraron el estuario, pero las depuradoras instaladas en los años noventa han mejorado la calidad del agua, y han regresado los peces y los moluscos que habían desaparecido.

  Los fenómenos del mar condicionan la vida cotidiana. Las mareas vivas de septiembre inundan a veces el paseo de la ría, y los vecinos de las calles bajas conocen bien el sonido de la sirena que avisa de la crecida. El Observatorio Meteorológico, fundado en 1872 en lo alto del cerro, mantiene una de las series de datos más largas del litoral, y sus registros muestran un aumento del nivel del mar de varios centímetros en el último siglo. Un plan de adaptación aprobado en 2020 prevé elevar los paseos, ampliar las zonas verdes inundables y rediseñar el drenaje del Ensanche.

  ## Historia

  Los primeros asentamientos conocidos en la bahía datan de la Edad del Hierro, cuando un pueblo de pescadores y recolectores de marisco levantó un poblado fortificado en el cerro, del que quedan restos de muros en el jardín del castillo. Los romanos aprovecharon el abrigo natural para instalar una factoría de salazón de pescado, y de aquella época se conservan los depósitos de piedra excavados junto a la playa del Sablón. Tras la caída del imperio, la zona quedó casi despoblada, y la bahía fue refugio ocasional de piratas y de naves de paso.

  La ciudad actual nace en 1243, cuando el rey Fernando de Marisma concedió una carta de población a un grupo de colonos y pescadores que se habían asentado al pie del cerro, con el fin de asegurar la defensa de la costa. El documento les otorgaba libertad de comercio, el derecho de elegir sus alcaldes y la exención de ciertos impuestos a cambio de mantener una milicia marinera. Se llamó Puerto de la Alameda por el paseo de álamos plantados a la orilla del río, que sirvió durante siglos de lugar de reunión. La villa se amuralló en el siglo XIV y se convirtió en un nudo de comercio de lana, hierro y pescado salado hacia los puertos del norte de Europa.

  El siglo XVI trajo prosperidad y también amenaza. La ciudad se enriqueció con el tráfico de ultramar y con la construcción de navíos, y su flota participó en expediciones al continente americano. En 1588 sufrió el ataque de una escuadra inglesa que incendió el barrio del puerto, y la reconstrucción dio lugar a la actual iglesia de Santa María de la Mar, de estilo renacentista. El siglo siguiente fue de decadencia: las epidemias, la competencia de otros puertos y el cegamiento de la barra redujeron el tráfico y la población.

  En el siglo XVII la ciudad conoció también un episodio singular. Las autoridades, preocupadas por la decadencia, encargaron un informe sobre las causas de la ruina del comercio, y el cronista Baltasar de Quintana lo redactó con una franqueza que le valió el destierro. En sus páginas describía el abandono de las murallas, la obstrucción del canal y la codicia de los arrendadores de impuestos, y proponía medidas que no se aplicaron hasta un siglo más tarde. El manuscrito, hallado en el archivo municipal a finales del siglo XIX, es hoy una de las fuentes más citadas por los historiadores locales.

  La recuperación llegó en el siglo XVIII, cuando un plan de obras dirigido por el ingeniero Martín de Olazábal amplió el muelle, abrió el canal de entrada y levantó los almacenes del Arsenal. En el siglo XIX la llegada del ferrocarril y de la máquina de vapor transformó la ciudad. Se fundaron fábricas de conservas, se instalaron los primeros astilleros de hierro y la población se triplicó. En 1893, con ocasión de un famoso torneo, la ciudad acogió a varios de los mejores jugadores de ajedrez del continente, entre ellos un gran maestro, Ignacio Terrazas, que ganó la final en el Casino de Marinos.

  El siglo XX estuvo marcado por conflictos y por cambios. La Guerra Civil dañó el puerto y dividió a la ciudad, y la posguerra fue dura, con racionamiento y emigración. A partir de los años sesenta, el desarrollo industrial impulsó un nuevo crecimiento. La crisis de los astilleros y la reconversión de los ochenta destruyeron miles de empleos, y la ciudad buscó entonces nuevos motores en los servicios, la logística y la cultura. En 1999 se inauguró el Museo Marítimo, y en 2007 se completó el puerto exterior.

  Durante la segunda mitad del siglo XX, la ciudad vivió grandes transformaciones urbanas. Se derribaron las murallas que aún quedaban en el lado de tierra, se cubrió un tramo del río para construir una avenida y se levantaron bloques de viviendas en los antiguos huertos de las afueras. Muchas de estas obras fueron criticadas después, y desde los años noventa predomina la rehabilitación. El plan especial del Casco Viejo, aprobado en 1996, protege más de seiscientos edificios y ha detenido la degradación de las calles del cerro.

  ## Población y sociedad

  Puerto Alameda tiene alrededor de ciento noventa mil habitantes en el municipio y unos trescientos veinte mil en el área metropolitana, que incluye los municipios de Cabo Norte, Riomar y San Telmo del Monte. La ciudad creció con la inmigración de las aldeas del interior durante el siglo XX, y en las últimas décadas ha recibido nuevos residentes de otros países hispanohablantes y de África. La edad media es algo superior a la nacional, y la natalidad es baja.

  Los barrios se identifican con sus parroquias, sus mercados y sus bares. En San Roque, de población obrera, abundan los comercios pequeños y las asociaciones de vecinos; el Ensanche concentra las oficinas y los comercios de mayor lujo, y la Concha, junto a las playas, mezcla viviendas de veraneo con las casas de pescadores originales. La convivencia entre los vecinos de siempre y los recién llegados es un tema habitual en la prensa local, y existen programas municipales de mediación y de apoyo a la integración.

  La sociedad portuaria ha dejado un fuerte sentido de comunidad. Persisten las cofradías de pescadores, instituciones medievales que agrupan a los patrones y a los armadores de cada barrio y que siguen regulando el acceso a los caladeros. Los clubes deportivos, entre ellos el Marinos de Alameda, fundado en 1912, y el club de remo de la Concha, ocupan un lugar importante en la identidad local. La universidad, creada en 1972, cuenta con unos doce mil estudiantes y facultades de ciencias del mar, ingeniería naval y turismo.

  En la religión predomina la tradición católica, con numerosas hermandades que sacan a la calle sus imágenes en Semana Santa, y la patrona de los marineros, la Virgen del Carmen, recibe cada julio una procesión marítima en la que decenas de barcos escoltan su imagen por la bahía. La ciudad mantiene también una pequeña comunidad judía, cuyo cementerio del siglo XV se conserva en la ladera norte, y varias mezquitas modernas en el barrio de San Roque.

  ## Pesca y conserveras

  La pesca es la actividad más antigua de la ciudad y todavía hoy da empleo directo a unas cuatro mil personas. La flota de Puerto Alameda cuenta con cerca de trescientas embarcaciones, desde pequeñas barcas de bajura hasta arrastreros de altura que faenan semanas enteras en caladeros lejanos. Las capturas principales son la sardina, el bocarte, la merluza, el rape y el besugo, además del atún, que llega en primavera, y de crustáceos como la centolla y la nécora. El pescado fresco se vende cada madrugada en la lonja, una nave de hormigón de 1964 donde los compradores pujan a la baja mediante un sistema electrónico y se fijan los precios del día.

  La actividad pesquera ha afrontado crisis recurrentes. El agotamiento de algunos bancos, la imposición de cuotas y la competencia de las capturas importadas han reducido la flota a la mitad desde 1980, y buena parte de los pescadores actuales son hijos y nietos de marineros que ya no desean seguir el oficio. La cofradía de San Telmo ha apostado por la pesca selectiva, con anzuelos y artes de trampa en vez de redes de arrastre, y ha creado una marca de calidad para el pescado de bajura. Un programa de veda temporal protege la reproducción de la merluza durante dos meses al año.

  La industria de la conserva nació en el siglo XIX, cuando fabricantes de origen francés e italiano se instalaron en la ría para aprovechar las grandes capturas de sardina. Las primeras fábricas empleaban sobre todo a mujeres, las llamadas fileteras, que limpiaban y empacaban el pescado a mano con una rapidez asombrosa. En su momento de mayor esplendor, hacia 1925, funcionaban en Puerto Alameda más de setenta conserveras, y la ciudad era conocida por la calidad de sus latas de bonito en aceite de oliva y de sardinillas en escabeche. El ruido de las sirenas que marcaban los turnos formaba parte de la vida cotidiana.

  Hoy quedan menos de veinte fábricas, pero las que sobreviven se han especializado en productos gourmet, de gran valor, y exportan a medio centenar de países. La conservera La Pescadora, fundada en 1898 por la familia Echeverría, mantiene el proceso artesanal y recibe visitas escolares. Las latas históricas, con etiquetas ilustradas de colores vivos, se han convertido en objeto de coleccionismo. El museo de la Conserva, instalado en una antigua fábrica del barrio de la Ría, reconstruye con maquinaria original la jornada de las fileteras y recoge sus testimonios.

  La pesca artesanal conserva rasgos propios. Las mariscadoras, mujeres que recogen berberechos, almejas y percebes en las rocas de la costa con permisos individuales y turnos fijados por la cofradía, forman un colectivo organizado desde 1980, cuando lograron el reconocimiento de su trabajo como profesión. Faenan con las mareas, a veces de madrugada, y el producto llega a la lonja con una trazabilidad estricta. Las redeiras, mujeres que reparan y tejen las redes, trabajan en los muelles con una destreza que ha pasado de madres a hijas y que hoy se enseña también en cursos municipales.

  El día de la lonja empieza antes del amanecer. Los barcos descargan el pescado en cajas de plástico con hielo, los técnicos lo clasifican por especie, talla y frescura, y las subastas se suceden entre las cuatro y las ocho de la mañana. De allí salen camiones frigoríficos hacia los mercados del interior. Un pequeño laboratorio comprueba la frescura y verifica que las capturas respetan las tallas mínimas, y los inspectores de la cofradía visitan las embarcaciones antes de cada salida.

  La actividad pesquera depende también de una red de servicios auxiliares. En los muelles trabajan talleres de reparación de motores, fábricas de hielo, almacenes de aparejos, proveedores de combustible y empresas de transporte frigorífico. Una escuela de formación marítima, la Escuela Náutico-Pesquera, prepara a patrones, mecánicos y marineros con titulaciones oficiales, y sus alumnos hacen prácticas en un barco-escuela amarrado frente a la lonja. La cooperativa de armadores ofrece además seguros colectivos y gestiona un fondo de ayuda para las familias de los tripulantes accidentados.

  ## El puerto comercial y el astillero

  El puerto de Puerto Alameda es uno de los diez mayores del país por tráfico de mercancías. Con un movimiento anual de unos treinta millones de toneladas, se divide en dos grandes áreas: el puerto interior, junto a la ciudad, que mantiene los muelles de pesca, los pasajeros y el tráfico de cabotaje, y el puerto exterior, inaugurado en 2007 en el cabo de las Gaviotas, preparado para buques de gran calado. Sus terminales especializadas manejan contenedores, graneles sólidos como cereales y carbón, graneles líquidos y automóviles.

  La Autoridad Portuaria, un organismo público, gestiona el dominio y concede los terrenos a empresas privadas de estiba, de transporte y de logística. La conexión por ferrocarril con el interior, mejorada en 2015, permite el transporte directo de contenedores hasta los centros industriales de la meseta, y un puerto seco ha descongestionado el acceso por carretera. La actividad portuaria genera, de forma directa e indirecta, cerca de doce mil empleos.

  El astillero es la otra gran industria marítima de la ciudad. Los Astilleros de Alameda, creados en 1889 por una sociedad de armadores, construyeron durante décadas buques de carga, transatlánticos y barcos de guerra, y llegaron a emplear a ocho mil trabajadores. Sus gradas, diques y grúas gigantes dominan el paisaje de la ría. Tras la reconversión de los años ochenta, la empresa se redujo a una fracción de su tamaño y hoy se especializa en reparaciones, en buques especiales como barcos científicos y de investigación y en plataformas auxiliares para la industria eólica marina.

  En el astillero trabajan ingenieros navales formados en la universidad local, soldadores, calderistas, electricistas y carpinteros de ribera. Aunque la construcción de barcos de madera desapareció casi por completo, un pequeño taller de la Concha mantiene viva la técnica, y reconstruyó en 2012 un falucho del siglo XIX, la Santa Marta, que hoy navega en las fiestas. Las varadas de barcos son un espectáculo que atrae a curiosos, y las botaduras de buques nuevos siguen siendo ocasión de celebración popular, con bendición, rotura de botella y música de banda.

  El puerto exterior merece atención por su dimensión técnica. Sus muelles de hormigón armado, de dos kilómetros de longitud, se construyeron sobre cajones prefabricados fondeados en el fondo marino, y las grúas pórtico alcanzan a manejar contenedores de las mayores dimensiones. La profundidad de dieciséis metros permite el atraque de buques portacontenedores de gran porte, y un dragado anual evita la acumulación de sedimentos. Para reducir las emisiones, los barcos atracados pueden conectarse a la red eléctrica del muelle y apagar sus motores auxiliares.

  El puerto también recibe cruceros, cerca de ochenta escalas al año, que traen a miles de turistas durante unas horas. La ciudad ha creado itinerarios por el Casco Viejo y la lonja para ellos, aunque algunos vecinos denuncian los atascos y el ruido que provocan. Un puerto deportivo con setecientos amarres, en el fondo de la bahía, completa la oferta náutica, y la escuela de vela de la Concha forma a cientos de niños cada verano.

  Los astilleros también cultivan una memoria obrera muy viva. Cada primero de mayo se celebra una marcha desde las gradas hasta la plaza de la Constitución, donde se lee el nombre de los trabajadores fallecidos en accidentes laborales, y el sindicato de construcción naval conserva un archivo de fotografías y documentos que puede consultarse previa petición. La pérdida de empleos de los años ochenta dio lugar a grandes huelgas y a encierros, y aquel episodio sigue ocupando un lugar central en las conversaciones de los más veteranos. Hoy el astillero participa en programas de formación para jóvenes y colabora con la universidad en proyectos de ingeniería oceánica.

  ## El tranvía y el transporte urbano

  La ciudad tuvo una de las redes de tranvías más antiguas del país. El primero, de tracción animal, comenzó a circular en 1879 entre el puerto y la estación del Ensanche, y en 1902 se electrificaron las líneas, que llegaron a sumar cuarenta kilómetros. Los tranvías, de color verde y crema, subían hasta el castillo por la cuesta de San Telmo con un sistema de cremallera y alcanzaban las playas en verano. Fueron el medio de transporte básico de obreros y vecinos hasta mediados de siglo, cuando el autobús y el automóvil los desplazaron, y la última línea cerró en 1969.

  Su recuerdo se mantuvo vivo gracias a una asociación de aficionados que rescató dos coches y los restauró en las cocheras de Riomar. En 1998 se inauguró una línea turística de tres kilómetros por el frente marítimo, y diez años después el ayuntamiento aprobó el proyecto de un tranvía moderno que enlazara el puerto exterior, la universidad y el aeropuerto. Hoy funcionan dos líneas con material de piso bajo, que transportan casi veinte mil viajeros al día y han reducido el tráfico en el centro.

  El resto del transporte urbano lo componen una red de autobuses, un ascensor público que salva el desnivel entre el puerto y el Casco Viejo y los barquitos de la ría, que cruzan los Almenara cada diez minutos. La bicicleta gana terreno gracias a un carril que recorre la costa de punta a punta. El aeropuerto de Marisma, a veinticinco kilómetros, y la estación de trenes de alta velocidad, inaugurada en 2018, completan las comunicaciones. En una calle del Ensanche donde aún se ven los raíles incrustados en el adoquín se rodó una película de época sobre una familia de comerciantes, y ese tramo se muestra a los visitantes.

  Otro elemento singular de la movilidad local es el funicular de San Telmo, inaugurado en 1907 para unir el paseo marítimo con el mirador del castillo. Sus dos cabinas de madera, que se cruzan a mitad de recorrido, salvan un desnivel de ciento diez metros en menos de cuatro minutos. Se cerró durante la guerra y se restauró en 1985, y es hoy uno de los símbolos de la ciudad. Los vecinos lo usan a diario para subir la compra, y los turistas hacen cola en verano para contemplar la bahía desde arriba.

  La red de transporte público se completa con un servicio nocturno de autobuses que enlaza el Casco Viejo con los barrios del sur los fines de semana, y con una flota de taxis acuáticos que funciona en verano entre el puerto deportivo y las playas del Sablón. Los aparcamientos disuasorios en las afueras, conectados con lanzaderas, han reducido el tráfico en el centro, y una zona de bajas emisiones limita el acceso de los vehículos más contaminantes desde 2022.

  ## El carnaval

  El carnaval de Puerto Alameda es la fiesta más popular y una de las más antiguas del país. Sus orígenes se remontan al siglo XVI, cuando los marineros que regresaban de ultramar traían máscaras y ritmos de otras tierras que se mezclaron con las burlas tradicionales del invierno. Durante varios periodos, las autoridades civiles y eclesiásticas lo prohibieron, pero los vecinos siguieron celebrándolo en secreto, con disfraces que ocultaban la identidad y letras que satirizaban a los poderosos. La fiesta se institucionalizó en el siglo XIX, y hoy dura diez días entre febrero y marzo.

  El corazón del carnaval son las agrupaciones, grupos de aficionados que durante todo el año ensayan canciones satíricas sobre la actualidad política y social, con acompañamiento de guitarras, bombos y flautas. Se distinguen varias categorías: las comparsas, de tono lírico y crítico; las chirigotas, de humor desenfadado, con disfraces colectivos muy elaborados; los coros, que recorren la ciudad en grandes carrozas, y los cuartetos, de humor ágil. Se presentan al concurso del Teatro Principal, donde compiten ante un jurado y un público muy exigente, y las entradas se agotan semanas antes.

  Más allá del teatro, el carnaval ocupa las calles. Hay pasacalles, un gran desfile de carrozas y comparsas el segundo sábado, la quema del Rey Momo al final y, en el domingo anterior, el entierro de la sardina, una procesión burlesca en la que los disfraces van de luto y lloran la llegada de la Cuaresma. Los vecinos preparan sus trajes durante meses, y muchas familias guardan las telas y adornos de generación en generación. El Ayuntamiento reparte cada año ayudas a las agrupaciones y calcula que la fiesta atrae a unos doscientos mil visitantes.

  El carnaval de 2015 coincidió con un eclipse parcial de sol, que dejó imágenes memorables de multitudes con gafas de cartón mirando al cielo desde el paseo marítimo, aunque la mayoría de los vecinos siguieron concentrados en los desfiles.

  Los trajes son una parte esencial de la fiesta, y su preparación ocupa a barrios enteros durante meses. Las modistas del barrio de San Roque cortan y cosen telas, y los carpinteros fabrican las estructuras de las carrozas con madera ligera y cartón. Cada agrupación guarda en secreto el tema de su disfraz hasta la noche del estreno, y la competencia entre grupos rivales genera rumores, bromas y estrategias de despiste. Hay premios para el mejor disfraz, la mejor letra y la mejor música, y los ganadores salen a desfilar en el último fin de semana en un carro tirado por caballos.

  La fiesta tiene también una dimensión infantil y familiar: las escuelas organizan desfiles por las calles del Ensanche, y los niños aprenden coplas desde muy pequeños. Los más mayores recuerdan con nostalgia los bailes de máscaras del Casino de Marinos, que reunían a la alta sociedad y que desaparecieron en los sesenta, y los concursos de pregones que se celebraban en la plaza de la Constitución.

  La historia del carnaval se cuenta también a través de sus letras. Durante la dictadura que sufrió el país, los autores recurrieron a la metáfora para eludir la censura, y los ensayos se realizaban en bodegas y almacenes por si llegaba la policía. Algunas coplas de aquellos años se conservan en cuadernos manuscritos que hoy se guardan en el archivo municipal, y se editaron en un libro que recoge más de trescientas canciones. Los cantantes veteranos recuerdan cómo el público conocía las estrofas de memoria y las coreaba en voz baja por la calle.

  ## La cocina marinera

  La gastronomía de Puerto Alameda se basa en el producto del mar, tratado con sencillez. Las recetas tradicionales nacieron en las casas de pescadores, donde se aprovechaba cualquier captura de poco valor comercial. El plato más característico es el caldeiro de pescadores, un guiso de rape, congrio, patata y pimiento que se cuece en caldero de cobre y se sirve con una salsa de ajo y aceite. Otros platos populares son la sardina asada sobre brasas de leña de encina, el besugo al horno con patatas panaderas, las almejas a la marinera, el pulpo con pimentón y los chipirones en su tinta.

  Las tapas de las tabernas del puerto aprovechan las conservas locales. Se sirven mejillones en escabeche, boquerones en vinagre, ventresca de bonito sobre tostadas y huevas de merluza en rodajas, acompañadas de pan de maíz y de un vino blanco joven de las laderas de Marisma. La repostería sigue la tradición conventual: tocinillos de cielo, tartas de almendra, rosquillas de anís y los pasteles de nata de la confitería Casa Garmendia, abierta en 1887 y conservada con sus mostradores originales.

  Cada otoño se celebra la Semana del Mar, una muestra gastronómica en la que los restaurantes ofrecen menús con productos de temporada a precios fijos, y se entrega el premio al Mejor Cocinero Marinero. En la lonja, los fines de semana, el público puede comprar pescado directamente a los patrones, y varios cocineros jóvenes han reinterpretado los platos tradicionales con técnicas modernas. La cocina local ha sido reconocida con tres estrellas en la guía de un conocido sello gastronómico, repartidas entre dos restaurantes de la bahía.

  El mercado de abastos, un edificio de hierro y cristal de 1904, concentra la actividad gastronómica cotidiana. En sus puestos se venden pescados y mariscos, quesos de la sierra, embutidos, frutas y verduras de las huertas del Almenara, y en el piso superior hay barras donde se come de pie. Las huertas del valle abastecen de pimientos, judías y tomates a los restaurantes de la ciudad, y durante la temporada de caza, en otoño, llegan al mercado perdices y conejos de las sierras próximas.

  Los vinos de la tierra, blancos de uva albariña y tintos ligeros, se elaboran en pequeñas bodegas de las colinas de Marisma, que cuentan con una denominación de origen reconocida desde 1989. El aguardiente de hierbas y el licor de café son los digestivos tradicionales, y en las tabernas se acompañan con una rodaja de bizcocho. Entre los dulces, el pan de higo y las torrijas de Cuaresma son los más repetidos en las mesas familiares.

  ## Patrimonio y cultura

  El patrimonio de Puerto Alameda incluye monumentos de todas las épocas. El castillo de San Telmo, levantado en el siglo XIV sobre los restos de la fortaleza antigua y ampliado dos siglos después, alberga hoy el museo de Historia de la Ciudad. La iglesia de Santa María de la Mar guarda un retablo mayor de madera policromada y una colección de maquetas de barcos que los marineros ofrecían como exvotos. El faro del cabo de las Gaviotas, de cuarenta y dos metros, data de 1860 y sigue guiando a los navegantes.

  El Museo Marítimo, inaugurado en 1999 en los antiguos almacenes del Arsenal, reúne instrumentos de navegación, maquetas, cartas y una réplica del bergantín que cruzó el Atlántico en el siglo XVIII. El Teatro Principal, de 1881, acoge una temporada estable de ópera, danza y conciertos, y el festival de Jazz del Puerto, que cada julio reúne a músicos de diversos países en los muelles. Entre las instituciones literarias destaca la Biblioteca de Marisma, una de las más antiguas del país, con más de doscientos mil volúmenes.

  La literatura ha encontrado en la ciudad un paisaje fértil. Poetas y novelistas como Luisa Arévalo o Tomás Carvajal han descrito la niebla de la bahía, las tabernas del puerto y la vida de las conserveras, y su obra se recuerda en rutas literarias que parten de la plaza de la Constitución. Las asociaciones vecinales mantienen vivos el teatro aficionado, los coros y las bandas de música, y el ayuntamiento destina una parte de su presupuesto a la cultura de barrio.

  El deporte tiene un peso notable en la vida de la ciudad. El estadio del Marinos de Alameda, con capacidad para dieciocho mil espectadores, se llena los domingos de liga, y la afición es conocida por sus cánticos marineros. El remo es el deporte tradicional: cada septiembre se disputa la Regata de la Bahía, en la que competen traineras de los pueblos de la costa, y el club de la Concha ha ganado en varias ocasiones el campeonato nacional. La vela, el surf en las playas del norte y el senderismo por los acantilados atraen a deportistas de toda la región.

  ## Economía y gobierno

  La estructura económica de Puerto Alameda ha cambiado profundamente. Los servicios representan casi tres cuartas partes del empleo, con la logística portuaria, el comercio, el turismo y la administración como sectores principales. La industria sigue siendo relevante, sobre todo en conservas, astilleros y energías marinas. Un parque tecnológico, creado en 2011 en el campus de la universidad, acoge a empresas de biotecnología marina, de software para la gestión portuaria y de ingeniería ambiental.

  La ciudad está gobernada por un ayuntamiento con veintisiete concejales, elegidos cada cuatro años, y una alcaldía que desde 2019 ocupa Inés Valcárcel, una abogada de formación. Entre las prioridades del consistorio figuran la reducción de la contaminación de la bahía, la mejora del acceso a la vivienda en el Casco Viejo y la protección del paisaje costero frente a la presión inmobiliaria. Un debate recurrente enfrenta a quienes desean ampliar el puerto con quienes defienden convertir los antiguos muelles en parques y paseos para los vecinos.

  El futuro de la ciudad pasa, según sus planes estratégicos, por conservar su carácter marinero y diversificar su economía. La transición energética ofrece oportunidades, con proyectos de hidrógeno verde en el puerto exterior y de parques eólicos marinos frente al cabo de las Gaviotas. El patrimonio cultural, la calidad de vida y la condición de puerta del mar para toda una región son los activos con los que Puerto Alameda aspira a mantener su lugar entre las grandes ciudades del litoral.
