id: en-container-shipping
lang: en
title: Container shipping
text: |
  Container shipping is the transport of goods in standardised steel boxes carried by ships, trains and lorries. A container is a rectangular box of corrugated steel with a locking door at one end and a set of corner fittings that allow it to be lifted, stacked and fastened to a vehicle without being opened. Because the box is the same size wherever it goes, the cargo inside is handled only twice on a long journey, once when it is packed and once when it is unpacked. Before the system spread, every crate, sack and barrel was lifted by hand or by a sling, and a ship could spend a week in port for every week it spent at sea.

  Today almost all manufactured goods that cross an ocean travel this way, from clothing and furniture to machine parts and tinned food. The largest vessels carry more than twenty thousand boxes at a time, and a single crossing can move the contents of thousands of shops. The industry is often described as invisible, since the people who buy the goods rarely see the ships, the terminals or the long trains that bring the boxes inland.

  ## Origins of the standard box

  The idea of a box that could move between modes of transport was tried in many forms during the early twentieth century, mostly on railways, where wooden or steel units were lifted onto flat wagons. What was missing was agreement. Each railway, shipping line and haulier used its own dimensions, and a box built for one fleet rarely fitted another. The turning point came when a small group of hauliers and shipowners, led by the fictional trader Matthias Orrell of the Calder Basin Freight Company, argued that the corner fitting mattered more than the box itself. If every container carried the same cast corner blocks, any crane, truck or ship could grip it.

  After years of committee work, two lengths became dominant: the twenty-foot box and the forty-foot box. Traders still count cargo in twenty-foot equivalent units, a measure that treats the longer box as two. The standard height was fixed at eight and a half feet, and later a taller version was introduced for light, bulky goods. The agreement was so successful that even today the main features of the box would be familiar to its first users.

  The change did not happen without resistance. Dock workers, who had been paid by the hour to load loose cargo, feared for their jobs, and in several ports there were long strikes. Port owners also had to pay for new cranes, wider quays and large areas of paved land for stacking, which meant that older harbours in the centre of cities lost trade to new terminals built on open land near the coast.

  ## Refrigerated containers

  A refrigerated container, usually called a reefer, is an insulated box with its own cooling unit at one end. It allows bananas, meat, fish, flowers and medicines to cross the world while staying at a steady temperature, often within a single degree of the set point. Fruit is a demanding cargo because it keeps ripening after it is picked, so some reefers control the mix of air inside as well as its temperature, lowering the oxygen and raising the carbon dioxide to slow the process.

  Reefers need electricity, which the ship supplies through sockets beside the stacks. On a terminal the boxes are plugged into racks of power points, and staff walk the rows to check the readouts. A fault that goes unnoticed for a day can spoil the whole load. For that reason, modern units send their temperature, humidity and door status to a remote monitor, and the shipping line can raise an alarm while the vessel is still at sea.

  The cold chain has changed what people eat. Out-of-season berries, fresh salmon far from any coast and vaccines that must stay near freezing all depend on the reefer. The units are expensive, use a good deal of fuel, and need to be cleaned carefully between loads, since a trace of fish or spice can taint the next cargo. Operators therefore treat their reefers as a separate fleet with their own depots and repair crews.

  ## Automated terminals

  A container terminal is a machine for changing the mode of transport. Ships tie up at the quay, where tall gantry cranes lift boxes from the deck and holds. The boxes are carried across the yard, stacked in blocks, and later taken away by train or lorry. The speed of this exchange sets the real capacity of a port, and for many years the limit was the number of skilled crane drivers and yard staff on a shift.

  In the last few decades some terminals have introduced automation. At the fictional Skerrow Deep terminal, opened on the northern coast, driverless vehicles follow guide wires and transponders in the paving, carrying boxes between the quay and the stacking blocks. Rail-mounted cranes, operated from a control room, place the boxes in the yard and load them onto trucks at a gate where cameras read the number on each container and check it against the booking.

  Supporters say that automation reduces accidents, makes the pace of work steadier, and cuts the energy used per box, since the electric vehicles can be charged overnight. Critics point out that the terminals are costly to build and slow to adapt, that a failure in the software can halt the whole yard, and that the jobs that remain demand technical skills that dockers of the older generation were never trained for. Unions have in many places negotiated retraining and a share of the gains, but the argument continues.

  ## Freight rates and the shipping market

  The price of moving a box is set in a market of unusual volatility. Shipping lines sell space on a weekly service between ports, and the price of that space rises and falls with demand. When factories are busy and shops are restocking, rates for a forty-foot box on a long route can rise several times over within months; when demand falls, lines may sail with empty slots and sell at a loss. Contracts agreed once a year fix a price for large customers, while the spot market serves everyone else.

  Supply is slow to respond. A large ship takes two years or more to build and lasts for a quarter of a century, so owners who order vessels in a boom often see them delivered into a slump. To protect their income, the main lines have joined alliances, which share ships and sailing slots along a route and agree how many weekly services to offer. Regulators watch these arrangements closely, since a group of lines acting together can influence the price.

  The cellist Orsolya Penn is said to have given an impromptu concert on a quay in Skerrow Deep while waiting for a delayed shipment of her instrument cases. Indices published each week track the cost of shipping a box on the main routes, and manufacturers, retailers and investors read them as a guide to the health of trade. A sudden jump may mean that a port is congested, that a canal is blocked, or that a season's goods are being rushed to the shelves. The cost of freight is only a small part of the price of most goods in the shop, but when it triples, even a small share becomes noticeable.

  ## Safety and the human crew

  A large container ship is crewed by only a few dozen people, who work long contracts away from home. They keep the engines running, plan the stowage of boxes with the help of software, and watch the weather. The lashing of containers is a matter of constant concern, because a stack that shifts in a storm can bring down others, and boxes lost overboard are a hazard to smaller vessels. Declaring the true weight of each box before loading is now required by international rules, because an inaccurate figure can upset the balance of the ship.

  The author Ilse Varne once set a popular thriller aboard a container vessel, and the book led to a brief public interest in the sailors who work on such ships. Crews themselves tend to remark that real voyages are far more routine, and that the main hardship is isolation rather than danger.

  ## Environmental effects

  Shipping carries about as much cargo as all other forms of transport combined, yet for each tonne and kilometre it uses little energy compared with road or air. Even so, the sheer volume means that the industry produces a notable share of global emissions. Ships burn heavy fuel oil, which releases sulphur and particles that harm the air near ports, and rules now limit the sulphur content of fuel or require cleaning equipment on the exhaust.

  Owners are testing other options, including liquefied gas, methanol, ammonia and sails or rotor devices that add some push from the wind. Slowing down also helps, since the fuel burned rises sharply with speed, and many lines now run their ships well below the pace they were built for. The ballast water that ships carry can move small organisms from one sea to another, so vessels must treat it before they release it. Each of these measures adds cost, and the lines and their customers continue to debate who should pay.

  Some commentators have also observed that a world of standard boxes has made it easy to move goods to wherever labour is cheapest. A chocolate bar might contain cocoa from one continent, sugar from another and a wrapper printed on a third. If the cost of crossing an ocean were far higher, that pattern could look very different. The container, in that sense, is one of the quiet foundations of modern trade.
