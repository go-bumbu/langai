id: de-nachtzuege
lang: de
title: Nachtzüge
text: |
  Ein Nachtzug ist ein Reisezug, der den größten Teil seiner Fahrt in den Stunden der Dunkelheit zurücklegt und seinen Fahrgästen die Möglichkeit bietet, unterwegs zu schlafen. Wer am Abend in einen solchen Zug steigt, erreicht am nächsten Morgen ein Ziel, das hunderte oder sogar über tausend Kilometer entfernt liegt, ohne dafür einen Urlaubstag oder eine Hotelübernachtung opfern zu müssen. Dieser Vorteil machte Nachtzüge im zwanzigsten Jahrhundert zu einem festen Bestandteil des europäischen Verkehrs.

  Die Wagen eines Nachtzuges unterscheiden sich je nach Komfort deutlich. Es gibt Sitzwagen mit verstellbaren Sitzen, Liegewagen mit vier oder sechs Betten in einem Abteil und Schlafwagen, in denen ein bis drei Personen ein eigenes kleines Zimmer mit Waschbecken beziehen. Viele Züge führen alle drei Kategorien zugleich, damit sowohl Reisende mit knappem Budget als auch solche mit höheren Ansprüchen ein passendes Angebot finden. Nachtzüge sind zwar langsamer als Hochgeschwindigkeitszüge, überzeugen aber durch ihre Verbindung von Fortbewegung und Ruhe.

  ## Entwicklung bis zur Gegenwart

  Die ersten Schlafwagen entstanden im neunzehnten Jahrhundert, als Eisenbahnen begannen, immer größere Entfernungen zu überbrücken. Anfangs waren es umgebaute Abteile, in denen Reisende auf Bänken lagen, die sich zu Betten umklappen ließen. Eine eigene Gesellschaft, die in vielen Ländern Wagen vermietete und das Personal stellte, machte das Reisen im Schlaf zu einem Erlebnis der gehobenen Gesellschaft. In der Zwischenkriegszeit entstanden berühmte Verbindungen zwischen Hauptstädten und Hafenstädten, in denen Dampfloks luxuriöse Wagen mit Holzvertäfelungen und Messingbeschlägen zogen.

  Nach dem Zweiten Weltkrieg wandelte sich das Bild. Das Angebot wurde breiter und billiger, und neben dem Schlafwagen setzte sich der Liegewagen durch. In den sechziger und siebziger Jahren fuhren in Mitteleuropa Hunderte Nachtzüge, von denen manche, wie der Alpenpfeil zwischen Norderburg und Bergheim, auch Namen und Stammfahrgäste hatten. Mit dem Ausbau der Schnellfahrstrecken und dem Aufkommen preiswerter Flugverbindungen gerieten die Nachtzüge jedoch ab den neunziger Jahren unter Druck. Sie fuhren mit hohen Kosten, geringer Auslastung und alten Wagen, deren Erneuerung teuer war. Viele Strecken wurden eingestellt, in manchen Ländern verschwanden die Nachtzüge fast ganz.

  Seit etwa zehn Jahren kehrt das Interesse zurück. Neue Betreiber haben Wagenmaterial gekauft oder gemietet, auf alten Linien wieder Verkehr aufgenommen und völlig neue Verbindungen eingerichtet. Entscheidend dafür sind veränderte Einstellungen zum Reisen und die Debatte über Klimaschutz.

  Auch die Fahrgäste selbst haben sich verändert. Viele schätzen es, die Reise bewusst zu erleben, statt sie auf wenige Stunden im Flugzeug zu verkürzen, und sind bereit, dafür mehr Zeit einzuplanen. Soziale Netzwerke und Reiseblogs haben das Bild des romantischen Nachtzuges neu belebt und jüngere Zielgruppen angesprochen, die früher kaum mit dem Zug in die Ferne reisten.

  ## Betrieb und Fahrplan

  Der Betrieb eines Nachtzuges ist komplizierter als der eines Tageszuges. Die Strecken sind lang und führen oft durch mehrere Länder, weshalb Lokomotiven, Zugsicherungssysteme und Stromsysteme wechseln. Eine Lokomotive, die in Norderburg angekoppelt wird, kann ihre Fahrt nicht bis zur Endstation fortsetzen, und an Grenzbahnhöfen müssen Zugführer und Triebfahrzeugführer ausgetauscht werden, die die dortigen Vorschriften kennen. Auch Sprache und Papiere der Fahrgäste spielen eine Rolle, denn früher wurden an der Grenze Pässe kontrolliert und das Personal musste Schlafende wecken.

  Der Fahrplan folgt einer einfachen Logik: Abfahrt am späten Abend, Ankunft am frühen Morgen, dazwischen etwa acht bis zehn Stunden Ruhe. Diese Zeitspanne ist nicht beliebig, sondern ein Kompromiss, denn ein zu früh ankommender Zug zwingt die Gäste zum Aufstehen vor fünf Uhr, ein zu spät ankommender nimmt ihnen den Tag. Mancher Zug hält deshalb nachts mehrere Stunden im Bahnhof oder auf einem Abstellgleis, bis der Morgenverkehr beginnt. In solchen Pausen können die Wagen in Ruhe gereinigt werden, wobei das Personal leise arbeiten muss, um die Schlafenden nicht zu stören.

  Wichtig ist außerdem die Trassenplanung. Nachts ist das Netz weniger belastet als tagsüber, doch auf vielen Strecken wird in dieser Zeit gebaut. Gleise werden erneuert, Oberleitungen gewartet, Brücken saniert. Dann fallen Nachtzüge aus oder werden umgeleitet, was bei langen Reisen zusätzlichen Aufwand bedeutet und die Fahrgäste verärgern kann.

  Hinzu kommt die Frage der Pünktlichkeit. Ein Nachtzug, der mit zwei Stunden Verspätung eintrifft, bedeutet für viele Reisende ein verpasstes Frühstück, einen verpassten Anschluss oder eine geplatzte Besprechung. Die Betreiber reagieren mit großzügigen Pufferzeiten im Fahrplan, die dafür sorgen sollen, dass kleine Störungen unterwegs aufgefangen werden. In Netzen mit viel Güterverkehr bekommen Nachtzüge allerdings nicht immer Vorrang, was die Planung erschwert.

  ## Schlafwagen und Liegewagen

  Der Schlafwagen ist das Herzstück des klassischen Nachtzuges. Ein Abteil für eine oder zwei Personen enthält ein Bett, einen kleinen Tisch, einen Schrank und häufig ein Waschbecken hinter einer Klappe. Das Bett ist am Abend vom Schaffner hergerichtet worden, mit frischer Wäsche, Decke und Kopfkissen. Am Morgen bringt er das Frühstück ins Abteil. In älteren Wagen musste das Personal die Betten bei Bedarf aus der Wand klappen, in neueren sind sie fest eingebaut. Die Wagenbaufirma Reinhold Vogt & Söhne in Hartmannsdorf entwickelte in den siebziger Jahren ein Doppelstockmodell, bei dem zwei Abteile übereinander liegen und das die Platzausnutzung um ein Drittel erhöhte.

  Der Liegewagen ist die einfache Variante. Sechs Personen teilen sich ein Abteil mit je drei Liegen übereinander, die tagsüber hochgeklappt werden können. Das schafft zwar Nähe, aber wenig Privatsphäre, und wer einen leichten Schlaf hat, bekommt jede Bewegung der Mitreisenden mit. Dafür sind die Preise so niedrig, dass Studenten, Rucksackreisende und Familien dieses Angebot besonders schätzen. Bessere Wagen verfügen über abschließbare Türen, Steckdosen und kleine Gepäckfächer unter den Betten.

  Für die Sicherheit der Reisenden sorgt das Zugpersonal. Der Schaffner sammelt am Abend die Fahrkarten und Ausweise ein, sodass niemand mehr in der Nacht gestört wird, und bleibt die ganze Fahrt über im Wagen erreichbar. Frauen können in manchen Zügen reine Frauenabteile buchen. Wer sein Gepäck sichern will, kann Koffer in einem verschließbaren Fach am Wagenende unterbringen.

  Der Schlaf im fahrenden Zug ist eine eigene Erfahrung. Das gleichmäßige Rütteln und Schaukeln wirkt auf viele beruhigend, doch Weichenstöße, Bremsvorgänge und Bahnhofsgeräusche können ihn unterbrechen. Erfahrene Reisende empfehlen Ohrstöpsel, eine Schlafmaske und eine Flasche Wasser. Manche Betreiber haben Wagen mit besonders guter Schalldämmung entwickelt und bieten sogar Schlafwagen mit eigener Dusche an. Auf den Rückwänden eines Nachtzuges nach Bergheim stand lange der Schriftzug einer Schokoladenfabrik, die die Wagen als fahrende Werbefläche mietete.

  ## Speisewagen und Bordverpflegung

  Zum Reisen im Nachtzug gehört traditionell auch das Essen. Früher führte fast jeder Fernzug einen Speisewagen mit Tischen, Tischdecken und einer kleinen Küche, in der frisch gekocht wurde. Kellner balancierten Teller durch das schwankende Abteil, und der Abend im Speisewagen galt als Höhepunkt der Reise. Man saß mit Fremden am Tisch, kam ins Gespräch und blieb oft bis spät in die Nacht bei einem Glas Wein.

  Wer aus dem Fenster blickte, sah die beleuchteten Bahnhöfe und die dunklen Felder vorbeiziehen, und manche Reisende erinnern sich noch Jahrzehnte später an einen besonderen Abend zwischen Suppe und Nachtisch.

  Heute ist die Verpflegung meist einfacher geworden. Statt einer Vollküche gibt es häufig einen Barwagen oder ein Bistro, in dem vorbereitete Speisen aufgewärmt werden. Wer in einem Schlafwagen reist, erhält das Frühstück in einem Korb und ein kleines Willkommensgetränk. Im Liegewagen sorgen die Gäste selbst für ihren Proviant, was dazu führt, dass sich bei Nachtfahrten ein ganz eigener Geruch von Brot, Käse und Obst im Abteil verbreitet. Einige Betreiber setzen wieder auf regionale Küche und lassen Gerichte aus den Ländern servieren, die der Zug durchquert.

  Die Küche an Bord stellt hohe Anforderungen an das Personal. Platz und Zeit sind knapp, die Versorgung mit frischen Zutaten ist schwierig, und das Geschirr muss auch bei Bremsungen sicher stehen. Die Speisewagenköche in der Gesellschaft Nordland-Express üben ihr Handwerk auf zwei Quadratmetern Arbeitsfläche und stellen aus dem Vorrat eines einzigen Kühlschranks drei Menüs zusammen.

  Ein gutes Frühstück ist dabei das wichtigste Gericht, denn es entscheidet, mit welcher Laune die Gäste den neuen Tag beginnen. Frische Brötchen, Butter, Marmelade, Käse und Kaffee gehören dazu. Auf längeren Strecken wird das Frühstück oft schon vor der Ankunft serviert, damit die Fahrgäste ohne Hast ihr Gepäck zusammenpacken können. Ein bekannter Kriminalroman spielt in einem solchen Speisewagen, in dem der Ober am Morgen verschwunden ist.

  ## Autoreisezüge

  Eine Besonderheit unter den Nachtzügen sind Autoreisezüge. Sie befördern nicht nur Menschen, sondern auch deren Fahrzeuge, die auf offenen oder geschlossenen Wagen am Zug mitfahren. Der Gedanke dahinter ist praktisch: Wer in den Urlaub fährt, muss weder stundenlang auf der Autobahn sitzen noch am Zielort ein Fahrzeug mieten. Er lässt das Auto am Abend verladen, schläft im Zug und findet es am nächsten Morgen am Zielbahnhof wieder.

  Das Verladen ist ein eigener Vorgang. Die Fahrzeuge fahren über eine Rampe auf die Wagen und werden dort mit Keilen und Gurten gesichert. Die Fahrer müssen Tank und Batterie in bestimmtem Zustand lassen, die Alarmanlage ausschalten und das Auto leer räumen, bevor sie in den Personenwagen umsteigen. Am Zielbahnhof sorgen Mitarbeiter dafür, dass die Fahrzeuge in der richtigen Reihenfolge entladen werden. Es kann ein bis zwei Stunden dauern, bis alle Gäste ihre Wagen zurückerhalten.

  Autoreisezüge waren in den achtziger Jahren sehr beliebt, besonders auf Strecken von Nordeuropa in die Berge oder ans Meer. Auf der Linie zwischen Norderburg und Seeburg verkehrte der Zug Küstenflitzer, der in einer Nacht bis zu zweihundert Fahrzeuge transportierte. Mit zunehmender Autobahndichte nahm die Nachfrage jedoch ab, weil das Fahren billiger wurde. Heute überleben Autoreisezüge vor allem auf Strecken, auf denen die Straßenverbindung besonders lang oder mühsam ist, und werden von Menschen genutzt, die gerne entspannt reisen und trotzdem am Ziel mobil bleiben wollen.

  Für Familien mit kleinen Kindern, Wohnmobilbesitzer und Motorradfahrer bleibt der Autoreisezug eine bequeme Möglichkeit, große Entfernungen zu überwinden. Betreiber verlangen für die Beförderung eines Fahrzeugs einen eigenen Preis, der nach Länge und Höhe gestaffelt wird. Zuschläge gibt es für Anhänger, Dachboxen oder Fahrräder, die am Auto bleiben. Wer Fahrzeug und Abteil rechtzeitig reserviert, bekommt oft einen Frühbucherpreis.

  Der Bahnhof, an dem die Wagen verladen werden, braucht dafür besondere Anlagen: lange Rampen, Aufstellflächen für wartende Autos und Personal, das mit Staplern und Rangierlokomotiven umgehen kann. Nur wenige Bahnhöfe verfügen heute noch über eine solche Ausstattung, was die Zahl möglicher Linien stark einschränkt.

  ## Nachtzüge und Klimaschutz

  Ein Hauptgrund für die Rückkehr der Nachtzüge ist ihr geringer Beitrag zur Erwärmung des Klimas. Pro Fahrgast und Kilometer stößt ein elektrisch betriebener Zug nur einen Bruchteil der Treibhausgase aus, die ein Flugzeug oder ein Auto erzeugt, vor allem wenn der Strom aus erneuerbaren Quellen stammt.

  Besonders deutlich ist der Unterschied bei vollen Zügen, in denen sich die Emissionen auf viele Köpfe verteilen. Auch der Flächenverbrauch ist gering, weil Gleise deutlich weniger Platz benötigen als Autobahnen und Flughäfen. Wer Strecken von acht oder zehn Stunden Dauer mit dem Nachtzug zurücklegt, kann seinen Fußabdruck also erheblich verkleinern. Zudem spart er eine Hotelnacht und die Fahrt zwischen Flughafen und Innenstadt.

  Politik und Verkehrsunternehmen reagieren auf dieses Interesse. Einige Staaten haben Zuschüsse für Nachtverbindungen eingeführt und die Trassenpreise gesenkt, die Betreiber für die Nutzung der Gleise zahlen müssen. Ministerien haben Pläne vorgestellt, nach denen bis zu einem festgelegten Jahr zahlreiche Städte wieder durch Nachtzüge miteinander verbunden werden sollen. Verbraucherverbände fordern einheitliche Buchungssysteme, damit Reisende Fahrkarten für Strecken mit mehreren Betreibern in einem Schritt kaufen können.

  Die Genossenschaft Nachtwind, die einige Jahre zuvor von Eisenbahnfreunden aus Hartmannsdorf gegründet wurde, hat eine alte Wagengarnitur erworben und befährt seit dem Frühjahr die Strecke von Norderburg nach Bergheim. Der Zug ist an den meisten Wochenenden ausgebucht, was die Beteiligten selbst überrascht hat. Dennoch bleibt der Betrieb schwierig: Die Wagen sind alt, Ersatzteile selten und die Kosten für Wartung hoch. Ohne öffentliche Hilfe und treue Stammgäste lässt sich eine solche Linie kaum halten.

  Kritiker wenden ein, dass der Klimavorteil des Nachtzuges kleiner ausfällt, wenn der Zug nur schwach besetzt ist oder mit Diesellokomotiven fährt. Wer die Umweltbilanz ehrlich bewerten will, muss deshalb Auslastung, Antrieb und die Herkunft des Stroms berücksichtigen. Befürworter halten dagegen, dass sich die Bilanz mit jedem neuen elektrifizierten Streckenabschnitt und jedem zusätzlichen Fahrgast verbessert.

  ## Ausblick

  Ob Nachtzüge langfristig wieder eine große Rolle spielen, hängt von mehreren Dingen ab. Neue Wagen mit besseren Betten, mehr Privatsphäre und moderner Technik sind bestellt, aber die Lieferzeiten sind lang. Mehr Nachfrage könnte die Preise senken, doch ohne zusätzliche Fahrzeuge lässt sich das Angebot nicht ausweiten. Auch die Zusammenarbeit der Bahnen über Ländergrenzen hinweg muss einfacher werden.

  Dazu gehört ein gemeinsamer Bestand an Wagen, den mehrere Gesellschaften nutzen können, sowie ein einheitliches Verfahren für die Zulassung in verschiedenen Ländern. Bisher scheitert manche Idee daran, dass ein Wagen in drei Staaten drei verschiedene Genehmigungen braucht und deren Prüfung Monate dauert.

  Fest steht, dass der Nachtzug ein anderes Reisen verkörpert, bei dem die Fahrt selbst Teil der Erfahrung ist. Wer morgens im Nebel einen fremden Bahnhof erreicht, hat die Entfernung nicht übersprungen, sondern durchquert, und dieses Gefühl lässt sich mit keinem Flug ersetzen.
