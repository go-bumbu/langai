id: es-valle-del-saron
lang: es
title: "El valle del Sarón"
text: |
  El valle del Sarón es un valle ficticio de montaña situado en el norte de una región imaginaria de la península, entre la sierra de Peñalara Negra y los cerros de la Umbría. Lo recorre de este a oeste el río Sarón, un curso de agua corto y de caudal irregular que nace en un circo glaciar a más de dos mil doscientos metros y desemboca, tras sesenta kilómetros, en el embalse de la Hoz. Su población, repartida en nueve pueblos y varios caseríos, apenas supera los cuatro mil habitantes, y su capital histórica es Villaseca del Sarón.

  El valle es conocido por su paisaje de prados de siega, bosques de haya y roble y laderas cubiertas de piedra suelta, y por una economía que durante siglos descansó en el ganado, en el aprovechamiento del monte y en el trabajo estacional. Hoy combina esas actividades con un turismo moderado de senderismo y de casas rurales. Su aislamiento relativo, con una sola carretera de acceso que en invierno suele cerrarse por nieve, ha favorecido la conservación de costumbres, oficios y construcciones que en otros lugares desaparecieron.

  ## Geografía y clima

  El Sarón ocupa una depresión alargada que los hielos del Cuaternario ensancharon y dejaron con el perfil en forma de artesa característico de los valles glaciares. Las paredes laterales son abruptas en la cabecera, donde afloran calizas grises y pizarras muy plegadas, y se suavizan aguas abajo, donde el fondo se cubre de depósitos arrastrados por el río. En el tramo alto se encuentran tres pequeños lagos de origen glaciar, el mayor de ellos el de las Corzas, que se hiela de noviembre a abril.

  El clima es de montaña atlántica, con inviernos fríos y húmedos, veranos frescos y precipitaciones repartidas durante todo el año. Las nevadas son frecuentes por encima de los mil quinientos metros, y la nieve puede permanecer en las umbrías hasta bien entrado junio. En primavera, el deshielo hace crecer el río y a veces lo desborda en el tramo de Villaseca, aunque los muros de contención levantados a mediados del siglo pasado han reducido el riesgo. La diferencia de temperatura entre el fondo del valle y las cumbres puede superar los diez grados, y las nieblas de fondo de valle son habituales en otoño.

  La vegetación se ordena por pisos. En el fondo prosperan fresnos, avellanos y sauces junto al cauce, y en las laderas medias hayedos y robledales; más arriba, el pino albar cede paso a los matorrales de enebro y brezo y, por encima de los dos mil metros, a pastos alpinos salpicados de genciana. Entre la fauna se cuentan el corzo, el jabalí, el zorro y, en las cumbres, el rebeco. El águila real nidifica en los cantiles de Peñalara Negra, y el desmán, un pequeño mamífero acuático, ha sido observado en algunos arroyos de aguas limpias.

  ## La trashumancia

  Durante siglos, la vida del valle giró en torno a los rebaños que subían y bajaban según la estación. Los pastores del Sarón practicaban la trashumancia de corto recorrido: en mayo, cuando la nieve se retiraba, las ovejas y las vacas ascendían a los puertos de verano por sendas conocidas como cañadas, y en octubre regresaban al fondo del valle, donde pasaban el invierno en establos y rastrojos. Algunos rebaños bajaban incluso hasta las tierras llanas del sur, en un viaje de varias semanas que seguía caminos reales con posadas y abrevaderos.

  La organización del pastoreo descansaba en una institución comunal, la mancomunidad de pastos, que repartía los derechos de uso entre los vecinos de cada pueblo. Cada familia podía llevar a los puertos un número fijo de cabezas, determinado por el tamaño de su casa y de sus prados de siega. Un pastor contratado, el mayoral, guiaba los rebaños y respondía ante una junta de vecinos que se reunía cada primavera para establecer las fechas de subida. Las disputas por el agua y por los límites de los pastos, frecuentes entre pueblos vecinos, se resolvían con la mediación de la junta.

  Del oficio han quedado refugios de piedra con tejado de losa, las bordas, en las que los pastores se guarecían, y una cultura de cantos, de refranes y de fiestas. La más conocida es la Subida de Mayo, en la que Villaseca recibe a los rebaños adornados con cintas y cencerros antes de que emprendan el ascenso. En los años recientes el número de pastores ha caído, pero algunos jóvenes han vuelto al oficio, con rebaños más pequeños y camiones que ahorran el tramo más duro del camino. Los senderistas que recorren hoy las cañadas encuentran mojones y fuentes que mantiene la asociación local.

  ## El queso del Sarón

  El queso es el producto más reconocido del valle. Se elabora con leche cruda de oveja, a veces mezclada con un poco de leche de vaca, y la receta se transmite de familia en familia desde hace generaciones. La leche se cuaja con cuajo animal, se corta la cuajada en granos pequeños, se calienta ligeramente y se prensa en moldes de madera de haya. Después se sala en seco o en salmuera y se deja madurar al menos cuatro meses en cuevas naturales de la ladera, cuya temperatura constante y humedad elevada dan a la corteza su aspecto enmohecido y su color grisáceo.

  Cada pieza pesa entre uno y dos kilos, tiene forma de cilindro bajo y se marca con un sello de la cooperativa. La pasta es firme, de color marfil, con pequeños ojos irregulares, y el sabor combina notas lácteas, de nuez y de hierba, con un punto picante en las piezas más curadas. La quesería más antigua, la de la familia Arroyo en Villaseca, conserva todavía las cubas y las tablas de curación que usó el fundador a finales del siglo XIX. En ella se elabora a mano, a un ritmo de unas doscientas piezas por semana en temporada alta.

  El queso se consume sobre todo en la mesa de los pueblos, acompañado de pan de centeno, miel o membrillo, pero también se utiliza para fundirlo en guisos de patata y en sopas de ajo. Las asociaciones de productores han solicitado una denominación de origen que proteja el método tradicional y fije el área de producción, y organizan cada septiembre una feria con concurso de quesos, a la que acuden compradores de ciudades lejanas.

  ## Arquitectura de piedra

  Las casas del Sarón se levantaron con los materiales del propio valle. Los muros, de mampostería de caliza y pizarra, alcanzan un grosor de hasta ochenta centímetros y aíslan del frío; los tejados, de losa de pizarra sobre un armazón de vigas de roble, tienen una fuerte pendiente para despedir la nieve. En la planta baja se situaba el establo, de modo que el calor de los animales subía por el suelo de tablas hasta las habitaciones, y en la planta superior se almacenaban el heno y el grano. Una galería de madera orientada al sur servía de secadero y de lugar de trabajo en los días soleados.

  Cada pueblo conserva además construcciones comunes: hornos de pan, lavaderos, fuentes con pilón y pequeñas ermitas. Los puentes de piedra de un solo arco cruzan el Sarón y sus afluentes, y varios se remontan al siglo XVII, como el de la Hoz Vieja. Los vecinos han mantenido el uso de la cal para encalar las fachadas, y una ordenanza municipal exige que las reformas respeten la pendiente del tejado y los materiales tradicionales. El mejor ejemplo de conjunto es el barrio alto de Peñaflor, cuyas calles empedradas y casas adosadas fueron restauradas en las últimas décadas.

  La construcción en piedra requiere un oficio específico. Los canteros del valle, famosos en la región, aprendían de niños a reconocer las vetas de la roca y a labrar los sillares sin herramientas modernas. Hoy quedan pocos, pero una escuela taller enseña a jóvenes la técnica de la piedra seca, con la que se levantan los muros de los prados y los abancalamientos de las laderas. Durante una restauración en Peñaflor, el futbolista ficticio Rodrigo Mena, nacido en el pueblo, visitó las obras y regaló un balón a los niños de la escuela.

  ## Economía y comunicaciones

  La economía contemporánea del valle se sostiene en la ganadería extensiva, la producción de queso, el aprovechamiento forestal y el turismo rural. La central hidroeléctrica de la Hoz, construida en los años cincuenta, aporta empleo y recursos al municipio. En una de las hoces del curso bajo se rodó hace décadas una película de espías, y los vecinos aún cuentan anécdotas del rodaje. Cada año, la carretera comarcal queda cortada varios días por el temporal, y los vecinos reclaman un túnel que evite el puerto de la Umbría.
