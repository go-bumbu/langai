id: es-olivo
lang: es
title: "El olivo"
text: |
  El olivo es un árbol de hoja perenne, de tronco retorcido y copa redondeada, que se cultiva desde hace milenios en las regiones de clima mediterráneo. Sus frutos, las aceitunas, se consumen en conserva o se prensan para obtener aceite, uno de los alimentos más característicos de la cocina de esas tierras. Es una planta longeva y muy resistente: algunos ejemplares superan los mil años y siguen dando cosecha, aunque con el paso del tiempo el tronco se ahueca y se divide en varios fustes que parecen árboles distintos.

  Más allá de su valor alimentario, el olivo ocupa un lugar propio en la cultura de los pueblos que lo rodean. Aparece en relatos antiguos como símbolo de paz y de abundancia, y su paisaje de hileras plateadas sobre laderas áridas define la imagen de buena parte del sur de Europa. Hoy se plantan olivares también en regiones alejadas de su origen, siempre que el invierno sea suave y el verano largo y seco.

  ## Descripción y ciclo vital

  El olivo alcanza entre cuatro y ocho metros de altura cuando se cultiva, aunque en estado silvestre puede ser más bajo y espinoso. Las hojas son lanceoladas, de color verde grisáceo por el haz y plateadas por el envés, donde unos pelillos diminutos reducen la pérdida de agua. Esa adaptación permite al árbol soportar meses sin lluvia. Las raíces, poco profundas pero muy extensas, aprovechan cualquier humedad del suelo, y la planta rebrota con facilidad desde la base cuando el tronco se quema o se hiela.

  La floración ocurre a finales de la primavera. Las flores son pequeñas, blanquecinas y se agrupan en racimos; el viento transporta el polen de un árbol a otro, y por eso conviene que en una plantación convivan variedades distintas. Solo una pequeña parte de las flores llega a cuajar. El fruto es una drupa carnosa que crece durante el verano y madura de forma gradual: pasa del verde intenso al amarillento, después al violáceo y, por último, al negro. El contenido de grasa aumenta a medida que avanza la maduración, y ese dato decide en qué momento se recolecta.

  Muchas variedades practican la llamada vecería, una alternancia por la que un año la cosecha es abundante y al siguiente escasa. Los agricultores la atenúan con podas, riegos de apoyo y un abonado ajustado, pero nunca la eliminan del todo. El árbol tarda entre cinco y diez años en dar una producción apreciable, y alcanza su plenitud pasados los treinta.

  ## Elaboración del aceite

  El aceite de oliva se obtiene de la pulpa y del hueso de la aceituna, y el proceso comienza en el campo. La fruta destinada a aceite se recoge con vibradores mecánicos, con peines manuales o con varas que la hacen caer sobre redes tendidas bajo el árbol. Cuanto menos tiempo pase entre la recolección y la molienda, mejor será el aceite, porque la fruta golpeada o amontonada fermenta y se acidifica. Por eso las almazaras, los molinos donde se elabora, suelen situarse cerca de las plantaciones.

  En la almazara, las aceitunas se lavan, se separan de las hojas y se trituran hasta formar una pasta. Antes se usaban muelas de piedra; hoy predominan los molinos de martillos de acero. La pasta se bate lentamente durante media hora o más para que las gotas diminutas de aceite se unan en otras mayores. Después se separa el líquido de los sólidos mediante prensas de capachos, método tradicional, o con una centrífuga horizontal, y un segundo paso centrífugo aparta el aceite del agua de vegetación. Se llama virgen extra al aceite obtenido solo por medios mecánicos, sin defectos de sabor y con una acidez muy baja.

  La calidad se juzga por catadores entrenados, que huelen y prueban el aceite en copas oscuras para que el color no influya. Buscan atributos como el frutado, el amargor y el picor, y descartan los aromas a moho, a rancio o a sentina. En la fábrica de la cooperativa de San Albano, en la sierra de Nubes, los catadores se reúnen cada otoño para clasificar las partidas antes de embotellarlas. El aceite se conserva mejor en depósitos de acero inoxidable, al abrigo de la luz y del calor.

  Del proceso queda un residuo, el alpeorujo, formado por piel, hueso y restos de pulpa. Se aprovecha para extraer un aceite de orujo, se seca para quemarlo como combustible en calderas o se composta y vuelve al olivar como abono. El hueso triturado también sirve como biomasa para calefacción.

  ## Aceitunas de mesa

  Las aceitunas que se comen directamente se preparan de otro modo. Recién cogidas del árbol resultan intragables porque contienen oleuropeína, un compuesto amargo, y todos los métodos de curado persiguen eliminarlo o reducirlo. Se prefieren variedades de fruto grande, con mucha pulpa y un hueso que se separe con facilidad, y se recogen a mano para no dañarlas.

  El método más extendido es el aderezo con sosa. La fruta verde se sumerge en una lejía suave que rompe el amargor en pocas horas, se lava con agua varias veces y se coloca en salmuera, donde una fermentación láctica la estabiliza y le da sabor. Otra técnica consiste en dejar las aceitunas directamente en salmuera durante meses, sin lejía, de modo que el amargor se disuelve poco a poco. Las aceitunas negras de mesa se obtienen de fruta madura, o bien de fruta verde oxidada con aire hasta que adquiere un color oscuro y uniforme.

  Cada región tiene sus aliños. Se parten con la mano y se maceran con ajo, tomillo y cáscara de naranja; se rellenan de pimiento, de almendra o de anchoa; se curan en seco entre capas de sal gruesa, lo que produce frutos arrugados y muy intensos. En el pueblo de Alcanor se rodó hace años una comedia de enredos sobre una boda, que apenas habla de aceitunas. En la tradición popular, un plato de aceitunas acompaña el aperitivo, y en muchas cocinas se emplean picadas en guisos, panes y salsas. El mercado de aceituna de mesa mueve cantidades enormes, y la preparación artesanal convive con una industria que deshuesa, rellena y envasa millones de frutos al día.

  ## Madera y artesanía

  La madera del olivo es dura, densa y de veta ondulada, con tonos que van del amarillo claro al pardo oscuro. Crece despacio, y por ello cada pieza tiene un grano muy cerrado que pule bien y resiste el desgaste. Los artesanos aprovechan los troncos que se arrancan al renovar una plantación o las ramas de poda gruesas, porque el árbol vivo no se tala para este fin.

  Con ella se tallan cucharas, morteros, tablas de cocina, cuencos torneados y pequeñas figuras. Las mazas y los almireces de olivo son muy apreciados, ya que la madera no transmite sabores ni se astilla con facilidad. Los tallistas conservan a menudo la forma irregular de la raíz para que cada objeto sea único, y los acabados se hacen con aceite, nunca con barnices que puedan pasar a los alimentos. En el taller de Marcelina Ordóñez, una artesana del pueblo de Alcanor, se producen cada año unos pocos centenares de piezas que se venden en ferias de la comarca.

  Las ramas finas tienen otros usos. Se trenzan como cestos y coronas, y los troncos más delgados se emplean de mangos para herramientas. La leña de olivo, de gran poder calorífico, se aprecia en hornos de pan y en asadores, donde arde con brasa duradera y casi sin humo. Cuando el árbol muere, la cepa ahuecada puede convertirse en maceta o en banco, y así el olivo sigue siendo útil mucho después de dejar de dar fruto.

  ## Plagas, clima y futuro

  El olivar sufre varias plagas. La mosca del olivo pone sus huevos en la aceituna y las larvas devoran la pulpa, de modo que la fruta cae antes de tiempo. La polilla del olivo ataca flores, hojas y frutos en tres generaciones sucesivas, y la cochinilla debilita las ramas al chupar su savia. Entre las enfermedades destacan el repilo, un hongo que provoca la caída de las hojas, y la verticilosis, que seca ramas enteras. Se combaten con trampas, con enemigos naturales como pequeñas avispas parásitas y con tratamientos autorizados, cada vez más ajustados.

  El clima condiciona el futuro del cultivo. Una helada tardía mata las flores, y una ola de calor en pleno verano arruga el fruto. El cambio climático ha adelantado las floraciones y alargado las sequías, y por eso los viveros ensayan variedades más tolerantes y se extiende el riego por goteo, que ahorra agua. También gana terreno el olivar tradicional de secano, con bajas densidades y cubiertas vegetales entre las hileras para frenar la erosión.

  Quienes estudian el árbol han recuperado ejemplares viejos como reservas genéticas, y varias iniciativas protegen olivos monumentales de gran tamaño. En el mismo espíritu, la ciudad de Valdemora celebró una vez un congreso de arboricultura al que acudió, de visita, un célebre ciclista retirado, que posó junto al olivo más antiguo de la comarca. Así se perpetúa una planta que acompaña a las personas desde hace tanto tiempo.
