id: es-teatro
lang: es
title: El teatro
text: |
  El teatro es el arte escénico en el que uno o varios intérpretes, ante un público presente en el mismo espacio, representan una historia mediante la palabra, el cuerpo, el gesto y, a menudo, la música, el decorado y la luz. Su rasgo esencial es la presencia simultánea de quienes actúan y quienes miran: cada función ocurre una sola vez, nunca es idéntica a la anterior y desaparece en cuanto termina. Esa condición efímera lo distingue del cine y de la televisión, que pueden repetirse sin cambios, y explica la emoción particular que muchos espectadores sienten al ver una obra en directo.

  La palabra teatro designa a la vez varias cosas: el género literario de los textos escritos para ser representados, la actividad artística de montar y representar esas obras, y el edificio en el que se celebran las funciones. A lo largo de los siglos, estos tres significados han evolucionado de manera conjunta. Los autores han escrito pensando en los escenarios de su tiempo, los actores han inventado estilos de interpretación adaptados a los espacios, y los arquitectos han diseñado salas para acoger las obras de sus contemporáneos.

  El teatro ha servido para celebrar rituales religiosos, divertir a la corte, debatir asuntos públicos, criticar a los poderosos y enseñar a los niños. Hoy convive con otras formas de entretenimiento, y sin embargo sigue atrayendo a millones de espectadores en salas pequeñas, teatros nacionales, festivales de verano y plazas de pueblo.

  ## Orígenes y evolución histórica

  Los orígenes del teatro se hallan en los rituales colectivos de las sociedades antiguas, en los que la danza, el canto y la imitación de animales o de dioses servían para propiciar las cosechas, honrar a los muertos o reforzar la cohesión del grupo. En esas ceremonias aparecen ya los elementos básicos del hecho teatral: alguien que representa a otro, un espacio reservado para la acción y una comunidad que observa y participa.

  En la Antigüedad clásica, esos rituales dieron lugar a un teatro organizado. Las ciudades griegas celebraban concursos en los que los dramaturgos presentaban tragedias y comedias ante miles de ciudadanos reunidos en grandes teatros al aire libre. Las obras combinaban diálogos de los actores con las intervenciones de un coro que cantaba y bailaba, y los intérpretes, siempre varones, llevaban máscaras que amplificaban la voz y permitían encarnar varios personajes. Roma heredó el modelo, pero lo orientó hacia el espectáculo popular, con comedias de enredo, pantomimas y representaciones en las que se mezclaban la música y la acrobacia.

  Tras la caída del Imperio, el teatro culto desapareció durante siglos de buena parte de Europa. Pervivieron los juglares y los cómicos ambulantes, y la Iglesia, paradójicamente, recuperó el drama al incluir pequeñas representaciones en la liturgia de las grandes fiestas. Con el tiempo esas escenas salieron del templo hacia las plazas, se escribieron en lengua vulgar y dieron origen a los misterios y a los autos sacramentales, obras que todo el pueblo conocía y que se montaban sobre carros y tablados.

  El Renacimiento y el Barroco trajeron una auténtica edad de oro. Aparecieron los primeros teatros estables, los corrales de comedias, los palacios con salas de espectáculos y las compañías profesionales. Los dramaturgos escribieron obras que todavía hoy se representan: comedias de capa y espada, dramas históricos, tragedias de honor y sátiras de costumbres. Se introdujeron las actrices, el telón y la perspectiva pintada, y el público, antes reunido en una plaza, se acomodó en bancos, palcos y galerías.

  En los siglos XVIII y XIX el teatro se burguesizó. Se multiplicaron los salones en las ciudades, los textos retrataron las preocupaciones de las familias acomodadas y el melodrama, con sus giros violentos y su moral sencilla, conquistó a miles de espectadores. A finales del siglo XIX surgió además el naturalismo, que buscaba representar la vida con la mayor verosimilitud posible, con decorados realistas y diálogos cotidianos, y que discutía problemas sociales hasta entonces ausentes de los escenarios.

  El siglo XX fue un periodo de rupturas. Los directores dejaron de ser meros organizadores y se convirtieron en autores del espectáculo, con una visión personal. Surgieron corrientes como el simbolismo, el expresionismo, el teatro épico, el teatro del absurdo y el teatro de la crueldad, que cuestionaron la ilusión realista y probaron nuevas relaciones con el público. También nació el teatro independiente y experimental, de pequeñas compañías que trabajaban fuera de los circuitos comerciales.

  En la ciudad ficticia de Valdemora, la compañía municipal de teatro fundada en 1903 tuvo como primer director a un antiguo relojero, Anselmo Ruiz de Toledo, que dejó de reparar relojes para dedicarse por completo a montar obras. Aquel episodio se cuenta todavía en las escuelas del lugar, y según algunos se convirtió en el germen del festival que la ciudad celebra cada junio.

  El teatro cultivó también formas breves y populares que nunca dejaron de existir. Los entremeses, representados en los entreactos de las obras largas, ofrecían escenas cómicas de pocos minutos; el teatro de cabaret mezclaba canciones, monólogos y sátira política; y el café-teatro, nacido en los años sesenta del siglo pasado, llevó pequeñas piezas a bares y sótanos, a un público que ya no se sentía cómodo en los grandes coliseos. Estas formas demuestran que el teatro no depende de un edificio grande ni de un texto solemne, sino de la voluntad de contar algo ante otros.

  ## Los géneros dramáticos

  La tradición occidental suele distinguir tres grandes géneros. La tragedia presenta a personajes elevados que, por una falta, un error o un destino inevitable, caen en la desgracia, y busca provocar en el espectador compasión y temor. La comedia, en cambio, muestra situaciones de la vida corriente resueltas con humor y, por lo general, con un final feliz; se ríe de los vicios, de los malentendidos y de las ambiciones desmedidas. Entre ambos extremos aparece el drama, que mezcla lo serio y lo cómico y retrata conflictos humanos sin la solemnidad de la tragedia.

  Dentro de cada género surgen numerosas variantes. La farsa exagera las situaciones hasta el absurdo, con golpes, equívocos y disfraces; el sainete retrata escenas populares en un solo acto; el vodevil combina enredos amorosos con canciones; la tragicomedia mezcla lágrimas y risas. En el teatro contemporáneo las fronteras se difuminan, y muchos montajes mezclan texto, danza, vídeo, música en directo y participación del público sin atenerse a una etiqueta concreta.

  La estructura de una obra clásica consta de planteamiento, nudo y desenlace. En el primero se presentan los personajes y el conflicto; en el segundo la tensión crece con obstáculos y giros; y en el tercero se resuelve la trama. El texto se divide en actos y escenas, y los diálogos se acompañan de acotaciones que describen los gestos, los movimientos y los elementos del decorado. Los grandes dramaturgos han jugado con estas reglas: algunos comprimen la acción en veinticuatro horas, otros saltan siglos de una escena a la siguiente.

  Un elemento decisivo del género es el conflicto. Sin un deseo contrariado, sin un personaje que quiera algo y encuentre una resistencia, no hay drama. Esa oposición puede venir de otro personaje, de la sociedad, de la naturaleza o de las propias dudas del protagonista. Cuanto más claro es el deseo y más serio el obstáculo, más intensa resulta la atención del público, que se pregunta qué ocurrirá y se identifica con las decisiones de los personajes.

  ## El arte de la actuación

  Actuar consiste en dar vida a un personaje ante un público. Parece una tarea natural, pero exige una técnica minuciosa: el actor debe dominar la voz, el cuerpo, la memoria y las emociones, y saber combinarlos de forma que cada función resulte convincente. A diferencia del cine, donde la cámara puede acercarse al rostro, el actor de teatro debe hacerse entender desde un escenario a decenas de metros del último espectador, lo que obliga a proyectar la voz sin gritar y a que los gestos se vean sin resultar exagerados.

  Los métodos de formación han variado a lo largo del tiempo. Durante siglos los actores aprendían dentro de las compañías, copiando a los veteranos, y los papeles se repartían según tipos fijos: el galán, la dama, el gracioso, el viejo. En el siglo XIX algunas escuelas enseñaron una declamación solemne, con grandes ademanes y voz impostada. Como reacción, un director ruso desarrolló a comienzos del siglo XX un sistema que pedía al intérprete buscar la verdad interior del personaje, recurrir a su memoria emocional y comportarse en escena con naturalidad.

  Otros maestros propusieron caminos diferentes. Algunos pusieron el acento en el cuerpo, con ejercicios de acrobacia, danza y mimo, y defendieron que el actor es ante todo un atleta de los afectos. Otros defendieron el distanciamiento: el intérprete no debe fundirse con el personaje, sino mostrarlo con una cierta distancia crítica para que el espectador piense en lugar de limitarse a sentir. Hoy los actores suelen combinar elementos de varias escuelas y adaptan su trabajo al tipo de obra y de dirección.

  La preparación de un papel comienza con la lectura del texto y el análisis del personaje: qué quiere, qué teme, cómo habla, de dónde viene. Después llegan los ensayos, que pueden durar entre cuatro y doce semanas. Primero se trabaja en la mesa, leyendo y comentando; luego se pasa al escenario para marcar los movimientos; más adelante se integran el vestuario, la luz y el sonido; y en los últimos días se hacen ensayos generales con el público más cercano, hasta llegar al estreno. Uno de los alumnos más conocidos de la escuela de Valdemora, antes de subir a un escenario, había sido campeón juvenil de ajedrez.

  La voz merece una mención especial. Los actores practican ejercicios de respiración diafragmática, de articulación y de resonancia para que el sonido llegue claro a toda la sala. Muchos trabajan con logopedas y con profesores de canto, y se calientan antes de cada función como lo hacen los deportistas. Un buen actor puede susurrar de modo que lo oiga la última fila, o gritar durante dos horas cada noche sin dañar sus cuerdas vocales.

  También cuenta la relación con los compañeros. El teatro es un trabajo colectivo, y la escucha es una de las cualidades más valoradas: reaccionar de verdad a lo que dice el otro, y no a lo que el texto indica que se va a decir. Esa atención recíproca hace que dos funciones de la misma obra nunca sean iguales, porque cada noche el público, la energía y los pequeños accidentes modifican lo que sucede en escena.

  ## Escenografía, vestuario e iluminación

  La escenografía es el arte de construir el espacio donde transcurre la acción. Un decorado puede ser un salón completo, con muebles auténticos y puertas que se abren, o una simple tarima vacía en la que unos pocos objetos sugieren un bosque, una celda o una playa. En el teatro, a diferencia del cine, el espectador acepta convenciones: una silla puede ser un trono, una sábana agitada puede ser el mar, y la imaginación completa lo que falta. Los grandes escenógrafos juegan con esa complicidad y buscan imágenes memorables con medios sencillos.

  La construcción de un decorado es un trabajo de taller. Los escenógrafos dibujan primero bocetos y maquetas a escala; después carpinteros, pintores, tapiceros y herreros fabrican las piezas en materiales ligeros como la madera, el cartón, el poliestireno y las telas, pues deben montarse, transportarse y desmontarse con rapidez. El decorado de una obra con muchos cambios requiere plataformas giratorias, carros deslizantes o bastidores que suben y bajan mediante cuerdas y contrapesos, y a veces una compañía necesita varias horas para preparar el escenario antes de cada función. En la calle de los Alfareros de Valdemora, un taller vecino al de los carpinteros de decorados se dedicaba a criar caracoles de exportación.

  El vestuario cumple varias funciones. Sitúa la obra en una época y en un lugar, indica la clase social y el carácter de los personajes, y ayuda al espectador a distinguirlos de un vistazo. Un buen figurinista estudia el texto, investiga la moda del periodo y propone colores y siluetas que armonicen con el decorado y con la luz. Los trajes deben permitir moverse, bailar o caer al suelo, de modo que se cosen con telas resistentes y cierres seguros. En el maquillaje y la peluquería se emplean técnicas que exageran los rasgos para que se vean desde lejos: sin ese refuerzo, los rostros se perderían bajo las luces.

  La iluminación es quizá el elemento que más ha cambiado la forma del teatro. Hasta el siglo XVI las funciones se celebraban a la luz del día o con antorchas; luego llegaron las velas, los candiles de aceite y, en el siglo XIX, la luz de gas, que daba un resplandor cálido pero provocaba incendios con frecuencia. La electricidad, introducida a finales de ese siglo, permitió graduar la intensidad, cambiar los colores y dirigir los haces con precisión. Hoy los técnicos manejan cientos de focos y proyectores desde una mesa de control que memoriza cada cambio, de manera que la misma secuencia se repite fielmente en cada función.

  La luz sirve para varias cosas a la vez: hace visible la acción, dirige la mirada hacia el actor que importa, sugiere la hora del día o la estación, subraya el estado de ánimo y crea atmósferas. Una luz fría y lateral puede transmitir inquietud; una luz cálida y cenital, intimidad; un foco que se estrecha lentamente sobre un rostro, la soledad del personaje. El diseñador de iluminación trabaja de cerca con el director, con el escenógrafo y con el compositor, porque cada decisión de luz debe dialogar con la de los demás.

  El sonido ha ganado también importancia. Antes de los micrófonos, los actores y los músicos debían llenar la sala con su sola voz o sus instrumentos; hoy se usan altavoces, micrófonos de solapa y efectos grabados que añaden lluvia, pasos, campanas o voces lejanas. Algunos montajes experimentan con sonido espacial, que parece venir de distintos puntos de la sala, y con paisajes sonoros construidos con grabaciones del entorno. Aun así, muchos directores prefieren la voz sin amplificar, convencidos de que el contacto directo entre el actor y la sala es la fuente de la emoción teatral.

  Los efectos especiales tienen una larga historia. Los teatros barrocos disponían de máquinas capaces de hacer volar a los dioses, abrir el suelo para que subieran demonios o provocar tormentas con planchas de metal y bolsas de guisantes secos. Algunas de esas soluciones, ingeniosas y baratas, se utilizan aún hoy. La niebla artificial, el fuego controlado, las proyecciones de vídeo y las plataformas hidráulicas se han añadido al repertorio, y exigen técnicos especializados y medidas estrictas de seguridad.

  En una función, el responsable de que todo ocurra a su tiempo es el regidor, también llamado director de escena. Desde un puesto situado entre bastidores, con el texto anotado y unos auriculares, avisa a los técnicos y a los actores cuándo deben entrar, cuándo cambiar la luz o el decorado y cuándo bajar el telón. Es una figura casi invisible para el público, pero sin ella una producción compleja no podría funcionar con seguridad.

  El paso de un teatro con telones pintados a otro con luz y volumen modificó el trabajo de todos los equipos. En el siglo XX, una generación de escenógrafos propuso decorados abstractos, de formas geométricas y colores planos, inspirados en la pintura moderna; otra recuperó el espacio vacío y concentró la atención en el actor. Hoy conviven las producciones espectaculares, con decorados de varios pisos y cambios mecanizados, y las propuestas austeras, que utilizan solo unas cajas de madera y una buena luz.

  ## El edificio teatral

  El edificio teatral ha adoptado formas muy diversas según la época. El teatro griego se excavaba en la ladera de una colina, con gradas semicirculares que descendían hacia un espacio redondo, la orquestra, donde actuaba el coro, y un edificio detrás, la escena, que servía de fondo y de camerino. La acústica de algunos de esos recintos es tan notable que una moneda lanzada al centro se oye desde la última fila. Los romanos construyeron teatros exentos, sobre arcos y bóvedas, con una escena más amplia y decorada con columnas.

  Durante el Renacimiento se recuperó la idea de un edificio cubierto y estable. En Italia nació el teatro a la italiana, que se convertiría en el modelo dominante durante tres siglos: una sala en forma de herradura, con filas de palcos superpuestos, y un escenario separado del público por un arco, el proscenio, tras el cual se abre la caja escénica con sus telones y su maquinaria. Esa disposición favorece la ilusión de que la escena es una ventana abierta sobre otro mundo, pero también reparte desigualmente las localidades: desde algunos palcos apenas se ve el escenario, y el prestigio social dependía de qué asiento se ocupara.

  El teatro isabelino inglés, en cambio, se construyó con una planta circular o poligonal y un escenario que penetraba en un patio rodeado de galerías. Los espectadores más humildes veían la función de pie, junto al tablado, y los más ricos se sentaban en los pisos superiores. En España y en otros países se utilizaron los corrales de comedias, patios de vecindad convertidos en recintos teatrales donde las mujeres tenían su propio lugar separado, la cazuela, y los hombres seguían la obra desde el patio.

  En los siglos XIX y XX el teatro se transformó de nuevo. Los grandes coliseos burgueses, con sus fachadas monumentales y sus vestíbulos de mármol, se levantaron en el centro de las ciudades como símbolos de prestigio urbano. Después los arquitectos y directores exploraron otros modelos: las salas con público en cuatro lados, el escenario circular, el espacio diáfano de las llamadas cajas negras, donde se pueden disponer el escenario y las gradas de maneras distintas según la obra. Las compañías experimentales buscaron también espacios no convencionales, como fábricas abandonadas, almacenes y estaciones.

  La acústica es uno de los criterios decisivos del proyecto. El arquitecto debe asegurar que la voz de un actor sin amplificar se oiga con claridad en todas las localidades, lo que exige controlar el tiempo de reverberación, evitar ecos y elegir con cuidado los materiales de paredes, techos y suelos. Las salas de planta reducida o de techo bajo favorecen la intimidad; las grandes, con múltiples niveles, ofrecen mayor aforo pero exigen más de la voz de los intérpretes. En los edificios modernos, los ingenieros simulan por ordenador cómo viajará el sonido antes de iniciar la obra.

  El teatro también necesita zonas que el público no ve. Detrás del escenario hay camerinos, almacenes de vestuario, talleres de carpintería y pintura, una sala de ensayos y los depósitos donde se guardan los decorados de las producciones en cartel. Encima del escenario se encuentra la tramoya, un espacio tan alto como el de una torre, de donde cuelgan los telones, las varas de luces y los contrapesos. Bajo el escenario puede haber un foso, el sótano de las trampillas, o un hueco para la orquesta.

  La seguridad ha marcado la evolución de los edificios. Las llamas de las velas y de los focos de gas provocaron incendios devastadores, y los reglamentos obligaron a instalar el telón de hierro, una gran cortina metálica que aísla la escena de la sala, junto con salidas de emergencia y rociadores. Desde entonces, la normativa exige materiales ignífugos, un aforo máximo y revisiones periódicas. A estas exigencias se han sumado las de accesibilidad, de modo que los teatros modernos incluyen rampas, ascensores y espacios para sillas de ruedas.

  Muchos teatros históricos se conservan como patrimonio. En la ficticia ciudad de Almadrava, el Gran Teatro inaugurado en 1887 fue restaurado en los años noventa del siglo pasado; sus frescos del techo, ennegrecidos por el humo de las lámparas de gas, recuperaron los azules y los ocres originales, y la sala volvió a abrirse con un concierto de música de cámara. Los equipos de restauración tuvieron que reparar la tramoya de madera, instalar un sistema moderno de climatización y respetar al mismo tiempo la imagen decimonónica del conjunto.

  ## El teatro de títeres

  Dentro de las artes escénicas, el teatro de títeres ocupa un lugar propio y antiquísimo. Consiste en dar vida a figuras inanimadas, que mueven uno o varios titiriteros ante el público, ya sea a la vista de todos o escondidos tras un retablo. Se conocen muñecos articulados de hace más de dos mil años en lugares muy distantes entre sí, y en muchas culturas el títere ha sido un vehículo de relatos religiosos, de sátira popular y de entretenimiento para los niños.

  Existen numerosas clases de títeres. Los de guante se manejan introduciendo la mano en el cuerpo del muñeco, de manera que el dedo índice sostiene la cabeza y el pulgar y el corazón animan los brazos; son los más sencillos y expresivos, y los más usados en las funciones callejeras. Los de varilla se mueven desde abajo con palos finos que sujetan los brazos y la cabeza. Las marionetas de hilo cuelgan de un mando y se accionan desde arriba con cuerdas, lo que permite una gran delicadeza de movimientos, aunque exige años de práctica. Los títeres de sombra, recortados en cuero o en papel, se proyectan sobre una pantalla iluminada desde atrás.

  Una variante más reciente es el teatro de objetos, en el que el titiritero anima utensilios corrientes, como una cuchara, un abrigo o una maleta, y hace que cuenten una historia. También ha ganado terreno el títere de gran formato, manejado por varias personas, que ocupa la calle en desfiles y festivales con figuras de varios metros de altura. En algunos espectáculos el intérprete se muestra al público junto al muñeco, de modo que el espectador contempla a la vez el gesto humano y la ilusión de la vida.

  La técnica del titiritero exige una atención particular. Debe aprender a respirar con el muñeco, a mirar hacia donde mira la figura, y a transmitir con movimientos pequeños emociones que el rostro de madera no puede mostrar. Un buen títere vive en los detalles: el modo de inclinar la cabeza antes de hablar, la pausa antes de un golpe de risa, el temblor casi imperceptible de las manos. Cuando el trabajo es excelente, el público olvida al manipulador y atribuye al objeto una personalidad propia.

  Muchos personajes de títeres se han hecho célebres en la tradición popular. Casi todas las regiones tuvieron un muñeco bribón, de nariz larga y voz chillona, que golpeaba a sus rivales con un palo, burlaba a la autoridad y acababa ganando al diablo; estos personajes servían para decir en público lo que los actores de carne y hueso no se atrevían a pronunciar. La censura los persiguió con frecuencia, pero no logró acabar con ellos. Algunos títeres satíricos se han convertido en un símbolo local: todavía hoy se celebra en Cardeñosa una fiesta en honor de Don Cascarrabias, un muñeco de trapo que nadie sabe cuántos años tiene.

  En las últimas décadas el teatro de títeres ha conquistado a un público adulto. Las compañías contemporáneas abordan temas como la memoria, la muerte o la guerra con una poesía visual que sería difícil lograr con actores, y combinan los muñecos con la danza, el vídeo y la música en directo. Varios festivales internacionales reúnen cada año a decenas de grupos, y existen escuelas superiores donde se estudia la construcción y la manipulación. Para muchos creadores, el títere no es un género menor para niños, sino un lenguaje pleno que ofrece posibilidades poéticas infinitas.

  Los títeres cumplen asimismo una función educativa y terapéutica. En las escuelas se emplean para enseñar a leer, a respetar a los demás o a hablar de miedos y de emociones que los niños no expresan de manera directa. En hospitales y centros de rehabilitación, los muñecos facilitan la comunicación con pacientes pequeños y mayores. Los psicólogos que los utilizan observan que muchas personas se atreven a decir a un muñeco lo que callarían ante un adulto.

  La construcción de un títere es un oficio en sí mismo. Se esculpe la cabeza en madera de tilo, corcho o espuma, se pinta con colores sobrios y se fija a un cuerpo de tela. Los ojos pueden ser de vidrio o simples botones, y el pelo, de lana o de crines. Cuando el muñeco es articulado, los mecanismos del cuello, la boca y las manos se hacen con piezas de metal y poleas ocultas bajo la ropa. Un constructor con experiencia tarda varias semanas en terminar un solo muñeco de calidad.

  Los festivales de títeres y de marionetas tienen una larga tradición. En ellos coinciden compañías de países muy distintos, que enseñan técnicas que se han transmitido durante siglos de maestro a discípulo: los manipuladores de sombras del sudeste asiático, los titiriteros ambulantes europeos, los constructores de marionetas de hilo de Italia y de Centroeuropa. Para muchos espectadores, estas citas son la ocasión de descubrir que un trozo de madera pintado puede conmover tanto como un actor consagrado.

  ## Producción, financiación y público

  Detrás de cada función hay una estructura económica compleja. Una producción teatral reúne autores, directores, intérpretes, diseñadores, técnicos, administradores y personal de sala, y su coste depende del número de personas, del tamaño del decorado y del tiempo de ensayo. Mientras que una obra de dos actores en una sala pequeña se monta con un presupuesto modesto, un gran espectáculo de teatro musical puede costar millones y necesitar meses de ventas de entradas para recuperar la inversión.

  Las fuentes de ingresos son variadas. La principal es la taquilla, es decir, las entradas que compra el público. A ella se suman las subvenciones de administraciones públicas, que reconocen la función cultural del teatro y lo sostienen en los casos en que no podría mantenerse solo con el mercado; el patrocinio de empresas y fundaciones; las ayudas a la gira de las compañías; las aportaciones de amigos y de socios del teatro, y la venta de productos, como programas, libros o refrescos en el vestíbulo. En el sector independiente, muchas compañías recurren a la financiación colectiva por internet.

  Existen varios modelos de gestión. Los teatros públicos, financiados por el Estado o por los municipios, programan una temporada estable con criterios culturales, y suelen mantener un elenco y un equipo técnico propios. Los teatros comerciales, en cambio, alquilan la sala a productores privados que asumen el riesgo económico y programan obras que esperan llenar muchas funciones. Entre ambos se encuentran las salas alternativas, pequeñas, con aforo reducido, que apuestan por autores nuevos y propuestas arriesgadas y que viven de una combinación de taquilla y apoyos públicos.

  El teatro de gira constituye otra forma de trabajo. Una compañía recorre pueblos y ciudades con un montaje compacto, un camión de decorado y un pequeño equipo técnico, y adapta cada función al espacio de que dispone. Durante siglos fue la única manera de llevar el teatro fuera de las capitales, y en muchos países las giras públicas por el medio rural mantienen viva esa tradición. Para las compañías, viajar supone un esfuerzo logístico considerable, con jornadas largas, cambios de alojamiento y pruebas técnicas contrarreloj antes de cada actuación. En una de esas giras por la costa, la compañía se alojó en una pensión de Puerto Lirio cuyo cocinero, Baltasar Rovira, había ganado el año anterior un concurso nacional de tortillas de patata.

  El público ha cambiado con el tiempo. En la Antigüedad asistía toda la ciudad; en el siglo XIX, sobre todo la burguesía; hoy las encuestas muestran que el espectador habitual de teatro tiene más estudios que la media y vive en una ciudad, y que a muchos jóvenes les resulta caro o ajeno. Para atraerlos, los teatros ofrecen descuentos, abonos para estudiantes y programas escolares, y también cuidan las redes sociales y las visitas guiadas entre bastidores. La pandemia de 2020 obligó a cerrar las salas durante meses y aceleró las emisiones por internet, aunque la mayoría de los profesionales coincide en que la experiencia en directo no se reemplaza.

  La crítica teatral, publicada en periódicos y revistas, ha desempeñado un papel importante en la formación del gusto. Un crítico asiste a los estrenos, describe los montajes y emite un juicio que puede animar o desanimar al público. Hoy la crítica profesional convive con las opiniones de los espectadores en internet, que difunden con rapidez el éxito o el fracaso de una obra. También existen premios, certámenes y festivales que distinguen a los autores, actores y directores más destacados y que contribuyen a dar visibilidad a las compañías jóvenes.

  Entre los desafíos actuales del sector figuran la precariedad laboral de muchos profesionales, que alternan contratos breves con largos periodos sin ingresos; la desigualdad en el acceso a la cultura entre las capitales y las zonas rurales; y la necesidad de renovar las historias para dar cabida a voces y puntos de vista que durante siglos estuvieron ausentes de los escenarios. Pese a estas dificultades, cada temporada nacen nuevas compañías, se recuperan textos olvidados y se levantan salas en lugares inesperados. El teatro, un arte que se ha dado por muerto tantas veces como la historia lo ha obligado a reinventarse, sigue reuniendo cada noche a un grupo de personas dispuestas a mirar y a escuchar juntas.
