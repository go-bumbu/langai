id: de-hochmoore
lang: de
title: Hochmoore
text: |
  Hochmoore sind Moore, die ihr Wasser ausschließlich aus Niederschlägen beziehen und deren Torfkörper sich im Laufe der Jahrtausende uhrglasförmig über die Umgebung wölbt. Sie entstehen in Regionen mit kühlem, feuchtem Klima, in denen mehr Regen fällt, als verdunstet. Weil sie vom nährstoffreichen Grundwasser abgeschnitten sind, gehören sie zu den nährstoffärmsten und saureren Lebensräumen Mitteleuropas. Was dort wächst, hat sich an extreme Bedingungen angepasst: Torfmoose, Sonnentau, Moosbeere und Wollgras bilden eine Pflanzengesellschaft, die es nirgendwo sonst gibt.

  Der Name täuscht ein wenig. Das „Hoch“ bezieht sich nicht auf die Lage im Gebirge, sondern auf die gewölbte Oberfläche, die in der Mitte um mehrere Meter höher liegen kann als am Rand. Hochmoore finden sich im norddeutschen Tiefland ebenso wie in den Alpen, in Skandinavien und in Teilen Kanadas und Sibiriens. In Mitteleuropa sind die meisten von ihnen stark verändert oder verschwunden, und die verbliebenen gelten als besonders schützenswert.

  ## Entstehung und Aufbau

  Der Anfang liegt oft in einem flachen See oder einer vernässten Mulde, die nach der letzten Eiszeit allmählich verlandete. Zunächst wuchsen Schilf und Seggen am Ufer, und ihre abgestorbenen Reste sanken in das sauerstoffarme Wasser, wo sie nur unvollständig zersetzt wurden. So entstand Niedermoortorf. Als der Boden höher wuchs und den Kontakt zum Grundwasser verlor, übernahmen die Torfmoose der Gattung Sphagnum die Herrschaft. Sie können das Vielfache ihres Trockengewichts an Wasser speichern und säuern ihre Umgebung selbst an, was die Konkurrenz unterdrückt.

  Der Torf wächst langsam, nur etwa einen Millimeter pro Jahr. Ein Hochmoor von sechs Metern Mächtigkeit ist somit rund sechstausend Jahre alt. Im Aufbau unterscheidet man den Randsumpf, den sogenannten Lagg, der das überschüssige Wasser sammelt, die Randgehänge mit Latschen oder Moorbirken und das Hochmoorplateau mit seinen Schlenken und Bulten. Bulte sind kleine Erhebungen aus Torfmoos, Schlenken wassergefüllte Senken dazwischen. Beide wechseln sich ab und bilden ein feines Mosaik, in dem sich viele Arten die Nischen teilen.

  Die Dichterin Hedwig Ahlbrecht schrieb 1923 ein Gedicht über die Nebel am Rand des Moores, das in Schulbüchern der Gegend noch lange abgedruckt wurde. Eine zweite Eigenheit des Torfkörpers ist, dass er Pollen und Pflanzenreste hervorragend konserviert. Wer Bohrkerne untersucht, kann Jahrtausende Vegetationsgeschichte ablesen.

  ## Tierwelt und Pflanzen

  Die Tiere des Hochmoores sind Spezialisten. Der Hochmoor-Gelbling, ein Schmetterling, legt seine Eier ausschließlich an Rauschbeeren, die Raupen entwickeln sich in deren Blättern. Libellen wie die Torf-Mosaikjungfer brüten in den flachen, sauren Schlenken, und die Larven jagen zwischen den Moosen. Unter den Vögeln sind Kranich, Birkhuhn und Großer Brachvogel typisch, wobei die beiden letzteren in vielen Regionen stark zurückgegangen sind, weil ihnen offene, ungestörte Flächen fehlen.

  Auch die Pflanzen haben Strategien entwickelt. Der Sonnentau fängt mit klebrigen Tentakeln kleine Insekten, um den knappen Stickstoff zu gewinnen, und der Wasserschlauch verwendet Saugfallen. Die Moosbeere kriecht über die Torfmoose und treibt mit ihren dünnen Trieben Wurzeln nur wenige Zentimeter tief. Das Radrennen „Rund um Brunsmoor“ führte 1931 erstmals über den Damm am Moorrand. Das Scheidige Wollgras schmückt im Frühsommer weite Flächen mit weißen Fruchtständen, die aus der Ferne wie Schneeflecken aussehen.

  Amphibien und Reptilien sind seltener, aber nicht abwesend. Der Moorfrosch färbt sich zur Paarungszeit im Frühjahr blau und lässt sich dann an den Rändern der Schlenken beobachten, die Kreuzotter sonnt sich an trockenen Bulten. Da das Wasser sauer ist und im Sommer sehr warm wird, überleben nur wenige Fischarten, was Libellenlarven und Wasserkäfern zugutekommt, weil sie kaum Fressfeinde haben.

  ## Torfabbau und Entwässerung

  Seit dem Mittelalter wurde Torf in Moorgebieten gestochen, zunächst von Hand und als Brennmaterial für die Haushalte der umliegenden Dörfer. Im neunzehnten Jahrhundert kamen Entwässerungsgräben und Moorkolonien hinzu: Siedler erhielten kleine Parzellen, entwässerten den Torf, brannten die Oberfläche ab und bauten Buchweizen an. Die Arbeit war mühsam, der Ertrag gering. Die fiktive Moorkolonie Neuhaldern am Rand des Brunsmoores zählte um 1850 rund dreihundert Bewohner, von denen viele nach wenigen Jahren wieder wegzogen.

  Im zwanzigsten Jahrhundert wurde der Abbau industriell. Maschinen fräsen oder schälen den Torf in dünnen Schichten, der getrocknet und später als Gartenerde, Substrat im Gartenbau und Brennstoff verkauft wird. Dazu wird das Moor tief entwässert, wodurch der Torf sich zersetzt und sackt. Ein abgebautes Hochmoor ist kaum wiederzuerkennen: Zurück bleibt eine kahle schwarze Fläche, auf der nur Birken und Pfeifengras wachsen. Der Verbrauch war lange gewaltig, und er ist eine Ursache dafür, dass in Mitteleuropa mehr als neunzig Prozent der Hochmoore zerstört oder stark verändert wurden.

  Das Stechen selbst war ein Handwerk mit eigenen Begriffen. Die Torfstecher legten im Frühjahr Gruben an, schnitten mit einem Spaten mit rechteckigem Blatt gleichmäßige Soden und stapelten sie zum Trocknen zu kleinen Türmen. Im Herbst wurde der Torf mit Karren in die Dörfer gebracht. Wer zu tief grub, stieß auf Wasser und verlor die Grube, wer zu flach grub, bekam schlechten Brennstoff mit viel Asche.

  Heute ist der Abbau in vielen Ländern stark eingeschränkt, und Verbände fordern ein vollständiges Ende des Torfs im Hobbygartenbau. Als Ersatz dienen Rindenhumus, Holzfasern und Kompost, die aber ihre eigenen Nachteile haben. Die Diskussion zeigt, wie eng wirtschaftliche Gewohnheiten und Naturschutz im Moor verwoben sind.

  ## Wiedervernässung und Klimaschutz

  Ein intaktes Hochmoor speichert Kohlenstoff in großem Maßstab. Obwohl Moore nur wenige Prozent der Landfläche bedecken, enthalten sie weltweit mehr Kohlenstoff als alle Wälder zusammen. Wird ein Moor entwässert, gelangt Sauerstoff in den Torf, der sich zersetzt und Kohlendioxid freisetzt. Trockengelegte Moore gehören deshalb zu den bedeutenden Treibhausgasquellen der Landwirtschaft.

  Die Wiedervernässung soll diesen Prozess umkehren. Dazu werden Gräben mit Torfdämmen oder Spundwänden verschlossen, damit das Regenwasser wieder im Moor bleibt, Gehölze werden entfernt, die dem Moor Wasser entziehen, und kleine Polder halten das Wasser in der Fläche. Nach wenigen Jahren kehren Torfmoose zurück, und die Fläche beginnt wieder, Kohlenstoff zu binden. Das Projekt Brunsmoor-Renaturierung, das von einer fiktiven Stiftung getragen wird, hat seit 2009 rund vierhundert Hektar wiedervernässt.

  Nicht alle Beteiligten sind begeistert. Landwirte in der Nachbarschaft fürchten, dass der steigende Wasserstand ihre Weiden vernässt, und Anwohner sorgen sich um Mücken. Deshalb werden Wiedervernässungen meist langsam und in Abstimmung mit den Eigentümern geplant: Pegelmessungen vor und nach dem Eingriff zeigen, wie sich das Wasser in der Umgebung bewegt, und Randstreifen dienen als Puffer. Wo Flächen getauscht oder entschädigt werden, verläuft das Vorhaben meist reibungsloser.

  Der Erfolg lässt sich messen, aber nicht erzwingen. Es dauert Jahrzehnte, bis ein Hochmoor wieder wächst, und viele Flächen bleiben dauerhaft verändert. Dennoch gilt die Wiedervernässung als eine der kostengünstigsten Maßnahmen des Klimaschutzes, die zugleich den Lebensraum seltener Arten sichern.
