id: en-norrland-bicycles
lang: en
title: Norrland Bicycle Works
text: |
  Norrland Bicycle Works is a fictional manufacturer of bicycles with its headquarters and main factory in the lakeside town of Hallvik. Founded in 1921 by a blacksmith named Ragnar Eskel and his two brothers, the company grew from a repair shed into one of the best-known makers of utility bicycles in the northern part of the country. Its machines are recognised by a sloping top tube, a chain fully enclosed in a steel case and a pale green paint that the firm calls fjord mist. The company employs about nine hundred people and sells around two hundred thousand bicycles a year in a dozen countries.

  The firm has built its name on durability. Norrland frames are brazed and welded by hand, tested on a vibrating rig for the equivalent of fifteen years of riding, and sold with a guarantee that, for the original owner, lasts for the life of the frame. In the past two decades the company has widened its range beyond the plain commuter bicycle to include cargo bikes, electric models and lightweight racing machines, and it has been a rare example of an old industrial firm that has changed without giving up its character.

  ## Founding and early years

  Ragnar Eskel opened his shop in 1921 in a former fish smokehouse beside the harbour at Hallvik. The region was cold, hilly and thinly populated, and the roads were poor, so the bicycles that arrived from the south were quickly damaged by gravel, mud and frost. Eskel began by repairing them, then by strengthening them with thicker tubing and wider mudguards, and finally by building his own. The first Norrland bicycle, sold in 1924 for the price of a good pair of boots, weighed almost twenty kilograms and was said to be able to carry a sack of flour and a grown man.

  The brothers worked in a division of labour that stayed in the firm for generations. Ragnar designed and brazed the frames, Tor handled the sales and the accounts, and Kjell, a gifted machinist, made the hubs and gears. By 1935 the shop had moved to a new brick building, and the company employed sixty people. Orders came from postal services, from lumber camps and from the army, all of which valued machines that could be repaired with ordinary tools.

  The Second World War brought hardship and also opportunity. Metal was rationed, and the company was told to make parts for military vehicles, but its reputation for good steel meant that when peace returned there was a long waiting list for new bicycles. In 1948 the firm introduced the Model 7, a three-speed commuter with a hub gear and a rear rack, which stayed in production with only small changes for more than forty years and sold over a million units.

  ## The Hallvik factory

  The factory at Hallvik is a long site on the shore of the lake, where several brick halls have been joined by steel walkways. Raw tubing enters at one end and finished bicycles leave at the other. Tubes are cut and mitred by computer-guided machines, but the joining of frames is still done by trained workers, who spend two years as apprentices before being allowed to work alone. The company believes that a hand-brazed lug is both stronger and more repairable than a joint pressed by machine, and uses the fact in its advertising.

  Paint is applied in a separate hall in three coats and baked at a low temperature. Wheels are built on semi-automatic benches, where a worker laces the spokes by hand and a machine tensions them, and each wheel is checked on a truing stand before it is passed on. The final assembly line produces about eight hundred bicycles a day, each one inspected and test-ridden by a member of staff on a short indoor track.

  Hallvik depends on the factory, and the factory on the town. Many families have worked there for three generations, and the company runs a small museum, a canteen open to the public and a sports hall. When the lake froze in the winter of 1963 and the main road was blocked, workers brought the finished bicycles out by sledge. The story, which is told to every new employee, is a favourite of the firm's own history.

  The footballer Dario Vellacott, who played for a nearby club, visited the plant in 1998 to receive a bicycle as a gift and was photographed with a group of apprentices. The visit is remembered locally, though the sportsman had no other link with the firm.

  ## Dealers and export markets

  Norrland sells through a network of about four hundred independent dealers, most of them small family shops that also carry out repairs. The company insists that every dealer sends a mechanic to Hallvik for a week of training every second year, and it refuses to sell online except through those shops, which collect the bicycle from the factory and assemble it for the customer. Executives argue that this keeps the quality of service high and protects a type of local business that would otherwise disappear.

  Exports began in the nineteen fifties with shipments to neighbouring countries and grew steadily during the following decades. The biggest foreign market is now the lowland country to the south, where riders appreciate a bicycle that can cope with wind and rain, followed by two island nations and a handful of cities in the far east that have taken to the Model 7 as a fashionable retro object. A joint venture with a distributor in the east, begun in 2011, assembles some low-cost models locally from frames sent from Hallvik, though the premium line is still built only at the home factory.

  Currency swings and shipping costs have made export profits uneven. In 2022 the price of steel tubing rose by almost half within a year, and the firm had to decide whether to raise prices or accept a lower margin. It chose a compromise, raising prices twice by small amounts and cutting the dividend to the foundation, a decision that was explained in an open letter to customers.

  ## Cargo bicycles

  In the early years of this century, the company noticed that its customers in cities were using the sturdy Norrland frames to carry shopping, children and tools. A small design team led by the engineer Maren Quist began work on a bicycle made for carrying. The result, launched in 2007 as the Brygge, had a long wheelbase, a low platform behind the rider and a stand that kept the load upright while it was filled. It was followed by a front-loading model with a wooden box between the handlebars and the front wheel, intended for families and small businesses.

  Cargo bicycles raise engineering problems that ordinary bicycles do not. The rider is steering a load that may weigh as much as two adults, so the frame needs to be stiff, the brakes strong and the steering stable at low speed. The company tested its designs with sandbags and with volunteers, and found that a low centre of gravity was more important than a large wheel. Hydraulic disc brakes became standard, and a locking steering damper was added to prevent the front wheel from swinging when the bicycle was parked with a heavy box.

  The market has proved larger than expected. Couriers use the machines to deliver parcels in crowded centres, florists and bakers carry stock on them, and several municipal councils in the north have bought fleets for park rangers and street cleaners. Local rules that restrict cars in old town centres have helped, and a number of cities offer a grant to anyone who replaces a second car with a cargo bike. Cargo models now make up nearly a third of the company's revenue.

  ## Electric assistance

  Norrland was slow to adopt electric motors. The founders' descendants worried that a battery would be a weak point in a machine that was meant to last a lifetime, and for years the firm only sold conversion kits made by others. In 2014, after customers kept asking and competitors had taken a share of the market, the company set up an electrical department and began to build its own system.

  The motor sits in the bottom bracket, between the pedals, where its weight is low and central, and it gives help only when the rider pedals, up to a limit of twenty-five kilometres an hour, in line with the rules of most European countries. The battery is fitted inside the down tube, protected from rain, and can be removed for charging indoors. The company designed the unit so that a customer can replace the cells, rather than discard the whole pack, and publishes repair instructions for every part.

  The electric range has made the brand attractive to older riders and to people living in hilly places such as Hallvik itself, where the steepest streets climb at one in six. Sales of electric models grew by about forty per cent a year in the first five years, and they now account for roughly half the output of the plant. The same period also brought concerns: batteries need rare materials, and the company has been criticised for slow progress in finding suppliers who could prove the origin of their cobalt. In response it set up a take-back scheme, in which old packs are collected by dealers and sent for recycling.

  ## Racing and sponsorship

  For most of its history Norrland had little to do with sport. The firm's customers were commuters, postmen and farmers, and its directors saw competition as an expensive distraction. This changed in 1979, when the young frame builder Sigrid Dahl suggested that a racing bicycle would show what the workshop could do. Her first design used thin, heat-treated steel tubes and weighed under nine kilograms.

  A semi-professional team was formed in 1983, financed jointly by the company and local businesses. Dressed in the green of the brand, it rode the national tour for the first time in 1986 and won a stage in 1991. The best result was a third place overall in 1996, achieved by the climber Anders Brolin on a day when mist filled the high passes and most of the favourites lost time on the descent.

  The racing programme has been of more use to the company's image and to its engineers than to its profits. Lessons from the team found their way into the roadgoing models: a more precise geometry, a lighter fork, and a series of aluminium and carbon frames that have since become the company's premium line. The team still exists as a development squad for young riders, and sponsors a series of amateur races around the lake that attract more than two thousand entrants each summer.

  A women's squad was added in 2004 and quickly became the more successful of the two, winning the national road title three times in its first decade. Its leader, the sprinter Ylva Marrick, helped to test a lower, shorter frame designed for smaller riders, and the geometry she preferred was later adopted for the company's range of bicycles for women and teenagers. The track and cyclo-cross programmes are smaller, but the company keeps a workshop at the velodrome in the next valley, where a mechanic prepares equipment for the juniors and young adults who race there each week.

  Sponsorship has its critics inside the firm. Some older directors argue that the money spent on race support would be better used to lower the price of the commuter models, while the marketing staff reply that the team brings customers into the shops who would otherwise never have heard of the name. The foundation has set a ceiling on the budget, a fixed share of the annual surplus, so that a bad year in the market does not force a debate about closing the team.

  ## Labour relations and ownership

  Norrland has long been known for stable relations with its employees. A works council has existed since 1946, and a profit-sharing scheme gives every worker a share of the annual surplus. In the severe recession of the early nineteen nineties, when many factories closed, the staff voted to take a temporary pay cut in exchange for a promise of no redundancies, a deal that was kept and that is still cited in business schools as an example of shared sacrifice.

  The question of ownership has been more difficult. The three brothers' families held the company until 1989, when a quarrel between cousins led to the sale of a large block of shares to an investment fund. The fund pressed for production abroad and for cuts in the range, and a campaign by workers, local councillors and customers, who wrote thousands of letters, persuaded the fund to sell again within four years. Since 1994 the firm has been held by a foundation, which owns the shares on behalf of the town and reinvests the profits in the business, in a school for apprentice builders and in local cycling paths.

  ## Design philosophy

  The company describes its approach in three words: simple, repairable, lasting. Parts are standardised across models, so that a brake lever bought in 1995 still fits a bicycle made last year. The firm resists fashion in frame shapes, and uses colours that change only once in a decade. Spare parts are kept in stock for thirty years after a model ends. This policy is expensive but has helped to create a second-hand market in which old Norrland bicycles keep much of their value.

  Critics say that the bicycles are heavy, conservative and costly. The company replies that the weight is the price of strength, and that a bicycle used for twenty years costs less per year than a cheaper one replaced every four. A report by a consumer group in 2019 supported the claim, ranking the Model 7 among the most economical bicycles to own over a long period.

  The training of apprentices is central to the arrangement. The school at the factory takes twenty-four students a year for a three-year course that combines workshop practice with lessons in metallurgy, drawing and bookkeeping. Graduates are not obliged to stay, and many go to other workshops in the region, which the foundation regards as a service to the whole trade. Some have started small firms of their own, building custom frames for touring and racing, and the older company lends them jigs and sells them tubing at cost.

  ## Cultural presence

  The Norrland bicycle has become part of the region's identity. Postage stamps have shown it, and local songs mention the sound of its bell. The 1974 film Winter Postman, a gentle comedy about a rural courier, was shot partly in Hallvik and starred a Model 7 almost as prominently as it did its human actors. The company holds an annual open day, when visitors tour the factory, ride vintage models and watch frame builders at work.

  Younger buyers value the brand for its association with slow, careful craft and for its refusal to chase every trend. As cities continue to look for ways of moving people without cars, the firm is likely to find its old virtues in demand. It has recently announced plans to double its cargo and electric production by building a second hall at Hallvik, funded from retained profits and a loan from a regional development bank.
