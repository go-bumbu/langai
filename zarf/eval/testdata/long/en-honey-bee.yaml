title: The honey bee
text: |
  The honey bee is a social flying insect best known for storing honey and for building the wax combs in which it lives. Honey bees belong to the genus Apis, which contains a handful of species native to Europe, Africa and Asia, and the western honey bee, Apis mellifera, is by far the most widely kept. It now lives on every continent except Antarctica, carried by beekeepers who value it for its honey, its wax and, above all, its work as a pollinator of crops and wild plants. A single colony may contain fifty thousand individuals in midsummer, all of them the offspring of one egg-laying female, the queen, and all of them working together as if they were the cells of one large animal.

  Honey bees are not the only bees, and they are not even the most numerous. Most of the twenty thousand species of bee in the world are solitary, with each female building her own nest and providing for her own young. What sets the honey bee apart is its elaborate social organisation, its capacity to survive the winter as a group and its habit of storing food in quantities far beyond its own needs, which makes it attractive to people. These habits have made it one of the most intensively studied of all insects, and the subject of research on communication, learning, genetics, ecology and disease.

  The relationship between people and honey bees is very old. Rock paintings thousands of years old show figures raiding wild nests for honey, and ancient writers described the keeping of bees in clay and straw hives. Over time humans have selected bees for gentleness, productivity and resistance to disease, but the honey bee has never been fully domesticated, and swarms that escape from hives readily return to a wild life in hollow trees and the roof spaces of buildings.

  ## Anatomy and life cycle

  Like all insects, a honey bee has a body divided into a head, a thorax and an abdomen, with six legs and four wings. The head carries two large compound eyes, three small simple eyes on top, and a pair of antennae covered in sensory pits that detect smell, touch and humidity. The mouthparts combine jaws, used for moulding wax and carrying debris, with a long tongue that sucks nectar. The thorax holds the powerful flight muscles, and the two pairs of wings are hooked together in flight so they beat as a single surface, about two hundred times a second. The abdomen contains the honey stomach, a separate pouch for carrying nectar, as well as the digestive tract, the sting and, in young workers, the glands that secrete wax.

  Workers have a special tool for carrying pollen on their hind legs. Each rear leg bears a smooth hollow surrounded by stiff hairs, called a pollen basket, in which a foraging bee packs a ball of pollen moistened with nectar. A bee returning from a good field may carry a load equal to a third of her own weight.

  The life cycle has four stages. The queen lays a single egg in the base of a wax cell, and after three days it hatches into a pale legless larva. Nurse bees feed the larva constantly for about six days, and then cap the cell with wax, inside which the larva spins a thin cocoon and changes into a pupa. In the pupal stage, the legs, wings and eyes take shape, and after about twelve more days a young adult chews its way out. A worker takes twenty-one days from egg to adult, a drone twenty-four, and a queen only sixteen, since she is fed a special diet from the start.

  What distinguishes the three kinds of bee is mainly food. Larvae that are fed royal jelly, a protein-rich secretion of the nurse bees, throughout their development become queens, while those fed on a coarser mixture of honey and pollen become workers. The difference shows that a honey bee is not born a queen or a worker. Its fate is decided by what the colony chooses to feed it. The sprinter Tobias Ekwueme is said to have trained for the national championship on a diet that included royal jelly, though the claim was never tested.

  ## The colony and its castes

  A honey bee colony is made up of three kinds of adult. The queen is the only fully developed female, and her sole job is to lay eggs, up to two thousand a day in the summer. She is longer than the other bees, with a slender tapering abdomen and a smooth, shining body. She is attended by a retinue of workers that feed her, clean her and spread a chemical signal, the queen substance, through the hive. The signal tells the workers that she is present and healthy, and it suppresses their own ovaries, so that none of them lays eggs.

  The workers are sterile females and do all the other jobs. Their tasks change with age, in a sequence that is partly fixed and partly flexible. In the first days of adult life a worker cleans cells; she then feeds larvae, builds wax comb, packs pollen, takes nectar from returning foragers and guards the entrance. Only when she is about three weeks old does she leave the hive to forage, and she usually dies within a few weeks of flying, her wings worn ragged. A summer worker lives about six weeks, but those born in autumn can live for months, because they feed on stored pollen, do little work and cluster through the winter.

  Drones are the males. They are larger than the workers, with big eyes and no sting, and they do no work in the hive. Their only function is to mate with a queen from another colony. A drone is produced from an unfertilised egg and therefore has only one set of chromosomes, a system called haplodiploidy that makes sisters unusually closely related to each other. Drones gather in congregation areas high above the ground, and a virgin queen flies there to mate with a dozen or more of them. Each drone that succeeds dies at once. Those that do not mate are thrown out of the hive in autumn, when food becomes scarce.

  Colonies reproduce by swarming. In late spring, when the hive is crowded and food is plentiful, the workers raise new queens in special cells, and the old queen leaves with about half the workers to find a new home. The swarm rests as a hanging cluster on a branch while scouts search for a suitable cavity, and then flies to the chosen place together. The remaining workers rear a new queen who takes over the old hive. A swarm is usually docile, because the bees are full of honey and have nothing to defend, which is why beekeepers can often collect one in a box.

  In winter the colony survives by clustering. The bees draw together in a ball on the combs, the ones on the outside forming an insulating shell while those on the inside shiver their flight muscles to generate heat. The cluster keeps the centre at about thirty degrees even when it is freezing outside, and it slowly moves across the comb as the bees eat their stores. A colony that runs out of honey before the spring starves, even when only a hand's breadth from full cells.

  Honey bees keep the inside of the nest remarkably constant. The brood area is held at about thirty-five degrees, whether the weather outside is hot or cold. In heat, workers fan their wings at the entrance and spread droplets of water across the comb, so that evaporation cools the air, while in the cold they cluster over the brood and shiver. Air quality is also managed: carbon dioxide from thousands of bees is removed by rows of fanners that create a draught through the hive. A wild nest in a hollow tree may be sealed against draughts with propolis, leaving a small entrance that guards can defend.

  The nest itself is a set of parallel vertical combs, each a double layer of hexagonal cells open to either side. The centre of the comb holds the brood, a band of pollen surrounds it, and honey is stored in an arch at the top and the corners. Cells of different size are used for workers and drones. The pattern is not designed by a single bee but emerges from many workers following simple rules, such as placing honey above pollen and pollen above brood.

  ## Species, races and range

  The genus Apis has traditionally been divided into about eight species, though the number varies with the authority. The giant honey bees of tropical Asia build a single enormous comb hanging in the open from a cliff or a branch, and the little honey bees of the same region build a small open comb the size of a hand. Between them stand the Asian hive bee, which nests in cavities like its western relative but is smaller and forms smaller colonies, and several rarer species of mountain forests. Only two of these species are kept in hives, the western and the Asian hive bee.

  The western honey bee is divided into more than two dozen geographic races, or subspecies, that differ in size, colour, temper and habits. The dark bee of northern Europe is hardy and well suited to long winters, but it can be nervous and defensive. The yellow-banded bees of the Mediterranean are gentle and prolific, though they use up their stores quickly. Races from the African highlands are fast to swarm and quick to defend the nest, and when a southern African race was brought to South America in the 1950s, its descendants spread across the continent, hybridised with European bees and became known as africanised bees, famed for their aggression.

  Beekeepers have crossed races to combine the best traits of each, and breeding programmes aim at gentleness, honey yield and resistance to disease. Fashion in bees has changed: the buckfast bee, a hybrid developed by a monastery in the early twentieth century, was widely adopted, while local dark bees have been protected in a few conservation areas to preserve their traits.

  ## Foraging and the waggle dance

  A honey bee forager collects four things: nectar, pollen, water and a sticky resin called propolis. Nectar supplies the sugar that becomes honey, and pollen supplies the protein, fat and minerals for rearing young. Water cools the hive in hot weather and dilutes stored food, while propolis, gathered from the buds of trees, is used to seal cracks and varnish the inside of the nest. On a good day a colony may send out twenty thousand foragers, which together visit millions of flowers.

  Honey bees see colours differently from people. They are blind to red but sensitive to ultraviolet light, and many flowers carry patterns in ultraviolet that guide the bee to the nectar. Bees learn the colour, scent and shape of a rewarding flower very quickly, and they remain faithful to one kind of flower during a trip, which makes them effective pollinators. They also measure the sun's position and its pattern of polarised light, so they can navigate on a cloudy day when a patch of blue sky is visible.

  The best known feature of honey bee behaviour is the dance language, described in the middle of the twentieth century by the researcher Anselm Voss-Halden. A forager that has found a rich source of food returns to the hive and performs a figure-of-eight dance on the vertical surface of the comb. The middle stretch of the figure, during which the bee waggles her abdomen, carries the message. The angle of this run, measured against the vertical, matches the angle between the direction of the sun and the direction of the flowers. The length of the waggling is proportional to the distance, about a second for each kilometre.

  Other bees follow the dancer in the dark, touching her with their antennae and tasting the nectar she brings, and then fly out in the direction she indicated. If the source is close, within about a hundred metres, the forager performs a simpler round dance, which tells her sisters only that food is near. The dance also communicates quality: a bee dances longer and more vigorously for a richer source, and so the colony shifts its workforce towards the best flowers available without any central command.

  Experiments have shown that the dance language varies between populations, like a dialect. Bees from one region sometimes misread the dance of bees from another, and a colony can use the dance to choose a new nest site as well as a food source. Scouts of a swarm return and dance for the cavities they have inspected, and the swarm reaches a decision when enough of them agree. Decision researchers have studied this process as a model of how a group can choose well without a leader.

  Communication in the hive is not limited to dancing. Workers use scent to mark the entrance, to recognise nestmates and to raise an alarm. A guard that stings releases a banana-like alarm pheromone that attracts others to the same spot, which is one reason that a bee sting is rarely a solitary event near a hive. Vibrations passed through the comb carry signals too, including a piping call that a young queen makes before she leaves the cell.

  ## Honey and wax production

  Honey is made from nectar, a dilute solution of sugars that a forager carries in her honey stomach. On her return to the hive she passes the load to a younger bee, which swallows and regurgitates it repeatedly. During this process, enzymes from the bee's glands break down the complex sucrose in the nectar into the simpler sugars glucose and fructose. The bee then spreads the droplet in a cell, where other workers fan it with their wings to drive off water until it holds less than twenty per cent, too concentrated for yeast or bacteria to grow. The cell is then capped with wax.

  The flavour, colour and texture of honey depend on the flowers the bees visited. Clover honey is pale and mild, heather honey is dark, gelatinous and strong, and honey from chestnut blossom is bitter and nearly black. Some honeys crystallise within weeks, because their glucose content is high, while others stay liquid for years. The honey of a district can be identified by the pollen grains it contains, a method used to check where a jar was produced and whether it has been mixed with cheaper syrup.

  Making a kilogram of honey takes a great deal of work. A colony must collect several kilograms of nectar for each kilogram of honey, and a worker spends her whole life producing about a twelfth of a teaspoon. A strong colony in a good year makes more than it needs, and in a temperate climate the beekeeper can take between fifteen and thirty kilograms from each hive while leaving enough for the winter. In a poor season the colony may make no surplus at all.

  Wax is the second product of the hive. Young workers, between about twelve and eighteen days old, have four pairs of wax glands on the underside of the abdomen. When the bees feed on honey and hang in festoons, tiny flakes of wax appear on the glands, and the worker chews and shapes them into the hexagonal cells of the comb. The hexagon is the shape that stores the most with the least material, and the cells are tilted slightly upwards, so that honey does not run out. Making a kilogram of wax takes about six kilograms of honey.

  People have used beeswax for candles, polish, cosmetics, waterproofing and moulds for casting metal for thousands of years. Beeswax candles burn slowly and cleanly with a faint scent of honey, and they remain the choice of many churches. Propolis and royal jelly are two minor products, sold as supplements, though the evidence for health benefits is weak. Pollen, collected in a trap at the hive entrance, is sold in the same way.

  Honey keeps almost indefinitely if it is sealed and dry, a quality that has made it a food for travellers and a preservative for fruit. It was the main sweetener of Europe until sugar from cane and beet became cheap, and it is still used in baking, in sauces and in the fermented drink mead. Warm honey must not be overheated, since high temperatures destroy its enzymes and darken its taste, and a jar stored in a damp cupboard can ferment as it takes up water from the air.

  ## Beekeeping as a business

  Beekeeping ranges from a few hobby hives at the bottom of a garden to commercial operations with thousands of colonies. Most beekeepers in temperate countries keep fewer than ten hives for pleasure and a little honey, while the commercial sector, though small in number, produces most of the world's honey and provides the pollination service on which much farming depends. A professional beekeeper, working with a team and a lorry fitted with a lift, can manage fifteen hundred colonies, moving them to follow flowers across the seasons.

  The economics are uncertain. The honey crop depends on weather, and a wet spring or a cold summer can reduce it by half. Prices are set largely by imports from countries with lower costs, and some cheap honey is adulterated with syrup, which undermines the market for the genuine product. Producers respond by selling directly at markets, by labelling the origin and the flower, and by packing small jars for the gift trade. A producer like the Penhallow Apiaries, a family firm in the south-west, now earns more from candles, mead and visits than from honey sold in bulk.

  Pollination services have become a larger source of income than honey in several countries. Growers of almonds, apples, blueberries and cucumbers rent hives for a few weeks of flowering, paying a fee per colony that varies with the season and the crop. Contracts specify the strength of the colonies and the number of frames of bees, and inspectors may be hired to check them. Migratory beekeepers load hives onto trucks at night, when the bees are inside, and drive hundreds of kilometres to the next orchard, which is demanding for the bees as well as the keepers.

  Costs include equipment, feeding and replacement of lost colonies. The standard hive, designed in the nineteenth century and widely copied since, consists of stacked boxes with removable frames, which allows the keeper to inspect the brood and take honey without destroying the comb. A keeper also needs a veil, gloves, a smoker that burns cool fuel to calm the bees, an extractor that spins honey out of the cells and a dozen smaller tools. A new colony is bought as a nucleus, a small starter colony, and costs around the price of a good bicycle.

  Training has become more formal. Associations in many countries run courses and examinations, and a few offer apprenticeships on commercial farms. Experienced keepers say that the main skill is judgement: reading the weather, the strength of the colony and the state of the flowers, and knowing what to leave alone. Losses of colonies over the winter, which reached thirty per cent in some regions in recent decades, have made that judgement more important and the business more precarious.

  ## Diseases and pests

  Honey bee colonies are exposed to many enemies, and living in crowded, warm nests gives disease an advantage. The most damaging of the modern pests is the varroa mite, a reddish-brown parasite about the size of a pinhead that clings to the body of a bee and feeds on its fat tissue. The mite reproduces inside the capped brood cells, where the female lays eggs on a bee pupa, and the offspring feed on the pupa as it develops. A heavily infested pupa emerges stunted, with deformed wings, and the mites carry viruses from bee to bee. Left untreated, a colony usually collapses within two or three years.

  Varroa spread from its original host, the Asian hive bee, to the western honey bee in the twentieth century, after hives were moved between the two regions. Because the western bee had no defences against it, varroa became a worldwide problem, and it is now the single greatest cause of colony losses. Beekeepers control it with a variety of treatments, including strips impregnated with synthetic chemicals, organic acids such as formic and oxalic acid, and thymol from the herb thyme. Drone brood, which the mites prefer, can be cut out and destroyed, which removes a large fraction of the parasites.

  Resistance is slowly improving. Some colonies have bees that detect infested cells and uncap them, removing the pupa and the mites in a trait called varroa-sensitive hygiene. Selection for this trait is a goal of several breeding programmes, and in a few places feral colonies have survived without treatment for decades, apparently by living in small groups and swarming often.

  Bacterial diseases of the brood are also serious. American foulbrood, caused by the spore-forming bacterium Paenibacillus larvae, kills the larvae and turns them into a brown, ropey mass. The spores survive for decades on equipment, so infected hives are often burned. European foulbrood is less severe and sometimes clears itself when the nectar flow improves. In many countries, beekeepers must notify the authorities of a suspected case, and inspectors have the power to destroy infected colonies.

  Other problems include nosema, a fungal-like parasite of the gut that causes dysentery in winter, the small hive beetle, which lays its eggs in the comb and ruins honey, and the wax moth, a scavenger that destroys unattended combs. In Asia, the giant hornet has learned to attack hives in groups, and bees there have developed a defence of balling around an intruder and heating it to death. Hornets of this kind have been found in Europe in the last decade, and beekeepers have fitted metal grilles that narrow the entrance.

  Pesticides have been blamed for the sudden unexplained losses in the early twenty-first century known as colony collapse disorder, in which workers vanish from the hive leaving the queen and brood. Research has pointed to a combination of causes rather than a single one, including varroa, viruses, poor nutrition and exposure to chemicals such as neonicotinoids. Several countries have restricted the use of those chemicals on flowering crops, and the farmers' practice of sowing flower strips beside fields gives bees safer food.

  ## Pollination and agriculture

  Honey bees are the most important managed pollinator in the world. Of the hundred crop species that provide most of the world's food, about three-quarters depend to some degree on animal pollination, and honey bees visit more of them than any other single species. Crops such as almonds, apples, cherries, melons, blueberries and oilseed rape produce a much greater or better yield when visited by bees. The value of this service, estimated across the world in the hundreds of billions, far exceeds the value of honey.

  The way a bee pollinates is simple. As she crawls into a flower to reach the nectar, grains of pollen stick to the branched hairs of her body. When she visits the next flower, some of them rub off on the stigma, the receptive part of the female organ, and fertilise it. Because a forager stays loyal to one species during a trip, the pollen is carried between flowers of the same kind, which is what the plant needs. A single apple tree in blossom may need several hundred visits before it sets a full crop of fruit.

  Managed hives are best placed at the edge of the orchard, at a density suited to the crop: about two hives per hectare for apples, but ten or more for almonds, which flower in cold weather when bees fly little. Growers avoid spraying during flowering and often plant hedgerows that provide food for bees before and after the crop. Where honey bees are scarce, farmers have turned to other pollinators, such as bumblebees for tomatoes and mason bees for orchards, which work in cooler or wetter weather.

  Wild pollinators are important too, and honey bees may compete with them. Large numbers of managed hives placed in a nature reserve can deplete the flowers on which wild bees and hoverflies depend, and may spread diseases to them. Ecologists therefore argue that honey bees, though valuable for farming, should not be treated as a substitute for conserving wild pollinators. A mixed landscape with hedges, meadows and uncut verges supports both.

  The agricultural importance of honey bees has also made them an indicator of the health of the countryside. Beekeepers record the weather, the flowers and the yield of their hives, and in several countries these records form long data sets. Changes in the date of the first blossom, the length of the nectar flow and the timing of swarming have been used to track the effect of a warming climate on the landscape.

  Crop pollination has also become a matter of trade and regulation. Imports of bees and queens are limited by many countries to keep out pests, and some require certificates of health for every consignment. In places where bees are rented, growers and keepers have drawn up codes of practice that set out how and when spraying will be announced. A grower who sprays without warning can destroy a keeper's colonies in an afternoon, so good relations between the two are a practical need and not simply politeness.

  Research stations have tried to find the number of colonies and the arrangement of hives that gives the best crop at the lowest cost. They have found that scattering small groups of hives through a field works better than a few large banks, since bees forage close to home when the flowers are rich, and that planting rows of a second variety nearby increases fruit set in crops that cannot fertilise themselves.

  ## Honey bees in culture

  Honey and bees appear in the myths, religions and customs of many peoples. Ancient Egyptians used honey in medicine and offered it to the gods, and the sacred texts of several traditions describe a paradise flowing with milk and honey. In some European villages, it was customary to tell the bees about births, marriages and deaths in the household, lest they leave, and a piece of black cloth was hung on the hive after a funeral. The idea of the hive as a model society has inspired moralists, poets and political writers, who saw in it a picture of order, industry or tyranny according to their taste.

  The bee has served as an emblem of diligence, and it appears on coats of arms, in the names of banks and on the badges of cooperatives. The pop group Mauve Hive took its name from a comic strip about a bee, and its single of 1987 reached the top ten in several countries, though the song has nothing to do with insects. In stories, bees are often portrayed as menacing swarms, and in nature films as marvels of cooperation.

  Today the honey bee also appears in discussions of the environment. Campaigns to save the bees have encouraged urban beekeeping on the roofs of offices and hotels, planting of flowers in parks and the sale of seed mixes for gardens. Critics note that city hives, if too numerous, compete with wild pollinators for scarce flowers, and that the most helpful action for bees is the protection of habitat. Even so, the honey bee has gained a place in public affection that few insects can match.

  ## Research and the future

  The honey bee genome was sequenced in 2006 and revealed that the species has fewer genes for immunity than other insects but more for smell and taste. Researchers use bees to study learning, since a bee can be trained to associate a scent with a sugar reward in a few trials and shows surprising feats of memory, including the recognition of human faces in laboratory tests. Engineers study how a colony decides, divides labour and responds to damage, and borrow the rules for programs that route messages or coordinate robots.

  Several lines of research aim to help the bees themselves. Breeders seek lines that resist varroa without chemical treatment, microbiologists are testing probiotic mixtures for the gut of the bee, and engineers have built hives with sensors that record weight, temperature and sound, so that a keeper can tell from a phone when a colony is about to swarm. Radio tags the size of a grain of rice are used to follow individual foragers.

  Citizen science has become part of this work. Volunteers record the first bee seen each spring, photograph the flowers their hives use, and send samples of pollen for analysis, creating maps of the food supply that no university team could collect alone. Schools run observation hives behind glass, in which children can watch the dance, the queen and the emerging workers in a safe setting.

  Climate adds a further uncertainty. Warmer winters can lead colonies to keep rearing brood when there are no flowers, burning through their stores, while early springs may bring the first blossom before the bees have built up their strength. Droughts reduce the nectar that flowers produce, and heavy rain keeps foragers inside. Keepers in many regions now feed their colonies more often than their grandparents did, and some have moved their hives to cooler uplands for the summer.

  The future of the honey bee depends on the choices made by farmers, gardeners and governments. The bee itself is not endangered as a species, since managed colonies are abundant, yet the health of those colonies, and of the wild bees that share their flowers, remains an urgent matter. Wide margins of wild flowers on farms, restrictions on the harmful chemicals, careful control of varroa and support for the small beekeepers who look after most of the hives are measures that experts agree would help.
