<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>langai · auto tagging</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <nav id="nav" data-page="autotag/"><a class="home" href="../">langai examples</a></nav>
  <h1>Auto tagging</h1>
  <div id="info" class="info">loading…</div>
  <div class="actions">
    <label class="check" title="the language the recommended tags are written in">recommend in
      <select id="lang">
        <option value="" selected>the note's language</option>
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="it">Italian</option>
      </select>
    </label>
    <label class="check" title="recommend paths that extend your tags into a tree, such as cooking / baking / sourdough, instead of single words"><input id="tree" type="checkbox"> as a tree</label>
    <button id="warm" class="button" title="Scope.Warm: bring the Tagger up to the notebook's revision and embed every note its cache does not hold yet. Over a full cache it embeds nothing; after a switch of embedding models it embeds everything, once.">warm</button>
    <button id="samples" class="button" hidden data-hand="0" title="import the eval golden set: its 15 tags and 84 documents in English, Spanish and German, with no hand tags, so every tag is judged by its name">load samples</button>
    <button id="samples-tagged" class="button" hidden data-hand="2" title="the same, and each tag put by hand on the first two documents that expect it (English ones), so it learns from examples; on samples loaded already, adds just those hand tags">load samples, partly tagged</button>
  </div>
</header>
<main>
  <aside class="tags">
    <h2>Tags</h2>
    <form id="addtag" class="row"><input id="tagname" placeholder="new tag, e.g. cooking / baking" autocomplete="off"><button class="button" type="submit">add</button></form>
    <p class="hint">Click a tag to show the notes that carry it. <span class="chip hand mini">hand</span> notes it was put on by hand, which it learns from; <span class="chip auto mini">auto</span> notes the Tagger picks it for.</p>
    <div id="filter" class="filter" hidden></div>
    <ul id="taglist"></ul>
  </aside>
  <section class="notes">
    <form id="addnote" class="newnote">
      <input id="notetitle" placeholder="title (optional)" autocomplete="off">
      <textarea id="notetext" rows="3" placeholder="a note, a bookmark, a paragraph… in any language"></textarea>
      <button class="button" type="submit">add note</button>
    </form>
    <div id="summary" class="summary"></div>
    <div id="notelist"></div>
  </section>
</main>
<script src="../assets/ui.js"></script>
<script src="app.js"></script>
</body>
</html>
