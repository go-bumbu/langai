  - id: en-go-modules
    lang: en
    title: Managing dependencies with Go modules
    excerpt: How go.mod and go.sum pin every dependency to an exact version.
    site: go.dev
    text: |
      A Go module is a tree of packages with a go.mod file at its root. The file names the module, states the Go version it was written for, and lists every dependency with the exact version the build should use. Because the version is written down, two machines building the same commit resolve the same code, and a build does not change because a library published a new release overnight.

      The go.sum file sits next to it and records a cryptographic hash for every module version the build has seen. When the toolchain downloads a dependency it checks the bytes against that hash, so a tampered or republished archive fails loudly instead of slipping into the binary. Both files belong in version control.

      Day to day the commands are few. Adding an import and running go mod tidy pulls the dependency in at its latest tagged version and removes anything no longer imported. Upgrading a single dependency is go get with the module path and the version you want. When a dependency drops a function you relied on, the fix is to pin the older version until you have migrated, not to vendor a copy.
    tags: [dev / go]
  - id: en-go-concurrency
    lang: en
    title: Bounding goroutines with a worker pool and a context
    excerpt: Start goroutines freely, but cap how many run at once and stop them all when the caller gives up.
    site: backendnotes.dev
    text: |
      Goroutines are cheap enough that starting one per task is tempting, and for a handful of tasks it is fine. The trouble starts when the task list comes from outside. Ten thousand URLs to fetch or rows to process turn into ten thousand goroutines, each holding a connection or a file handle, and the database or API on the other end starts refusing requests long before the Go runtime runs out of anything.

      The classic answer is a fixed pool of workers reading from a shared channel. You start, say, eight goroutines that each range over a jobs channel, send their results to a second channel and return when the jobs channel is closed. A sync.WaitGroup tracks them, so one extra goroutine can wait for every worker to finish and then close the results channel, which ends the consumer's range loop cleanly.

      When the work does not fit a queue, a semaphore does the same job with less ceremony. A buffered channel with a capacity of eight is one: send an empty struct into it before starting each goroutine and receive from it when the goroutine finishes, and the ninth send blocks until a slot frees up. The errgroup package wraps this pattern in SetLimit and collects the first error as well.

      Whichever shape you pick, pass a context.Context to every worker. When the request that started the batch is cancelled or hits its deadline, ctx.Done() is closed, each worker notices it in a select and returns instead of taking the next job. Without that, an abandoned batch keeps hammering the backend long after anyone stopped waiting for the answer.
    tags: [dev / go]
  - id: en-css-grid
    lang: en
    title: CSS grid layouts that adapt without media queries
    excerpt: Named template areas and auto-fit columns let one grid declaration handle phones and wide screens alike.
    site: layoutlab.dev
    text: |
      CSS grid works on two axes at once, which is what sets it apart from flexbox. You describe the columns and rows on the container, and the children flow into the cells in order unless you place them elsewhere. For a page skeleton, grid-template-areas is the most readable way to do that: you draw a small text map of the layout with names such as header, sidebar, main and footer, and each child claims its region with grid-area.

      The declaration that removes most breakpoints fits on one line: grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)). It asks the browser to fit as many columns as it can, each at least 16rem wide, and to share the leftover space equally. On a phone that gives one column, on a tablet two, on a wide monitor four or five, and you never wrote a media query. Wrapping the minimum in min(16rem, 100%) keeps a single column from overflowing a very narrow screen. With auto-fill instead of auto-fit the empty tracks are kept, which stops two lonely cards from stretching across a wide screen.

      Grid is also the shortest way to centre something in both directions. A container with display: grid and place-items: center puts its child in the middle horizontally and vertically, whatever their sizes. Add gap instead of margins between items, and most layouts that once needed a CSS framework fit in a dozen lines.
    tags: [dev / web]
  - id: en-http-caching
    lang: en
    title: HTTP caching with Cache-Control and ETags
    excerpt: Which headers let browsers and CDNs reuse a response, and how revalidation saves bandwidth.
    site: webperfnotes.net
    text: |
      Every HTTP response can tell the caches it passes through how long they may reuse it. A file whose name contains a content hash, such as app.3f9a2c.js, can be served with Cache-Control: max-age=31536000, immutable, and the browser keeps it for a year without asking again; when the code changes, the build emits a new file name and the HTML points to it. HTML itself is the opposite case. It usually gets no-cache, which does not forbid storing the page but forces the browser to check with the server before every reuse.

      That check is a conditional request. The first response carries an ETag, an opaque fingerprint of the content, or a Last-Modified date. Next time the browser sends the value back in If-None-Match or If-Modified-Since, and if nothing has changed the server answers 304 Not Modified with an empty body. The round trip still happens, but a few hundred bytes cross the network instead of the whole document.

      A CDN sits in the middle and plays by the same rules. It stores responses at its edge locations according to Cache-Control, and s-maxage gives shared caches a different lifetime from browsers, for example an API response kept for sixty seconds at the edge while browsers revalidate every time. The private directive keeps personalised responses out of shared caches entirely. With the headers right, most manual purges become unnecessary, because stale content simply expires on schedule and revalidation keeps the rest cheap.
    tags: [dev / web]
  - id: en-code-review
    lang: en
    title: Code reviews that actually help
    excerpt: Keep changes small, mind the tone and spend reviewer attention where only a person can help.
    site: teamcraft.dev
    text: |
      The most effective thing a team can do for its code reviews happens before anyone opens a diff: keep the changes small. A pull request of two hundred lines gets read carefully; one of two thousand gets skimmed and approved with a sigh. Splitting the work into a refactor that changes no behaviour, followed by the feature on top of it, makes both halves easier to judge and easier to revert.

      Tone matters more than most engineers admit. Written comments sound colder than the same words said across a desk, so phrase them as questions when you are unsure, and say plainly when something blocks the merge. Marking minor points with "nit" tells the author they can take them or leave them without a debate. And when something is well done, say so. A line about what you liked costs nothing and teaches as much as a correction.

      As for what to look for, start with correctness and design. Does the change do what its description claims, are the edge cases and error paths handled, and will the next person understand why it is written this way? Tests deserve as much attention as the code they cover, since a test that cannot fail protects nothing. Formatting and naming conventions belong to linters and formatters, not to people, so that review time goes to the questions only a human can answer.
    tags: [dev]
  - id: en-git-branching
    lang: en
    title: A branching workflow for a small team
    excerpt: Short-lived branches off main, unfinished work behind feature flags and one clear rule for rebase versus merge.
    site: shipsmall.dev
    text: |
      For a team of three to eight developers, the workflow that causes the least pain is also the simplest. Everyone branches from main, works for a day or two and merges back. Long-lived feature branches look tidy, but they drift further from main every day, and the merge at the end turns into an afternoon of resolving conflicts in code nobody remembers writing.

      The usual objection is that some features take weeks. That is what feature flags are for. Merge the half-built checkout page behind a flag that is off in production, keep shipping small pieces of it, and switch it on when it is done, first for the team and then for everyone. Delete the flag once it has been on for a release or two, or the codebase fills up with dead code paths that nobody dares to remove.

      On rebase versus merge, pick one rule and write it down. A common one is to rebase your own branch on main as often as you like while nobody else works on it, because rewriting history that only you have seen is harmless, and never to rebase a branch someone else has pulled. When the branch lands, a squash merge keeps main readable with one commit per change, while a merge commit preserves every intermediate step if the team finds them useful in git log.
    tags: [dev]
  - id: en-weeknight-pasta
    lang: en
    title: Twenty-minute tomato pasta from the pantry
    excerpt: Canned tomatoes, garlic and a splash of starchy pasta water make a sauce that clings to every strand.
    site: weeknightkitchen.com
    text: |
      Put a large pot of well-salted water on to boil before you do anything else, because it is the slowest step. While it heats, slice four cloves of garlic thinly and warm them in a wide pan with three tablespoons of olive oil over medium-low heat. They should turn pale gold and fragrant, not brown, which takes about three minutes. Add a pinch of chilli flakes at the end if you like some heat.

      Tip in a 400-gram can of whole peeled tomatoes and crush them in the pan with a wooden spoon. Season with salt, raise the heat and let the sauce bubble steadily for ten to twelve minutes, stirring now and then, until it thickens and the oil starts to pool at the edges. Meanwhile, cook 300 grams of spaghetti or penne for two minutes less than the packet says.

      Before draining, scoop out a mug of the cooking water. Move the pasta straight into the sauce, add a good splash of that water and toss everything over high heat for the last two minutes. The starch in the water binds the oil and tomato into a glossy sauce that coats the pasta instead of sliding off it. Finish with torn basil and a little grated parmesan. From cold pot to full plate it takes about twenty minutes, and it feeds two hungry people or three modest ones.
    tags: [cooking / recipes]
  - id: en-chicken-curry
    lang: en
    title: A simple coconut chicken curry
    excerpt: A five-minute spice paste, a can of coconut milk and a gentle simmer turn chicken thighs into a weeknight curry.
    site: spiceandpot.com
    text: |
      Most of the flavour in this curry comes from a paste you make in five minutes. Blend one onion, four garlic cloves, a thumb-sized piece of ginger and two fresh green chillies with a teaspoon each of ground cumin, coriander and turmeric and half a teaspoon of garam masala, adding a spoonful of oil to help it come together. Fry the paste in a heavy pan over medium heat for eight to ten minutes, stirring often, until the raw onion smell has gone and the oil begins to separate.

      Cut 600 grams of boneless chicken thighs into bite-sized pieces, add them to the pan and turn them in the paste for a few minutes until no pink shows on the outside. Pour in a 400-millilitre can of coconut milk with half a can of water and a teaspoon of salt, and bring it to a gentle simmer. Thighs stay juicy through a longer cooking time where breast meat would dry out.

      Simmer uncovered for twenty to twenty-five minutes, until the chicken is tender and the sauce is thick enough to coat a spoon. If it reduces too quickly, add a splash of water. Taste before serving: a squeeze of lime brightens it, a pinch of sugar rounds off the heat, and a handful of spinach wilts into it within a minute. Serve with basmati rice or warm flatbread and fresh coriander on top.
    tags: [cooking / recipes]
  - id: en-sourdough
    lang: en
    title: Starting a sourdough starter from scratch
    excerpt: Flour, water and about a week of daily feedings, plus the signs that tell you it is ready to bake with.
    site: crumbandcrust.net
    text: |
      A sourdough starter is nothing more than flour and water in which wild yeasts and lactic acid bacteria have settled. To begin, stir 50 grams of wholemeal or rye flour with 50 grams of lukewarm water in a clean jar, cover it loosely and leave it somewhere around 24 to 26°C. Whole grains carry more of the microbes and nutrients that get fermentation going than white flour does.

      For the next week, feed it once a day at roughly the same time. Discard all but 50 grams, add 50 grams of flour and 50 grams of water and stir well. Around day two or three it often bubbles up dramatically and then goes quiet. That first burst comes from bacteria that do not last, and the lull that follows is normal, so keep feeding. Somewhere between day five and day ten the yeast takes over.

      If the starter is not rising, the cause is nearly always temperature or flour. A cold kitchen slows everything down, so move the jar into the oven with only the light on, or onto a warm shelf, and feed it with rye for a few days. Heavily chlorinated tap water can also hold it back; leave the water to stand overnight or use filtered water.

      It is ready when it reliably doubles in volume within four to eight hours of a feeding, smells pleasantly sour rather than of nail polish, and is bubbly all the way through. Bake your first loaf with it at that peak. From then on it can live in the fridge and be fed once a week.
    tags: [cooking / baking]
  - id: en-knife-skills
    lang: en
    title: Knife skills every home cook should learn
    excerpt: How to hold a chef's knife, dice an onion, cut a julienne and keep the edge sharp.
    site: homecookbasics.org
    text: |
      Most people hold a kitchen knife by the handle alone, with the index finger stretched along the spine. It feels secure but gives poor control. The pinch grip is better: wrap your lower three fingers around the handle and pinch the blade just in front of the bolster between your thumb and the side of your index finger. The other hand forms a claw, fingertips tucked back, so the flat of the blade rides against the knuckles and the fingertips stay out of the way.

      Dicing an onion shows why technique matters. Halve it through the root, peel it and lay each half flat. Make vertical cuts towards the root without cutting through it, then one or two horizontal cuts, and finally slice across. The root holds everything together until the last cut, and the onion falls away in even cubes. A julienne works on the same principle: square off a carrot, cut it into planks about three millimetres thick, stack them and cut them into matchsticks.

      None of this works with a dull blade, which skids off a tomato skin and is more dangerous than a sharp one. A honing steel realigns the edge and is worth a few strokes before each use, but it removes almost no metal. Every few months the knife needs real sharpening on a whetstone, starting on a medium grit around 1000 and finishing on a finer one while holding a steady angle of about 15 to 20 degrees.
    tags: [cooking]
  - id: en-alpine-hut-hike
    lang: en
    title: Hut-to-hut hiking in the Alps for beginners
    excerpt: How to book mountain huts, plan sensible stages and pack for several days on the trail.
    site: trailandsummit.com
    text: |
      Walking from one mountain hut to the next for several days is one of the best ways to see the Alps, and it takes less experience than many people think. Plenty of routes follow well-marked paths between huts that lie four to six hours apart, with no glaciers or climbing involved. The season runs from late June to late September, when the huts are staffed and serve dinner and breakfast.

      Booking is the part that needs planning. Popular huts fill up months ahead for July and August, so reserve as soon as your dates are fixed, usually through the hut's own website or a regional booking system, and cancel if your plans change, because the warden will otherwise worry when you do not turn up. A bunk in the dormitory with half board is the standard, and members of an alpine club pay noticeably less, which can make membership worthwhile for a single trip.

      Plan stages conservatively on a first tour. Allow an hour for every 300 to 400 metres of ascent on top of the time for the horizontal distance, start early and aim to arrive by mid-afternoon, before the thunderstorms that build on many summer days.

      Everything you pack, you carry every day, so keep the rucksack under eight kilos. That still leaves room for a waterproof jacket and trousers, a warm fleece or light down layer, a sleeping bag liner, which most huts require, a head torch, earplugs for the dormitory, sun protection, a small first-aid kit, a map and enough cash, since many huts still do not accept cards.
    tags: [travel / hiking]
  - id: en-lisbon-weekend
    lang: en
    title: A weekend in Lisbon
    excerpt: Two days of steep streets, an old yellow tram, custard tarts and viewpoints over the river.
    site: citybreaknotes.com
    text: |
      Lisbon is built on steep hills above the Tagus, and the best way to understand it in a weekend is one neighbourhood at a time. Start in the Baixa, the flat grid of streets rebuilt after the earthquake of 1755, and walk up into Chiado for its bookshops and old cafés. In the evening the Bairro Alto fills with people drinking in the street outside tiny bars, while Alfama, the old quarter below the castle, is where fado drifts out of small restaurants.

      Tram 28 rattles through Graça, Alfama, Baixa and Estrela, and riding it from end to end is a classic. Board at the Martim Moniz terminus early in the morning, before the queues and the pickpockets, or simply use it for a few stops when your legs give out on the hills.

      The other ritual is pastéis de nata, small custard tarts in flaky pastry, best eaten warm with a dusting of cinnamon. Belém, a short tram or train ride west along the river, is famous for them and also has the Jerónimos monastery and the Belém tower. Bakeries all over the city sell good ones for not much more than a euro.

      Save the evenings for the miradouros, the viewpoints scattered across the hills. Senhora do Monte and Graça look over the whole city at sunset, Santa Luzia frames the rooftops of Alfama against the river, and São Pedro de Alcântara is an easy stop on the way to dinner in the Bairro Alto.
    tags: [travel / city guides]
  - id: en-packing-light
    lang: en
    title: Two weeks with one carry-on
    excerpt: Packing light comes down to layers, a laundry plan and leaving the just-in-case items at home.
    site: lighttraveller.net
    text: |
      Two weeks fit into a carry-on of about 40 litres once you stop packing for every day of the trip and pack for five days instead. The rest is laundry. Choose clothes that dry overnight, such as merino wool or synthetic fabrics, and wash a few pieces in the sink every second or third evening with a small bottle of travel detergent, or find a launderette once a week.

      Layers do the work that bulky items would otherwise do. A T-shirt, a long-sleeved base layer, a light fleece and a packable rain jacket combine to cover anything from a hot afternoon to a cold, wet mountain pass. Keep everything to two or three colours that go together, so every top works with every pair of trousers, and wear your heaviest shoes and jacket on the plane.

      The hardest part is deciding what to leave behind. Most just-in-case items, like the third pair of shoes, the hair dryer, full-sized toiletries and the thick book you will not open, either go unused or are easy to buy at your destination. Lay out everything you plan to take and then put a third of it back. A bag that is not stuffed to the zip also leaves room for whatever you bring home.
    tags: [travel]
  - id: en-index-funds
    lang: en
    title: Why index funds beat most stock pickers
    excerpt: Over decades, low fees and broad diversification win more often than clever stock selection.
    site: plainmoneyguide.com
    text: |
      An index fund does not try to find the winners. It buys every company in a market index, such as a world or total-market index, in proportion to its size, and simply holds them. That sounds unambitious, yet year after year most professionally managed funds that do try to pick winners end up behind the index they are measured against, and over twenty or thirty years the share that falls behind grows to a large majority.

      The main reason is arithmetic. Before costs, all investors together own the market and earn its return, so the average actively managed dollar earns the market return too. After costs it must earn less, because someone pays for the research, the frequent trading and the manager's salary. A typical active fund charges one percent a year or more, while a broad index fund costs a small fraction of that, often below 0.2 percent.

      One percent sounds small until it compounds. On a portfolio growing at six percent a year, a fee one point higher leaves you with roughly a quarter less money after thirty years. Picking in advance the few active managers who will outperform has proven close to impossible, because past winners rarely stay on top. For most people, a cheap, broadly diversified index fund held for decades is the boring choice that works.
    tags: [finance / investing]
  - id: en-freelance-taxes
    lang: en
    title: Quarterly estimated taxes for freelancers
    excerpt: Nobody withholds tax from a freelancer's invoices, so the payments and the savings are up to you.
    site: freelancefinance.io
    text: |
      When you work for an employer, tax comes out of every paycheck before you ever see it. As a freelancer nobody does that for you, and the tax office still expects to be paid during the year rather than in one lump sum in spring. In the United States that means estimated tax payments four times a year, due in mid-April, mid-June, mid-September and mid-January, covering both income tax and self-employment tax. Pay too little along the way and a penalty is added on top of what you owe.

      The habit that makes this painless is moving money aside the day a client pays. Many freelancers transfer 25 to 30 percent of every invoice into a separate savings account and treat only the rest as their income. When a quarterly payment falls due, the money is already there, and if the year ends with a surplus it becomes a small bonus rather than a scramble.

      Deductions lower the income that is taxed in the first place, so track them from the first day. Ordinary and necessary business expenses usually qualify: a laptop and software, the business share of your phone and internet bills, professional insurance, coworking fees, and a home office that is used regularly and exclusively for work. Keep every receipt in one folder and note the business purpose, because an expense you cannot document is an expense you cannot claim.
    tags: [finance / taxes]
  - id: en-emergency-fund
    lang: en
    title: How big should your emergency fund be?
    excerpt: Count it in months of essential expenses and keep it somewhere safe, boring and easy to reach.
    site: moneybasics.net
    text: |
      An emergency fund is the money that keeps a lost job, a broken boiler or a surprise dental bill from turning into credit card debt. The usual advice is three to six months of expenses, and the key word is expenses, not income. Add up what you must pay every month no matter what, such as rent or mortgage, utilities, groceries, insurance, transport and minimum loan payments, and multiply.

      Where you land in that range depends on how fragile your income is. A couple with two stable salaries and no children can sit near three months. A single earner, a freelancer with irregular clients or someone in a field where finding a new job takes a long time should aim for six months or more. If that number feels out of reach, start with one month. Even a small cushion changes how an unexpected bill feels.

      The money belongs somewhere safe and easy to reach, but not too easy. A separate savings account with a decent interest rate, ideally at a different bank from your current account, works well: it earns something, it is covered by deposit insurance, and it stays out of sight when you are tempted to spend it. Shares and funds are the wrong place, because the moment you need the money is often the moment markets have fallen.
    tags: [finance]
  - id: en-couch-to-5k
    lang: en
    title: From the couch to 5K in nine weeks
    excerpt: A beginner plan that alternates walking and running until thirty minutes of running feels normal.
    site: runstartclub.org
    text: |
      If you have never run, or not for years, the quickest way to get hurt is to go out and run until you are exhausted. A nine-week plan that alternates walking and running gets you to thirty minutes of continuous running, roughly five kilometres, while giving muscles, tendons and joints time to adapt. Three sessions a week with a rest day between them are enough.

      Every session starts with a brisk five-minute walk. In the first week you then alternate one minute of easy running with ninety seconds of walking for twenty minutes. Each week the running stretches get longer and the walking breaks shorter, so that by the middle of the plan you run for several minutes at a time, and in the final weeks the breaks disappear altogether. The last sessions are a single thirty-minute run.

      Run slowly enough to hold a conversation; most beginners go too fast and then blame their fitness. If a week feels too hard, repeat it rather than pushing on, because there is no prize for finishing in exactly nine weeks. Decent running shoes matter more than any gadget. Some muscle soreness is normal, but sharp pain in the shins or knees is a reason to rest for a few days before carrying on.
    tags: [health / fitness]
  - id: en-protein-basics
    lang: en
    title: How much protein do you need a day?
    excerpt: Per-kilogram guidance for everyday health and for building muscle, and why spreading it over meals helps.
    site: nutritionplain.com
    text: |
      The standard recommendation for healthy adults is 0.8 grams of protein per kilogram of body weight per day, about 56 grams for someone who weighs 70 kilos. That figure is a minimum to avoid deficiency, not an optimum. People who train regularly, older adults trying to hold on to their muscle and anyone losing weight usually do better with more.

      For building muscle, most research points to between 1.6 and 2.2 grams per kilogram a day, which for the same 70-kilo person means roughly 110 to 155 grams. Eating more than that is generally safe for healthy people, but it does not seem to add more muscle. Consistent strength training and enough total calories matter more than squeezing in extra grams.

      How you spread it over the day counts too. Muscle repair responds best to portions of about 20 to 40 grams, so three or four meals that each contain a solid protein source work better than a small breakfast and a huge dinner. Greek yoghurt or eggs in the morning, beans or chicken at lunch, fish or tofu in the evening and a snack of cottage cheese add up to well over 100 grams without a single shake.
    tags: [health / nutrition]
  - id: en-sleep-hygiene
    lang: en
    title: Sleep habits that actually work
    excerpt: A fixed wake-up time, morning daylight, an early last coffee and a calmer hour before bed.
    site: restfulnights.org
    text: |
      If you change only one thing about your sleep, make it the time you get up. Rising at the same time every day, weekends included, anchors your body clock more firmly than a fixed bedtime, because you cannot force yourself to fall asleep but you can set an alarm. After a week or two, the evening tiredness starts to arrive at a predictable hour.

      Light is the signal your internal clock listens to most. Twenty minutes outdoors in the morning, even under a grey sky, tells it the day has begun, and it brings the sleepy feeling forward in the evening. At night the opposite applies: dim the lamps in the last hour or two and keep the bedroom dark and quiet.

      Caffeine has a half-life of around five to six hours, so half of a four o'clock coffee is still circulating at ten. A cutoff around noon or early afternoon helps most people. Alcohol deserves a look too, since it makes you drowsy but breaks up the second half of the night.

      Screens matter less for their light than for what they show. An exciting series or an argument in the comments keeps your mind busy long after you put the phone down. Charge it outside the bedroom, use an ordinary alarm clock and spend the last half hour on something calm, like a paper book.
    tags: [health]
  - id: en-meal-prep-bowls
    lang: en
    title: Meal-prep grain bowls for a week of lunches
    excerpt: One Sunday session of grains, roasted vegetables and a protein covers five balanced lunches.
    site: prepandplate.com
    text: |
      An hour and a half on Sunday is enough to cover lunch from Monday to Friday. The formula for each bowl is simple: a portion of whole grains, a generous amount of vegetables, a protein and a sauce that ties it together. Cooked in bulk and kept in separate containers, the components can be combined differently each day so the week does not get boring.

      Start the grains first. A pot of brown rice, quinoa or farro, cooked and spread out on a tray to cool quickly, stays loose rather than clumping in the fridge. While it cooks, roast two trays of vegetables at 220°C: broccoli, peppers and red onion on one, cubes of sweet potato and carrot on the other, all tossed in oil and salt. For protein, simmer a big pot of chickpeas or lentils, which keep well for several days and cost very little, and bake a few chicken thighs or a block of tofu for variety.

      Aim for each bowl to bring 25 to 35 grams of protein, a fist-sized portion of grains for slow-release carbohydrates and at least two handfuls of vegetables for fibre. Keep sauces such as tahini with lemon or a yoghurt and herb dressing in small jars and add them just before eating so nothing goes soggy. Most cooked components keep three to four days in the fridge, so freeze Thursday's and Friday's bowls on Sunday and move them to the fridge the night before.
    tags: [cooking / recipes, health / nutrition]
  - id: en-go-generics
    lang: en
    title: Type parameters in Go without overdoing it
    excerpt: Where a generic function earns its keep, how constraints work, and when a plain interface is still the better tool.
    site: go.dev
    text: |
      Before type parameters, a function that summed a slice of ints and one that summed a slice of float64s were two copies of the same six lines, or one function taking interface{} and a type switch. Since Go 1.18 you can write func Sum[T Number](xs []T) T once, and the compiler checks every call site against the constraint instead of waiting for a panic at runtime.

      The constraint is an interface that lists the operations the body needs. Number can be an interface holding a union of the numeric types with a tilde, so that named types with an underlying int still qualify, and the constraints package in golang.org/x/exp collects the common ones. comparable is built in and is what a generic map key or a Contains helper needs. If the body only ever calls methods, an ordinary interface with those methods is the right constraint, and often the right non-generic parameter type too.

      A good rule: reach for a type parameter when the function would otherwise be copied per element type, as with Map, Filter, Keys or a typed cache. Do not reach for it to avoid naming a concrete type, and do not make a struct generic just because one field could vary. Generic code is harder to read, the error messages are longer, and in most services the handful of helpers in a small internal package is all the generics the codebase ever needs.
    tags: [dev / go]
  - id: en-go-pipelines
    lang: en
    title: "Channel pipelines: who closes what"
    excerpt: Building a chain of goroutine stages where every channel has exactly one owner that closes it.
    site: backendnotes.dev
    text: |
      A pipeline is a series of stages connected by channels: each stage receives values from the previous one, does something to them and sends the results on. The first stage, the generator, usually ranges over a slice or reads a file and sends each item into a channel it then closes. Every later stage ranges over its input, which ends when that channel closes, and closes its own output when the range loop finishes. Closing is how the end of the stream propagates to the end of the chain.

      The rule that keeps this from deadlocking is that a channel is closed by the goroutine that sends on it, never by a receiver, and by exactly one goroutine. When a stage fans out to several goroutines over the same output channel, none of them may close it; instead a small helper waits for all of them with a sync.WaitGroup and closes the channel once. The same helper is the fan-in: several producer channels merged into one consumer channel.

      Buffered channels between stages let a fast stage run ahead of a slow one by a few items, which smooths jitter but does not change the throughput, which is set by the slowest stage. For early exit, every stage selects on a done channel alongside its send, so a consumer that stops reading does not leave producers blocked forever. Written this way each stage is a plain function that takes an input channel and returns an output channel, and the pipeline reads as a list of calls.
    tags: [dev / go]
  - id: en-cors
    lang: en
    title: Why the browser blocks your cross-origin request
    excerpt: The same-origin policy, the preflight OPTIONS request, and the headers the server has to send back.
    site: layoutlab.dev
    text: |
      A page served from one origin, meaning scheme, host and port together, cannot read the response of a request it makes to another origin unless that other origin says so. The request itself usually leaves the browser; it is the response that the browser withholds from your JavaScript, which is why the network tab shows a 200 while the console shows a CORS error. The rule exists so that a random site cannot use your logged-in cookies to read your bank's pages.

      The server opts in with response headers. Access-Control-Allow-Origin names the origin allowed to read the response, or * for anyone, which is fine for a public read-only API and wrong for anything that uses cookies. For requests that are not simple, meaning a method other than GET or POST, a JSON content type, or a custom header such as Authorization, the browser first sends an OPTIONS request, the preflight, and expects Access-Control-Allow-Methods and Access-Control-Allow-Headers in the answer before it sends the real request.

      Credentials are the usual trap. If the frontend sets credentials: include, the server must answer with Access-Control-Allow-Credentials: true and an explicit origin, not a wildcard, and the cookie needs SameSite=None and Secure to travel at all. During development the simplest fix is often none of this: proxy the API through the dev server so the browser sees one origin, and configure CORS only for the origins that really need it in production.
    tags: [dev / web]
  - id: en-git-rebase
    lang: en
    title: Cleaning up a branch before the pull request
    excerpt: Interactive rebase to squash, reorder and reword commits, and the one rule about shared history.
    site: devhabits.io
    text: |
      A branch that grew over a week usually carries commits like fix typo, wip, and address review, which tell a reviewer nothing. Before opening the pull request, git rebase -i against the base branch opens the list of commits in an editor, where each line can be kept, squashed into the one above, reworded, reordered or dropped. The result is a short series of commits that each do one thing and whose messages explain why, which is what makes git log and git blame useful a year later.

      Conflicts during a rebase are resolved one commit at a time: fix the files, git add them, git rebase --continue, and if it goes badly git rebase --abort returns the branch to where it started. Autosquash makes the common case automatic. Commit a fix with git commit --fixup followed by the hash of the commit it repairs, and rebase -i --autosquash will place and mark it for you.

      The rule that must not be broken is to rewrite only history nobody else has built on. Once a branch has been pushed and a colleague has branched from it or reviewed specific commits, rebasing it replaces those commits with new ones and leaves everyone else with a conflict. On a personal branch, force-pushing with --force-with-lease is routine; on anything shared, merge instead and keep the history as it happened.
    tags: [dev]
  - id: en-fresh-pasta
    lang: en
    title: Fresh egg pasta by hand
    excerpt: Flour, eggs, a rolling pin and some patience make tagliatelle better than anything from a packet.
    site: thekitchentable.co
    text: |
      Fresh pasta needs only flour and eggs: one large egg per hundred grams of flour, so three eggs make enough for four people. Tip the flour onto a clean counter, make a wide well in the middle, crack the eggs into it and beat them with a fork, drawing in flour from the walls a little at a time until a shaggy dough forms. Then knead with the heel of your hand for a full ten minutes, until the ball is smooth, springy and no longer sticky. Wrap it and let it rest for at least half an hour so the gluten relaxes.

      Rolling by hand works without a machine. Cut the dough in quarters, keep the rest wrapped, flatten one piece and roll from the centre outwards, turning it a quarter each pass and dusting with flour only when it sticks. Keep going until the sheet is thin enough to see the grain of the counter through it. For tagliatelle, flour the sheet, roll it loosely into a flat log and slice it into ribbons just under a centimetre wide, then shake them out and toss them in a little semolina.

      It cooks in two to three minutes in plenty of well-salted water and wants a sauce that clings rather than drowns: butter and sage, a slow ragù, or just the starchy cooking water, grated cheese and pepper. Any ribbons you do not cook can be dried on a rack for a day or frozen in nests.
    tags: [cooking / recipes]
  - id: en-no-knead-bread
    lang: en
    title: No-knead bread in a Dutch oven
    excerpt: A wet dough, a tiny pinch of yeast and an overnight rest do the work your hands would.
    site: thekitchentable.co
    text: |
      This loaf gets its structure from time rather than kneading. Stir together four hundred grams of bread flour, eight grams of salt, a quarter teaspoon of instant yeast and about three hundred millilitres of cool water until no dry flour remains. It will be far wetter and shaggier than a dough you could knead, and that is the point. Cover the bowl and leave it on the counter for twelve to eighteen hours, until the surface is bubbly and the dough has more than doubled.

      Turn it out onto a floured surface, fold it over itself a few times and shape it loosely into a ball. Let it rest seam side down on a floured towel for about two hours while the oven heats to its highest setting with a lidded cast-iron pot inside. The pot is the trick: the lid traps the steam from the dough, which keeps the crust soft long enough for the loaf to spring up, and then the dry heat after you take the lid off browns it deeply.

      Drop the dough into the hot pot, lid on, thirty minutes; lid off, another fifteen to twenty until the crust is dark brown. Cool it on a rack for an hour before cutting, however good it smells, because the crumb is still setting. The whole thing takes ten minutes of actual work spread across a day, and it keeps for three days in a paper bag.
    tags: [cooking / baking]
  - id: en-rebalancing
    lang: en
    title: Rebalancing a portfolio without overthinking it
    excerpt: When your stocks have grown past their target share, selling a little is risk management, not market timing.
    site: plainmoney.org
    text: |
      Suppose you decided on seventy percent stocks and thirty percent bonds. After a strong year the stocks are worth eighty percent of the whole, which means you are now carrying more risk than you chose, and the next downturn will hit harder than you planned for. Rebalancing is moving money back to the target mix: selling some of what grew and buying what lagged. It feels like the opposite of what the market is rewarding, and that is the point; it is a mechanical way to take profit and buy low without a view on what happens next.

      Two triggers work. Calendar rebalancing checks the allocation once a year, on a date you will remember, and adjusts if it is off. Threshold rebalancing acts whenever any holding drifts more than, say, five percentage points from its target. Checking more often than quarterly adds trading costs and taxes for no measurable benefit. In a taxable account, prefer to rebalance with new contributions and dividends directed at the underweight asset, so that nothing has to be sold and no gain is realised.

      Rebalancing does not apply within a single broad index fund, which rebalances itself by construction. It matters between asset classes, between regions if you hold them separately, and between the stock and bond halves of a plan. If a single stock has become a large share of your net worth, the same logic applies with more urgency.
    tags: [finance / investing]
  - id: en-interval-training
    lang: en
    title: Getting faster once you can run for thirty minutes
    excerpt: "Interval sessions, a weekly long run and easy days: the week that turns a jogger into a runner."
    site: runeasy.fit
    text: |
      Once you can jog for half an hour without stopping, more of the same makes you fitter only slowly. What moves your pace is spending part of the week running faster than feels comfortable and the rest running slower than feels necessary. Three runs a week is enough: one interval session, one long easy run and one relaxed run of thirty to forty minutes.

      The interval session starts with ten minutes of easy jogging, then repeats of a hard effort with a recovery jog between them. A good first version is six times two minutes at a pace you could hold for about fifteen minutes, with two minutes of jogging after each. Over a couple of months the repeats get longer, four times five minutes, then three times eight, while the pace stays controlled: the last repeat should feel like the first, not like a sprint finish.

      The long run grows by about ten percent a week and should be slow enough to talk in full sentences. Everything else is recovery, and skipping the easy days to do more hard ones is the surest way to a sore shin or a lost month. After eight to ten weeks, run a timed five kilometres and set the next block of paces from that.
    tags: [health / fitness]
